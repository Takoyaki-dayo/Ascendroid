<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ascendroid</title>
<meta name="theme-color" content="#0a0f15">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: fixed 844x390 landscape stage, scaled to fit. Back to front: battle-forecast screen, characters in a row with their own HP/status underneath, parts column at left, tall cards peeking from the bottom edge.
   Color is meaning only, on a blue-tinted night palette: cyan = you and what you operate (now, cost, selection), red = threat, violet = charge/JUST. */
:root{
  --bg:#0a0f15; --panel:#0f1720; --raised:#121c27; --line:#1c2937; --grid:#1b2938;
  --fg:#e6eef5; --fg2:#b4c6d4; --dim:#8a9fb2; --dim2:#566b7f; --neutral:#d3e2ee;
  --cy:#38d3ff; --cy-dim:#2d6f88; --foe:#ff4d6a; --foe2:#ff8a9c; --just:#b18cff; --just2:#cbb2ff;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Chakra Petch","BIZ UDPGothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;overflow:clip}
#rot{display:none;position:absolute;left:0;right:0;top:10px;text-align:center;color:var(--cy);font-size:13px}
@media (orientation:portrait){#rot{display:block}}
#stage{position:absolute;left:50%;top:50%;width:844px;height:390px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;overflow:clip;
  background:radial-gradient(ellipse 520px 220px at 420px 230px, rgba(56,211,255,.05), transparent 70%), var(--bg);font-size:11px;line-height:1.35;touch-action:none}
#stage *{box-sizing:border-box}
#shaker{position:absolute;inset:0}
#world{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .32s cubic-bezier(.2,.8,.2,1),filter .32s}
#shaker.zoomout #world{transform:scale(.8);filter:brightness(.72)}
#shaker.selfview #world{transform:scale(.64);filter:brightness(.55)}
#parts,#hand,.pile{transition:opacity .25s,transform .25s}
#shaker.selfview #parts,#shaker.selfview #hand,#shaker.selfview .pile,#shaker.selfview #redraw{opacity:0;pointer-events:none;transform:translateY(24px)}
#inner{position:absolute;left:8px;top:8px;width:828px;height:204px;border:1px solid var(--line);border-radius:10px;background:rgba(15,23,32,.95);box-shadow:0 12px 30px rgba(0,0,0,.5);
  display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:18px;padding:12px 14px;transform:translateY(-240px);transition:transform .32s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#shaker.selfview #inner{transform:none;pointer-events:auto}
.face{display:flex;flex-direction:column;gap:7px;min-width:0}
.face svg{display:block}
.mono{font-size:11px;line-height:1.55;color:var(--fg);border-left:2px solid var(--cy);padding-left:7px}
.diag{display:flex;flex-direction:column;gap:3px;min-width:0}
.drow{display:grid;grid-template-columns:14px 30px minmax(0,1fr) 70px 18px;align-items:center;column-gap:6px}
.drow .ic{color:var(--fg)}
.drow .dn{font-weight:700;font-size:10.5px}
.drow .dp{font-size:10px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .pips{margin:0}
.drow .pnum{text-align:right}
.drow .de{grid-column:3/6;font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.drow.broken .ic,.drow.broken .dn{color:var(--dim2)}
.drow.broken .dp{text-decoration:line-through;color:var(--dim2)}
.mem{display:flex;flex-direction:column;gap:5px;min-width:0;overflow:auto}
.mh{display:flex;align-items:center;gap:5px;color:var(--fg2);font-family:var(--f-num);font-weight:700;font-size:12px}
.mh .ic svg{width:13px;height:13px}
.ml{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.mc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:1px 5px 1px 2px;font-size:10px;background:var(--raised)}
.mc i{font-style:normal;width:14px;height:14px;border-radius:7px;border:1px solid var(--cy);color:var(--cy);font-family:var(--f-num);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mc b{font-family:var(--f-num);color:var(--cy);font-size:10px}
#shaker.shake{animation:shake .28s linear}
@keyframes shake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,0)}}
button{font:inherit;color:inherit;cursor:pointer;padding:0;margin:0;background:none;border:0;text-align:left}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.ic{display:inline-flex;flex:none}
.ic svg{width:12px;height:12px;display:block}
.np{pointer-events:none}

/* timeline */
#tl{position:absolute;inset:0;transition:opacity .2s}
#shaker.executing #tl{opacity:.62}
#screen{position:absolute;left:92px;top:8px;width:706px;height:162px;border:1px solid #1a2836;border-radius:6px;
  background:repeating-linear-gradient(180deg,rgba(56,211,255,.018) 0 1px,transparent 1px 3px),linear-gradient(180deg,#0e1822,#0c141d)}
.tl{position:absolute;top:26px;width:1px;height:140px;background:var(--grid)}
.tn{position:absolute;top:10px;width:20px;text-align:center;font-family:var(--f-num);font-size:10px;color:#4b8ba5;transition:color .12s}
.tn.hit{color:var(--bg);background:var(--cy);border-radius:3px;font-weight:700;box-shadow:0 0 8px rgba(56,211,255,.6)}
#nowTri{position:absolute;left:164px;top:11px}
#nowLine{position:absolute;left:169px;top:22px;width:2px;height:146px;background:var(--cy);box-shadow:0 0 6px rgba(56,211,255,.5)}
#swiftBand{position:absolute;top:22px;height:144px;background:linear-gradient(90deg,rgba(56,211,255,0),rgba(56,211,255,.12));border-left:1px dashed rgba(56,211,255,.45);transition:left .15s,width .15s}
.rowline{position:absolute;left:170px;height:1px;width:612px;background:rgba(169,188,203,.1)}
.rowline.tgt{background:rgba(56,211,255,.5)}
.rowline.dead{opacity:.3}
.rowtag.trk{background:transparent;color:var(--dim)} .rowtag.trk svg{width:11px;height:11px}
.rowtag{position:absolute;left:788px;width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:10px;font-weight:700;background:#1e2c3a;color:var(--fg)}
.rowtag.tgt{background:var(--cy);color:var(--bg)}
.rowtag.dead{opacity:.3}
.rowhit{position:absolute;left:170px;width:620px;height:34px}
#pvRegion{position:absolute;left:171px;top:24px;height:144px;background:linear-gradient(90deg,rgba(56,211,255,.05),rgba(56,211,255,.15));border-top:1px solid rgba(56,211,255,.35);border-bottom:1px solid rgba(56,211,255,.35)}
#pvLine{position:absolute;top:22px;width:2px;height:146px;background:var(--cy);box-shadow:0 0 8px rgba(56,211,255,.8)}
#selfBar{position:absolute;top:25px;height:9px;border-radius:3px;transition:left .13s linear,width .13s linear}
#selfBar.pre{background:repeating-linear-gradient(135deg,rgba(56,211,255,.95) 0 5px,rgba(56,211,255,.62) 5px 10px);box-shadow:0 0 8px rgba(56,211,255,.45)}
#selfBar.cast{background:var(--cy);box-shadow:0 0 10px rgba(56,211,255,.7)}
#selfBar.broken{background:var(--foe);animation:barbreak .38s ease-out forwards}
@keyframes barbreak{0%{opacity:1;transform:none}40%{opacity:1;transform:scaleY(2.2)}100%{opacity:0;transform:scaleY(.2) translateY(-6px)}}
.mk{position:absolute;width:26px;height:22px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:4px;border:1.5px solid var(--foe);background:#2a1220;color:#ffe0e6;transition:left .13s linear,top .2s,opacity .2s,transform .2s,box-shadow .15s}
.mk b{font-family:var(--f-num);font-size:12px;font-weight:700}
.mk span{font-size:9.5px}
.mk .ic svg{width:10px;height:10px}
.mk.later{opacity:.74}
.mk.ch{border-color:var(--just);background:#1f1838;color:#efe6ff;border-radius:11px}
.mk.dl{border:1px solid #3d5163;background:var(--raised);color:var(--fg2)}
.mk.danger{box-shadow:0 0 0 3px rgba(255,77,106,.42)}
.mk.just{background:var(--just);color:#1a1030;box-shadow:0 0 16px rgba(177,140,255,.85)}
.mk.fire{transform:scale(1.35);box-shadow:0 0 14px rgba(255,77,106,.8)}
.mk.out{opacity:0!important;transform:scale(1.6)}

/* stage */
#floor{position:absolute;left:0;top:214px;width:844px;height:80px;background:linear-gradient(180deg,transparent,rgba(56,211,255,.035))}
#droid{position:absolute;left:108px;top:142px;width:50px;height:128px;transform-origin:50% 100%}
#droid svg{display:block}
#droid.casting{filter:drop-shadow(0 0 5px rgba(56,211,255,.6))}
#droid.lunge{animation:lunge .36s ease-out}
@keyframes lunge{35%{transform:translateX(72px) rotate(8deg)}100%{transform:none}}
#droid.recoil{animation:recoil .3s ease-out}
@keyframes recoil{25%{transform:translateX(-7px) rotate(-3deg)}100%{transform:none}}
#droid.hit{animation:dhit .3s linear}
@keyframes dhit{0%{filter:brightness(2.2) drop-shadow(0 0 6px rgba(255,77,106,.9))}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{transform:none;filter:none}}
#droid.stagger{animation:stagger .4s ease-out}
@keyframes stagger{30%{transform:rotate(-10deg) translateX(-6px)}100%{transform:none}}
#droid.glitch{animation:glitch .3s steps(4)}
@keyframes glitch{25%{transform:translateX(3px)}50%{transform:translateX(-3px);filter:hue-rotate(60deg)}75%{transform:translateX(2px)}100%{transform:none}}
.foe{position:absolute;top:170px;width:90px;height:100px;transition:opacity .4s,transform .4s,filter .3s}
.foe svg{display:block;width:100%;height:100%}
.foe.atk{animation:fatk .26s ease-out}
@keyframes fatk{40%{transform:translateX(-26px)}100%{transform:none}}
.foe.ehit{animation:fhit .26s ease-out}
@keyframes fhit{0%{filter:brightness(2.4) drop-shadow(-3px 0 #38d3ff) drop-shadow(3px 0 #ff4d6a)}20%{transform:translateX(10px) skewX(-6deg)}35%{transform:translateX(4px);filter:brightness(1.4) drop-shadow(2px 0 #38d3ff) drop-shadow(-2px 0 #ff4d6a)}100%{transform:none;filter:none}}
.foe.ejust{animation:fjust .45s ease-out}
@keyframes fjust{0%{filter:brightness(2) drop-shadow(0 0 10px #b18cff)}30%{transform:translateX(16px) rotate(6deg)}100%{transform:none;filter:none}}
.foe.dead{opacity:0;transform:translateY(14px) scaleY(.85)}
/* 0.23.0: 敵のひとこと・逃走・圧縮機の顎 */
.say{position:absolute;transform:translate(-50%,-100%);max-width:220px;padding:5px 9px 6px;background:rgba(6,10,15,.92);border:1px solid rgba(255,138,156,.55);border-radius:3px;font-size:12px;line-height:1.4;color:#f3e9ec;white-space:nowrap;pointer-events:none;z-index:6;
  clip-path:inset(0 100% 0 0);animation:sayIn .32s steps(10) forwards,sayOut .3s ease-in 2.1s forwards}
.say::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;border-right:1px solid rgba(255,138,156,.55);border-bottom:1px solid rgba(255,138,156,.55);transform:translateX(-50%) rotate(45deg)}
@keyframes sayIn{to{clip-path:inset(0 0 -8px 0)}}
@keyframes sayOut{to{opacity:0;transform:translate(-50%,-112%)}}
.foe.fled{opacity:0 !important;transform:translateX(150px) skewX(-12deg);transition:opacity .55s ease-in,transform .55s ease-in;filter:blur(1px)}
.eu.fled{opacity:0;transition:opacity .4s}
.sp-jaw{animation:chew 1.1s ease-in-out infinite}
@keyframes chew{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-3px)}}
.sp-flame{transform-box:fill-box;transform-origin:right center}
.reticle{position:absolute;inset:5% 5% 4% 5%;border:2px solid var(--cy);border-radius:4px;opacity:0;transition:opacity .15s;
  -webkit-mask:linear-gradient(#000 0 0) top left/14px 14px no-repeat,linear-gradient(#000 0 0) top right/14px 14px no-repeat,linear-gradient(#000 0 0) bottom left/14px 14px no-repeat,linear-gradient(#000 0 0) bottom right/14px 14px no-repeat;
  mask:linear-gradient(#000 0 0) top left/14px 14px no-repeat,linear-gradient(#000 0 0) top right/14px 14px no-repeat,linear-gradient(#000 0 0) bottom left/14px 14px no-repeat,linear-gradient(#000 0 0) bottom right/14px 14px no-repeat}
.foe.tgt .reticle{opacity:1}
.cinfo{position:absolute;top:272px;width:110px;display:flex;flex-direction:column;gap:3px;transition:opacity .4s}
.cinfo.dead{opacity:.25}
.frow{display:flex;gap:4px;align-items:center}
.ftag{width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:10px;font-weight:700;background:#1e2c3a;flex:none}
.ftag.tgt{background:var(--cy);color:var(--bg)}
.hpb{position:relative;display:block;width:58px;height:5px;background:#1c2937;border-radius:2px;overflow:hidden}
.hpb i{position:absolute;left:0;top:0;bottom:0;background:var(--neutral);transition:width .25s}
.hpb.me i{background:var(--cy)}
.hpb s{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--foe) 0 2px,transparent 2px 4px)}
.hpt{font-family:var(--f-num);font-size:10.5px;color:var(--fg2)}
.hpt.pv{color:var(--foe2)}
.sts{display:flex;gap:8px;min-height:12px}
.cinfo.fi .sts{gap:5px}
.st{display:inline-flex;gap:2px;align-items:center;font-family:var(--f-num);font-size:10.5px;font-weight:700}
.st .ic svg{width:11px;height:11px}
.st.crack{color:var(--foe2)} .st.blk{color:var(--fg)} .st.swf{color:var(--cy)} .st.chg{color:var(--cy)}
.st.flash{animation:stflash .35s}
@keyframes stflash{0%{filter:drop-shadow(0 0 6px #fff);color:#fff}100%{filter:none}}

/* parts */
.part{position:absolute;left:8px;width:76px;display:block;padding:2px 0;transition:background .2s;border-radius:4px}
.ph{display:flex;align-items:center;gap:4px}
.pico{position:relative;display:inline-flex;color:var(--fg)}
.pico svg{width:12px;height:12px;display:block}
.pname{font-size:10.5px;font-weight:700}
.pnum{margin-left:auto;font-family:var(--f-num);font-size:10.5px;font-weight:600;color:var(--fg2)}
.pnum.pv{color:var(--foe2)}
.pips{display:flex;gap:2px;margin-top:4px}
.pip{display:block;height:7px;border-radius:1px;background:#1c2937}
.pip.full{background:var(--neutral)}
.pip.loss{background:repeating-linear-gradient(135deg,var(--foe) 0 2px,#3a1424 2px 4px)}
.pip.worn{background:repeating-linear-gradient(135deg,#2a3a4a 0 2px,#111b25 2px 4px)}
.part.th-hit .pico,.part.th-hit .pname{color:var(--foe2)}
.part.th-ch .pico,.part.th-ch .pname{color:var(--just2)}
.part.broken .pname,.part.broken .pico{color:var(--dim2)}
.part.broken .pico::after{content:"";position:absolute;left:-2px;top:5px;width:16px;height:2px;background:var(--foe);transform:rotate(-40deg)}
.part.flash{background:rgba(255,77,106,.22)}
#menuBtn{position:absolute;left:806px;top:8px;width:28px;height:22px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--dim);display:flex;align-items:center;justify-content:center}

/* hand: tall cards peek from the bottom edge */
#handShade{position:absolute;left:0;top:170px;width:844px;height:220px;background:linear-gradient(180deg,rgba(10,15,21,0),rgba(10,15,21,.88) 40%);opacity:0;transition:opacity .2s;pointer-events:none}
#handShade.on{opacity:1}
.pile{position:absolute;left:8px;width:66px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:6px}
.pile .ic svg{width:14px;height:14px}
.pile b{font-family:var(--f-num);font-size:13px}
#pileDisc{color:var(--dim)}
.card{position:absolute;width:96px;height:136px;transform-origin:50% 100%;overflow:hidden;border-radius:8px;background:var(--raised);border:1px solid #233446;color:var(--fg);display:flex;flex-direction:column;
  transition:left .22s cubic-bezier(.2,.8,.2,1),top .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s,border-color .15s,box-shadow .2s}
.card.sel,.card.picked{border:1.5px solid var(--cy);box-shadow:0 10px 24px rgba(56,211,255,.28)}
.card:disabled{cursor:default}
.card.off{opacity:.35}
.chd{display:flex;align-items:center;gap:4px;height:26px;padding:0 5px;flex:none}
.cost{width:18px;height:18px;flex:none;border:1.5px solid var(--cy);border-radius:9px;background:var(--bg);color:var(--cy);font-family:var(--f-num);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cname{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cart{position:relative;display:block;height:60px;flex:none;margin:0 4px;border-radius:4px;background:repeating-linear-gradient(135deg,#17222e 0 6px,#131c27 6px 12px)}
.atom{position:absolute;left:6px;top:7px;width:7px;height:7px;background:var(--fg);transform:rotate(45deg)}
.cval{position:absolute;right:5px;top:4px;display:flex;align-items:center;gap:3px;padding:1px 4px;border-radius:4px;background:rgba(10,15,21,.75)}
.cval b{font-family:var(--f-num);font-size:15px;line-height:1.1}
.ctx{display:block;padding:5px 7px 0;font-size:10px;line-height:1.4;color:var(--fg2)}
.ctx b{color:var(--fg)}
.kwp{display:inline-block;margin-top:3px;font-size:9px;font-weight:700;border:1px solid #33495d;border-radius:3px;padding:0 4px;line-height:13px;color:var(--fg)}
.kw-f{font-weight:700;color:var(--foe2)} .kw{font-weight:700;color:var(--fg)} .kw-j{font-weight:700;color:var(--just2)}
.ctx .kwp{display:inline;margin:0;border:0;padding:0;font-size:inherit;line-height:inherit}
/* 文が長いカードは絵を低くして5行まで入れる */
.card:has(.ctx.long) .cart{height:36px}
.ctx.long{font-size:9.5px;line-height:1.35}
.cnt{position:absolute;right:5px;bottom:5px;font-family:var(--f-num);font-size:11px;font-weight:700;color:var(--cy)}
#redraw{position:absolute;left:742px;top:302px;width:92px;height:80px;border:1px solid #233446;border-radius:8px;background:var(--panel);color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:8px;transition:top .15s,border-color .15s,box-shadow .15s,opacity .25s,transform .25s}
#redraw svg{width:20px;height:20px}
#redraw b{font-family:var(--f-num);font-size:24px;color:var(--cy)}
#redraw.sel{top:292px;border:1.5px solid var(--cy);box-shadow:0 10px 22px rgba(56,211,255,.22)}
#redraw:disabled{opacity:.4;cursor:default}

/* fx */
#fx,#floats{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:17px;white-space:nowrap;text-shadow:-1.5px 0 rgba(56,211,255,.75),1.5px 0 rgba(255,77,106,.75),0 0 6px #000;animation:rise .9s ease-out forwards;color:#fff}
.float.foe{color:var(--foe2)} .float.cy{color:var(--cy);font-size:14px}
@keyframes rise{0%{opacity:0;margin-top:4px;letter-spacing:.3em}8%{opacity:1;letter-spacing:0}12%{transform:translate(-46%,-50%)}16%{transform:translate(-50%,-50%)}100%{opacity:0;margin-top:-26px}}
.burst{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--just);box-shadow:0 0 18px rgba(177,140,255,.9),inset 0 0 12px rgba(177,140,255,.6);animation:burst .5s ease-out forwards}
@keyframes burst{0%{transform:scale(.4);opacity:1}70%{opacity:1}100%{transform:scale(1.8);opacity:0}}
.shard{position:absolute;width:9px;height:3px;background:var(--just2);transition:transform .45s ease-out,opacity .45s}

.ulines{position:absolute;left:0;top:0;width:844px;height:390px;pointer-events:none;overflow:visible;transition:opacity .3s}

  -webkit-mask:linear-gradient(#000 0 0) top left/8px 8px no-repeat,linear-gradient(#000 0 0) top right/8px 8px no-repeat,linear-gradient(#000 0 0) bottom left/8px 8px no-repeat,linear-gradient(#000 0 0) bottom right/8px 8px no-repeat;

.upt.broken{opacity:.2;pointer-events:none}

/* タイムラインの印を押すと出る行動の中身(0.18.2) */

/* 手ごたえ(0.18.4): 押したときの沈み、開くときの動き。prefers-reduced-motion なら全部止まる */

}

/* サイバーパンクの演出(0.18.6) */
/* 画面全体の走査線と、タイムラインをゆっくり走る光 */
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:90;background:repeating-linear-gradient(0deg,rgba(180,230,255,.028) 0 1px,transparent 1px 3px)}
#screen{overflow:hidden}
#screen::after{content:"";position:absolute;top:0;bottom:0;left:-80px;width:80px;background:linear-gradient(90deg,transparent,rgba(56,211,255,.07),transparent);animation:idleScan 7s linear infinite}

/* 再走査: 敵の行動の予定が変わったとき(JUST で潰した・構えを崩した・ユニットの破壊で行動が消えた・行動が変わった) */
#rescan{position:absolute;left:170px;top:10px;width:3px;height:158px;opacity:0;background:#bff2ff;box-shadow:0 0 10px #38d3ff,0 0 24px rgba(56,211,255,.6)}

#rescan.go{animation:rescan .6s cubic-bezier(.45,.1,.55,.9)}
@keyframes rescan{0%{opacity:1;transform:translateX(0)}90%{opacity:1}100%{opacity:0;transform:translateX(620px)}}
#rescanTag{position:absolute;left:98px;top:14px;width:70px;line-height:1.25;white-space:pre;font-family:var(--f-mono,ui-monospace),monospace;font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--cy);opacity:0;text-shadow:0 0 6px rgba(56,211,255,.8)}
#rescanTag.go{animation:rtag .9s steps(1,end)}
@keyframes rtag{0%{opacity:1}10%{opacity:0}20%{opacity:1}30%{opacity:.4}40%,80%{opacity:1}100%{opacity:0}}
#marks.rescan .mk{animation:mkScan .55s steps(4)}
@keyframes mkScan{0%{opacity:.15;translate:-3px 0;filter:hue-rotate(80deg) brightness(1.8)}35%{opacity:1;translate:3px 0;filter:brightness(1.6)}60%{opacity:.5;translate:-1px 0}100%{opacity:1;translate:0 0;filter:none}}
#screen.rescan{border-color:var(--cy);box-shadow:0 0 0 1px rgba(56,211,255,.4),0 0 18px rgba(56,211,255,.25)}

.mk.spawn{animation:mkIn .32s steps(4)}
@keyframes mkIn{0%{filter:brightness(2.4);translate:-3px 0}25%{filter:brightness(1.6) hue-rotate(60deg);translate:3px 0}50%{filter:brightness(1.8);translate:-1px 0}100%{filter:none;translate:0 0}}

#flashFx.brk{animation:flash .28s ease-out;background:radial-gradient(ellipse at 50% 30%,rgba(56,211,255,.28),transparent 70%)}
#flashFx.hurt{animation:flash .26s ease-out;background:radial-gradient(ellipse at 20% 60%,rgba(255,77,106,.28),transparent 70%)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
/* 大きな文字(JUST・崩し) */
.float.big{font-size:26px;letter-spacing:.06em}
.float.just2{color:#efe6ff;text-shadow:-2px 0 rgba(56,211,255,.8),2px 0 rgba(255,77,106,.8),0 0 14px rgba(177,140,255,.9)}

.cardghost{position:absolute;width:36px;height:50px;margin:-25px 0 0 -18px;border:1.5px solid var(--cy);border-radius:5px;box-shadow:0 0 12px rgba(56,211,255,.7);animation:cghost .4s ease-out forwards}

  repeating-linear-gradient(0deg,rgba(56,211,255,.035) 0 1px,transparent 1px 4px),radial-gradient(ellipse 220px 170px at 50% 50%,rgba(56,211,255,.1),transparent 70%),linear-gradient(180deg,#0f1822,#0a1018);overflow:hidden}
.rs-still.event{--bk:var(--just);background-color:#0d0b18}
.rs-still.event .rs-glyph{color:var(--just2)}
.rs-glyph{display:flex;filter:drop-shadow(0 0 14px currentColor);opacity:.75;animation:glyph 4s steps(1) infinite}
.rs-glyph svg{width:84px;height:84px}
@keyframes glyph{0%,92%,100%{transform:none;opacity:.75}93%{transform:translateX(3px) skewX(-8deg);opacity:.45}95%{transform:translateX(-2px);opacity:.9}}
.rs-noise{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0,rgba(56,211,255,.08) 50%,transparent 100%) 0 0/100% 60px no-repeat;animation:noiseBand 3.2s linear infinite}
@keyframes noiseBand{0%{background-position:0 -60px}100%{background-position:0 400px}}
.rs-still.info{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:18px;padding:14px;color:var(--fg2)}
.rs-still.info .droidart{width:92px;height:220px;flex:none}
.rsu-list{display:flex;flex-direction:column;gap:9px;min-width:150px}
.rsu{display:grid;grid-template-columns:16px 1fr;column-gap:7px;row-gap:3px;align-items:center}
.rsu .ic{display:flex;color:var(--cy)} .rsu .ic svg{width:13px;height:13px}
.rsu b{font-size:11px;color:var(--fg)} .rsu b i{font-style:normal;color:var(--dim);font-size:10px}
.rsu .pips,.rsu .hbar{grid-column:2;display:flex;gap:2px}
.rsu.dmg .ic,.rsu.dmg b{color:var(--foe2)}
.rsu.body b{font-family:var(--f-num);font-size:14px}
.rsu .hbar{height:5px;background:#1a2836;border-radius:2px;overflow:hidden;width:150px} .rsu .hbar i{display:block;height:100%;background:var(--cy);box-shadow:0 0 6px rgba(56,211,255,.6)}
.rsu.body{padding-bottom:7px;border-bottom:1px solid var(--line)}
.rs-main h2{display:flex;align-items:center;gap:9px;font-size:17px;letter-spacing:.1em}
.rs-main h2::before{content:"";width:3px;height:17px;background:var(--cy);box-shadow:0 0 8px rgba(56,211,255,.7)}
.rs-opts{gap:10px}
.rs-opts .opt{position:relative;border:1px solid var(--hud);border-left:2px solid var(--hud2);border-radius:3px;background:linear-gradient(90deg,rgba(56,211,255,.04),transparent 60%),#0d151e;padding:14px 16px;min-height:56px}
.rs-opts .opt .ic{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--hud2);border-radius:3px;color:var(--cy);background:#0a1219}
.rs-opts .opt .ic svg{width:18px;height:18px}
.rs-opts .opt b{font-size:14px;letter-spacing:.04em}
.rs-opts .opt span:last-child{font-size:11px;color:var(--fg2)}
.rs-opts .opt.picked{border-color:var(--cy);border-left-color:var(--cy);background:linear-gradient(90deg,rgba(56,211,255,.14),rgba(56,211,255,.02) 70%),#0d151e;box-shadow:0 0 0 1px rgba(56,211,255,.25),0 0 18px rgba(56,211,255,.12)}
.rs-opts .opt.picked .ic{border-color:var(--cy);background:rgba(56,211,255,.12)}
.rs-text{font-size:12px;color:var(--fg2);border-left:2px solid var(--line);padding-left:10px}
/* カード: 絵の欄に種類の大きな印と色の気配。枠は上の縁に光 */
.card{background:linear-gradient(180deg,#152230,#101923 60%,#0e161f);border-color:#27394c;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.card::before{content:"";position:absolute;left:8px;right:8px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(56,211,255,.45),transparent);pointer-events:none}
.cart{--tt:rgba(230,238,245,.07);overflow:hidden;background:radial-gradient(ellipse 70% 90% at 30% 70%,var(--tt),transparent 75%),repeating-linear-gradient(135deg,#17222e 0 6px,#131c27 6px 12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.cwm{position:absolute;left:4px;bottom:-8px;display:flex;color:#fff;opacity:.09;pointer-events:none}
.cwm svg{width:52px;height:52px}
.card:has(.ctx.long) .cwm svg{width:36px;height:36px}
.cart.t-block,.cart.t-parry{--tt:rgba(143,176,196,.16)}
.cart.t-delay,.cart.t-timer,.cart.t-swift,.cart.t-draw{--tt:rgba(56,211,255,.13)} .cart.t-delay .cwm,.cart.t-timer .cwm,.cart.t-swift .cwm,.cart.t-draw .cwm{color:var(--cy);opacity:.14}
.cart.t-charge{--tt:rgba(177,140,255,.18)} .cart.t-charge .cwm{color:var(--just2);opacity:.16}
.cart.t-crack{--tt:rgba(255,77,106,.12)} .cart.t-crack .cwm{color:var(--foe2);opacity:.13}

.mlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mlist .opt{padding:12px 14px;border-left:2px solid var(--hud2)}
/* ショップ: 値札とサービス */
.sitem .price{padding:2px 9px;border:1px solid var(--hud);border-radius:2px;background:#0d151e}
.price .ic svg{width:12px;height:12px}
.svc{width:280px}
.svc .opt{width:auto;display:grid;grid-template-columns:30px 1fr auto;column-gap:10px;row-gap:2px;align-items:center;padding:10px 12px;border-left:2px solid var(--hud2)}
.svc .opt>.ic{grid-row:1/3;display:flex;color:var(--cy)} .svc .opt>.ic svg{width:18px;height:18px}
.svc .opt>b{grid-column:2;font-size:12.5px} .svc .opt>span:nth-of-type(2){grid-column:2;font-size:10px}
.svc .opt>.price{grid-column:3;grid-row:1/3}
.svc .opt.picked{border-color:var(--cy)}
.ux{margin-left:6px;width:30px;padding:0} .ux svg{width:13px;height:13px}
.unitv{margin:0 0 4px}
/* 一般の選択肢(重ねる画面) */
.opt{border-color:var(--hud);border-radius:4px;background:linear-gradient(180deg,#101a24,#0b131b)}
.opt.picked{background:linear-gradient(180deg,rgba(56,211,255,.12),rgba(56,211,255,.03)),#0b131b}
.ptile{border-color:var(--hud);border-radius:4px;background:linear-gradient(180deg,#101a24,#0b131b)}
.ptile.dmg{background:linear-gradient(180deg,rgba(255,77,106,.1),#0b131b)}
.sw-p{border-color:var(--hud);border-radius:4px;background:#0b131b}
/* ===== タイトル・エリア(0.19.0) ===== */
#titleScr{position:absolute;inset:0;z-index:45;overflow:hidden;
  background:radial-gradient(ellipse 380px 300px at 250px 230px,rgba(56,211,255,.12),transparent 70%),radial-gradient(ellipse 500px 200px at 700px 40px,rgba(177,140,255,.08),transparent 70%),
  linear-gradient(rgba(56,211,255,.03) 1px,transparent 1px) 0 0/100% 32px,linear-gradient(180deg,#070b10,#0a1018 60%,#0c141d)}
.tt-tower{position:absolute;left:150px;top:0;bottom:0;width:200px;pointer-events:none}
.tt-tower i{position:absolute;bottom:0;left:calc(var(--i) * 24px);width:1px;height:calc(40% + var(--i) * 6% - (var(--i) - 4) * (var(--i) - 4) * 3%);background:linear-gradient(0deg,rgba(56,211,255,.35),rgba(56,211,255,0));}
.tt-tower i::after{content:"";position:absolute;left:-1px;width:3px;height:22px;background:var(--cy);box-shadow:0 0 8px var(--cy);opacity:.7;animation:ttRise calc(3s + var(--i) * .37s) linear infinite;animation-delay:calc(var(--i) * -.6s)}
@keyframes ttRise{0%{bottom:0;opacity:0}10%{opacity:.8}100%{bottom:100%;opacity:0}}
.tt-art{position:absolute;left:180px;top:60px;width:130px;height:300px;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 0 18px rgba(56,211,255,.25))}
.tt-art .droidart{width:120px;height:290px}
.tt-art::after{content:"";position:absolute;left:-30px;right:-30px;bottom:-6px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(56,211,255,.35),transparent 70%)}
.tt-main{position:absolute;left:430px;right:40px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:26px}
.tt-logo{position:relative;margin:0;font-family:var(--f-num);font-weight:700;font-size:44px;letter-spacing:.16em;color:#eaf7ff;text-shadow:0 0 18px rgba(56,211,255,.55)}
.tt-logo::before,.tt-logo::after{content:attr(data-t);position:absolute;left:0;top:0;pointer-events:none}
.tt-logo::before{color:rgba(255,77,106,.7);clip-path:inset(0 0 55% 0);transform:translateX(-2px);animation:ttG1 3.6s steps(1) infinite}
.tt-logo::after{color:rgba(56,211,255,.8);clip-path:inset(60% 0 0 0);transform:translateX(2px);animation:ttG2 4.1s steps(1) infinite}
@keyframes ttG1{0%,90%,100%{transform:translateX(0);opacity:0}91%{transform:translateX(-5px);opacity:1}94%{transform:translateX(3px);opacity:1}97%{opacity:0}}
@keyframes ttG2{0%,86%,100%{transform:translateX(0);opacity:0}87%{transform:translateX(4px);opacity:1}90%{transform:translateX(-2px);opacity:1}93%{opacity:0}}
.tt-logo{border-bottom:1px solid var(--hud);padding-bottom:10px}
.tt-logo:after{}
.tt-menu{display:flex;flex-direction:column;gap:9px;width:300px}
.tt-b{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 16px;border:1px solid var(--hud);border-left:2px solid var(--hud2);border-radius:3px;background:linear-gradient(90deg,rgba(56,211,255,.05),transparent 70%),#0c141d;color:var(--fg);text-align:left;transition:border-color .15s,background .15s,scale .1s}
.tt-b b{font-size:14px;letter-spacing:.08em}
.tt-b>span{font-size:10.5px;color:var(--fg2);display:inline-flex;align-items:center;gap:4px} .tt-b .ic{display:inline-flex} .tt-b .ic svg{width:11px;height:11px}
.tt-b.main{border-color:var(--cy);border-left-color:var(--cy);background:linear-gradient(90deg,rgba(56,211,255,.18),rgba(56,211,255,.03) 80%),#0c141d;box-shadow:0 0 18px rgba(56,211,255,.15)}
.tt-b.warn{border-color:var(--foe);border-left-color:var(--foe);background:linear-gradient(90deg,rgba(255,77,106,.14),transparent 80%),#0c141d} .tt-b.warn>span{color:var(--foe2)}
.tt-b:active{scale:.97}
.tt-sub{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.tt-s{flex:1;padding:8px 0;text-align:center;border:1px solid var(--hud);border-radius:3px;background:#0c141d;color:var(--fg2);font-size:11px;letter-spacing:.06em}
.tt-s:active{scale:.95}
.tt-ver{position:absolute;right:14px;bottom:10px;font-family:var(--f-num);font-size:10px;color:var(--dim);letter-spacing:.1em}
#titleScr.enter .tt-logo{animation:ttIn .6s cubic-bezier(.2,.8,.2,1) backwards}
#titleScr.enter .tt-menu>*{animation:riseIn .4s cubic-bezier(.2,.8,.2,1) backwards}
#titleScr.enter .tt-menu>*:nth-child(1){animation-delay:.2s} #titleScr.enter .tt-menu>*:nth-child(2){animation-delay:.27s} #titleScr.enter .tt-menu>*:nth-child(n+3){animation-delay:.34s}
#titleScr.enter .tt-art{animation:fadeIn .9s ease-out backwards}
@keyframes ttIn{0%{opacity:0;letter-spacing:.6em;filter:blur(4px)}100%{opacity:1;letter-spacing:.16em;filter:none}}
/* 地図の上の帯: エリアの進み具合 */
.apr{display:inline-flex;gap:3px;margin-left:-6px}
.apr i{width:14px;height:4px;border-radius:1px;background:#1f3346}
.apr i.done{background:var(--cy-dim)} .apr i.on{background:var(--cy);box-shadow:0 0 6px rgba(56,211,255,.7)}
/* 新しいエリアの名前 */
.abanner{position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:5;padding:14px 0;
  background:linear-gradient(90deg,transparent,rgba(5,9,14,.92) 25%,rgba(5,9,14,.92) 75%,transparent);animation:abanner 2.1s ease-in-out forwards}
.abanner i{font-style:normal;font-family:var(--f-num);font-size:11px;letter-spacing:.3em;color:var(--cy)}
.abanner b{font-size:24px;letter-spacing:.2em;color:#fff;text-shadow:0 0 14px rgba(56,211,255,.6)}
@keyframes abanner{0%{opacity:0;clip-path:inset(50% 0 50% 0)}12%{opacity:1;clip-path:inset(0)}80%{opacity:1;clip-path:inset(0)}100%{opacity:0;clip-path:inset(0)}}
/* 中継 */
.rs-heal{display:flex;align-items:center;gap:6px;margin:-4px 0 12px;font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--cy)} .rs-heal .ic svg{width:13px;height:13px}
/* 抵抗(0.21.0) */
.st.res{color:#8fc6d9}
.float.dim{color:var(--fg2);font-size:13px}
/* ===== 警戒度(0.20.0) ===== */
:root{--al1:var(--cy); --al2:#ffb84d; --al3:#ff7a59; --al4:var(--foe)}
.aring{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none}
.aring svg{display:block;overflow:visible}
/* 輪は段 I〜X の10区切り(0.23.0)。済んだ段は段ごとの色、今の段はゲージの進み、印はこのエリアで敵の組が変わる段 */
.aring .sg{fill:none;stroke-linecap:butt}
.aring .sg.e{stroke:#1a2c3d} .achip .aring .sg.e{stroke:color-mix(in srgb,var(--ac) 22%,#0d1720)}
.aring .sg.f{filter:drop-shadow(0 0 2px currentColor)}
.aring .sg.c{stroke:#24394c}
.aring .bm{stroke:var(--fg2);stroke-width:1.4;stroke-linecap:round}
.aring .bm.on{stroke:var(--ac)}
.aring .ai{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ac)} .aring .ai svg{width:11px;height:11px}
.aring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-weight:700;color:var(--ac);font-size:22px;text-shadow:0 0 10px var(--ac)}
.aring b.long{font-size:18px;letter-spacing:-.04em}
/* 上の帯のチップ: 輪+ローマ数字。段が上がるほど光が強くなり、VII からは脈打つ */
.achip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 4px;border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);border-radius:4px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 16%,transparent),color-mix(in srgb,var(--ac) 4%,transparent));box-shadow:0 0 10px color-mix(in srgb,var(--ac) 22%,transparent),inset 0 0 8px color-mix(in srgb,var(--ac) 10%,transparent)}
.t1{--ac:var(--al1)} .t2{--ac:var(--al2)} .t3{--ac:var(--al3)} .t4{--ac:var(--al4)}
.achip .an{display:flex;flex-direction:column;align-items:flex-start;line-height:1;min-width:30px}
.achip .an i{font-style:normal;font-size:8.5px;letter-spacing:.14em;color:color-mix(in srgb,var(--ac) 75%,#fff)}
.achip .an b{font-family:var(--f-num);font-weight:700;font-size:16px;letter-spacing:.02em;color:var(--ac);text-shadow:0 0 8px color-mix(in srgb,var(--ac) 60%,transparent);margin-top:1px}
.achip.t3,.achip.t4{animation:alGlow 1.6s ease-in-out infinite}
.achip.t4{animation-duration:.9s}
@keyframes alGlow{50%{box-shadow:0 0 18px color-mix(in srgb,var(--ac) 55%,transparent),inset 0 0 12px color-mix(in srgb,var(--ac) 22%,transparent)}}
.mbtn.alb{padding:0;height:32px;border-color:transparent;background:transparent;margin-left:-2px}
.alv{display:flex;align-items:center;gap:16px;margin:0 0 10px}
.adesc{margin:0 0 4px;font-size:11.5px;line-height:1.6;color:var(--fg2)} .anext{margin:0;font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--fg)}
.aeff{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.aeff li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg)} .aeff li::before{content:"";width:6px;height:6px;flex:none;background:var(--al2);transform:rotate(45deg)}
.aeff li.off{color:var(--dim)} .aeff li.off::before{background:#2a465e}
.aeff li i{font-style:normal;font-family:var(--f-num);font-size:10px;color:var(--dim);margin-left:auto}
.again{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--hud);border-radius:3px;font-size:10.5px;color:var(--fg2)} .ag .ic{display:flex} .ag .ic svg{width:11px;height:11px}
.ag b{font-family:var(--f-num);color:var(--al2)} .ag b.dn{color:var(--cy)}
.mi-al{display:inline-flex;align-items:center;gap:4px;margin-left:10px;padding:3px 8px;border:1px solid rgba(255,184,77,.5);border-radius:3px;font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--al2);flex:none}
.mi-al.dn{border-color:rgba(56,211,255,.5);color:var(--cy)} .mi-al .ic{display:flex} .mi-al .ic svg{width:12px;height:12px}
.mn.duct{--nc:#8fc6d9;--nb:rgba(143,198,217,.14)} .mi-ic.k-duct{--nc:#8fc6d9} .mi-leg .k-duct{color:#8fc6d9}
.rs-still.duct .rs-glyph{color:#8fc6d9}
.rs-heal.al{color:var(--cy)}
.abanner.al i{color:var(--al2)} .abanner.al.t3 i{color:var(--al3)} .abanner.al.t4 i{color:var(--al4)}
.abanner.al i.pu{margin-top:4px;font-size:12px;letter-spacing:.12em;font-family:inherit;color:var(--fg)}
.abanner.al b{text-shadow:0 0 14px rgba(255,184,77,.6)}
.abanner.al{background:linear-gradient(90deg,transparent,rgba(30,12,8,.92) 25%,rgba(30,12,8,.92) 75%,transparent)}
@media (prefers-reduced-motion:reduce){#stage *,#stage *::before,#stage *::after{transition:none!important;animation:none!important}}
</style>

          <rect x="30" y="120" width="38" height="14" rx="3" fill="#152130" stroke="#4d6578" stroke-width="2"/>
          <path d="M24 44H74L68 122H30Z" fill="#152130" stroke="#4d6578" stroke-width="2"/>
          <rect x="44" y="30" width="10" height="10" fill="#253545"/>

          <rect x="66" y="34" width="28" height="9" rx="2" fill="#152130" stroke="#4d6578" stroke-width="2"/>

      </div>

const tFoe = t => t == null ? null : typeof t === 'string' && t.includes('.') ? +t.split('.')[0] : +t;
const tUnit = t => typeof t === 'string' && t.includes('.') ? t.split('.')[1] : null;

const UI = {view:'normal', pick:null, learnOpts:[], screen:'map', mapSel:null, node:null, offers:null, partOpts:null, back:null, after:null, eventId:null};

/* ---------- preview ---------- */
function selAction(){ return !sel ? null : sel.kind === 'card' ? {type:'card', i:sel.i, k:sel.k, t:sel.target} : {type:sel.kind}; }
function computePreview(){
  const a = selAction(); if(!a) return null;
  const cost = EN.actionCost(S, a);
  const sim = noInt => {
    const c = EN.clone(S); const p = EN.beginAction(c, a); const g = EN.spendGen(c, p.cost, p.k, p.t, noInt), evs = [];
    let r; while(!(r = g.next()).done){ const v = r.value; if(v.type === 'card' || v.type === 'timer') evs.push(...v.ev); }
    return {c, out:r.value, evs};
  };
  const A = sim(false), P = sim(true);
  // ブレイク・防壁・反撃・隙に当たるか(帯を光らせる)
  const fx = new Set(A.evs.filter(x => ['break','guarded','counter','vulnHit'].includes(x.kind)).map(x => x.kind + ':' + x.e));
  const react = new Set();
  if(a.type === 'card' && cost > 0) for(const e of S.b.foes) if(e.alive && e.react && cost >= e.react.min && e.reactIn == null) react.add(e.i);
  return {k:a.k || null, cost, completeAt: P.out.completeAt ?? P.out.elapsed, free: a.type === 'wait' ? 0 : Math.min(S.b.swift, cost),
    justSet: new Set(A.out.justs.map(j => j.i)), parts: A.c.b.parts, body: A.c.run.body, foeHp: A.c.b.foes.map(e => e.hp), foeUnits: A.c.b.foes.map(e => Object.fromEntries(e.uids.map(k => [k, e.units[k].hp]))), react, fx,
    // 使う前に、新しく置かれる時限の発動位置を見せる
    timers: A.c.b.timers.filter(t => !S.b.timers.some(o => o.id === t.id)).map(t => ({at: A.out.elapsed + t.left, e: t.e}))};
}

/* ---------- cards ---------- */
function cardType(c){ return c.junk ? 'junk' : c.timer ? 'timer' : c.parry ? 'parry' : c.dmg ? c.dmg.t : c.spend ? (c.spend.dmg ? c.spend.dmg.t : 'block') : c.block ? 'block' : c.gain ? 'charge' : c.delay ? 'delay' : c.swift ? 'swift' : c.draw ? 'draw' : 'crack'; }
const stv = st => st && st.b ? st : {run: S ? S.run : null, b: null};
function vDmg(st, c, d){ return st && st.run ? EN.dmgOf(stv(st), c, d) : (d || c.dmg).n; }
function vBlock(st, c){ return st && st.run ? EN.blockOf(stv(st), c) : c.block; }
// 充電を消費するカード: 戦闘中は今の充電での値、戦闘の外では 1あたりの値
function spendVal(st, c){
  const per = c.spend.dmg ? c.spend.dmg.n : c.spend.block;
  if(!(st && st.b)) return '×' + per;
  const n = st.b.charge || 0; if(!n) return 0;
  return c.spend.dmg ? vDmg(st, c, {t:c.spend.dmg.t, n:per * n}) : per * n + EN.fx(stv(st), 'dur', 'block');
}
function cardVal(k, st){
  const c = CARDS[k];
  if(c.junk) return '';
  if(c.timer) return vDmg(st, c, c.timer.dmg);
  if(c.spend) return spendVal(st, c);
  if(c.parry) return vBlock(st, c);
  if(c.dmg) return vDmg(st, c) + (c.dmg.x ? '×' + c.dmg.x : '');
  if(c.block) return vBlock(st, c);
  if(c.delay) return c.delay;
  if(c.swift) return c.swift;
  if(c.gain) return c.gain;
  if(c.draw) return c.draw;
  return c.crack;
}
// カードの文は text/cards.csv の型に数値を差し込む。{dmg} などはパーツの補正込みの値。キーワードの名前は色を付ける
function cardVals(c, st){
  return {dmg: c.dmg ? vDmg(st, c) : '', x: c.dmg && c.dmg.x || '', block: c.block != null ? vBlock(st, c) : '', delay: c.delay || '', swift: c.swift || '',
    crack: c.crack || '', draw: c.draw || '', t: c.timer ? c.timer.t : '', tdmg: c.timer ? vDmg(st, c, c.timer.dmg) : '',
    gain: c.gain || '', per: c.spend ? (c.spend.dmg ? c.spend.dmg.n : c.spend.block) : ''};
}
const KW_CLS = {crack:'kw-f', atomic:'kwp', just:'kw-j'};
const kwList = () => Object.entries(DATA.kwName).sort((a, b) => b[1].length - a[1].length);
function cardText(k, st){
  const c = CARDS[k], v = cardVals(c, st);

function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
const partY = id => 10 + SLOTS.findIndex(p => p.id === id) * 48;
function beam(to, from){

}
function shards(x, y, color){

}
function sparks(x, y){

function afterimage(){

function shieldFx(){ const el = fxEl('shield', 92, 136); setTimeout(() => el.remove(), 560); }
function cardMotion(k, ti){
  const c = CARDS[k], d = $('#droid'), t = cardType(c);

// 耐久バーの上(ダメージの数字を出す場所)
function unitTop(i, uid){ const g = GEOM.get(i); if(!g) return foeCenter(i); const u = g.units[g.multi ? uid : '*'] || g.units['*']; return u ? {x: u.x, y: u.y - 8} : foeCenter(i); }
function cardFx(x){
  switch(x.kind){
    case 'dmg': { const p = unitTop(x.e, x.unit); floatAt(p.x, p.y, '−' + x.n, 'foe'); pulse(unitEl(x.e, x.unit), 'flash', 260); pulse(unitSpr(x.e, x.unit), 'ehit', 280); break; }
    case 'kill': { const p = foeCenter(x.e); shards(p.x, p.y, '#d3e2ee'); break; }
    case 'unitBreak': { const p = unitCenter(x.e, x.unit); pulse(unitEl(x.e, x.unit), 'flash', 420); shards(p.x, p.y, '#ff8a9c'); pixels(p.x, p.y); flashFx('brk'); rescan('UNIT'); break; }
    case 'frenzy': { const p = foeCenter(x.e); floatAt(p.x, p.y - 70, '▲' + x.n, 'foe'); break; }
    case 'cancel': floatAt(xs(1), ROWY[x.e] - 20, '×', 'cy'); rescan('VOID'); break;
    case 'shift': floatAt(xs(1), ROWY[x.e] - 20, '!!', 'foe'); rescan('SHIFT'); break;
    case 'crack': { const p = unitCenter(x.e, x.unit); floatAt(p.x + 30, p.y - 30, '+' + x.n, 'foe'); break; }
    case 'delay':
      if(x.anger){ const p = foeCenter(x.e); floatAt(p.x, p.y - 70, '▲' + x.anger, 'foe'); pulse(foeEl(x.e), 'ehit', 280); foeSay(x.e, 'anger'); }

    case 'block': floatAt(130, 262, '+' + x.n, ''); break;
    case 'swift': floatAt(150, 262, '+' + x.n, 'cy'); break;
    case 'charge': floatAt(170, 252, '+' + x.n, 'cy'); break;
    case 'draw': if(x.n) floatAt(41, 290, '+' + x.n, 'cy'); break;
    case 'timerSet': floatAt(xs(x.t), STRIP_Y - 10, '◆', 'cy'); break;
    case 'guarded': { const p = foeCenter(x.e); const el = fxEl('fshield', p.x, p.y - 10); setTimeout(() => el.remove(), 520); floatAt(p.x + 26, p.y - 46, '防' + x.n, ''); break; }
    case 'armored': { const p = unitCenter(x.e, x.unit); floatAt(p.x + 26, p.y - 36, '装' + x.n, ''); break; }
    case 'vulnHit': { const p = unitCenter(x.e, x.unit); floatAt(p.x - 26, p.y - 36, '×1.5', 'cy'); break; }
    case 'break': { justFx(x.e, 'BREAK'); const p = foeCenter(x.e); floatAt(p.x, p.y - 84, DATA.kwName.break, 'cy big'); break; }
    case 'counter': { const p = foeCenter(x.e); floatAt(p.x, p.y - 84, '返', 'foe'); beam({x: DROID.sx, y: DROID.sy}, {x: p.x, y: p.y - 10}); hitMeFx(x.res); break; }
  }

// 自分が撃たれたときの演出(敵の攻撃と反撃で共通)
function hitMeFx(r){
  const y = partY(r.part);
  if(r.blocked) pulse($('#stBlk'), 'flash', 360);
  if(r.partLoss){ floatAt(70, y + 8, '−' + r.partLoss, 'foe'); pulse(document.querySelector(`.part[data-p="${r.part}"]`), 'flash', 320); }
  if(r.broke) sparks(DROID.x, DROID.y - 30);
  if(r.bodyLoss) floatAt(150, 268, '−' + r.bodyLoss, 'foe');
  if(r.hurt){ pulse($('#droid'), 'hit', 320); flashFx('hurt'); if(r.raw >= 10) shake(); }
  else shieldFx();
}
async function foeFx(i, r){
  const e = S.b.foes[i];
  pulse(unitSpr(i, r.by), 'atk', 270);
  if(r.mv && !(r.eat && !r.eat.length) && !(r.steal === 0)) foeSay(i, r.mv);
  if(r.steal){ const p = foeCenter(i); floatAt(p.x - 20, p.y - 60, '−' + r.steal, 'foe'); coinFx(p); }
  if(r.eat && r.eat.length) eatFx(i, r.eat);
  if(r.rebuild){ const q = unitCenter(i, r.rebuild); pulse(unitEl(i, r.rebuild), 'flash', 420); sparks(q.x, q.y); floatAt(q.x, q.y - 40, DATA.ui['unit.rebuilt'] || '修', 'foe'); }
  if(r.flee){ fleeFx(i); }
  const mk = r.react ? markEls.get('r' + i) : markEls.get(r.chainLeft > 0 ? `${i}-${e.seq}-${r.chainLeft}` : `${i}-${e.seq - 1}-0`);
  if(mk) mk.classList.add('fire');
  await sleep(110);
  if(r.kind === 'move'){
    const p = foeCenter(i);
    if(r.buff) floatAt(p.x, p.y - 70, '▲' + r.buff, 'foe');
    if(r.armor){ const q = unitCenter(i, r.by); const el = fxEl('fshield', q.x, q.y - 10); setTimeout(() => el.remove(), 520); floatAt(q.x, q.y - 50, '装+' + r.armor, ''); }
    if(r.heal) floatAt(p.x, p.y - 70, '+' + r.heal, 'cy');
    if(r.crack){ floatAt(DROID.x + 10, DROID.y - 92, DATA.kwName.crack + '+' + r.crack, 'foe'); pulse($('#droid'), 'glitch', 320); }
    if(r.noise){ floatAt(41, 300, 'ノイズ+' + r.noise, 'foe'); pulse($('#pileDraw'), 'flash', 360); }
    if(r.haste) floatAt(xs(1), ROWY[i] - 14, '»' + r.haste, 'foe');
    if(r.zone) floatAt(xs(r.zone.at) + 10, 128, '!', 'foe');
    if(r.summon != null){ buildFoes(); floatAt(foeCenter(r.summon).x, 150, '増援', 'foe'); }
    return;
  }
  if(r.kind === 'delay'){
    if(r.applied){ pulse($('#droid'), 'glitch', 320); floatAt(xs(1), 30, '+' + r.v, 'cy'); if(r.swift) setTimeout(afterimage, 120); }
    return;
  }
  if(r.kind === 'parried'){
    shieldFx(); const p = foeCenter(i); beam(p, {x: DROID.sx + 10, y: DROID.sy + 20});
    for(const x of r.ev) cardFx(x);
    floatAt(DROID.x + 10, DROID.y - 92, DATA.kwName.just, 'cy');
    return;
  }
  hitMeFx(r);
}
function justFx(i, tag){

/* ---------- play ---------- */
// 狙い: 前に狙った敵(とユニット)が生きていればそれ、なければおまかせ。ユニットが2つ以上ある敵は '番号.ユニット'
function defaultTarget(){
  const b = S.b, tf = tFoe(lastTarget), tp = tUnit(lastTarget);
  const e = b.foes[tf] && b.foes[tf].alive ? b.foes[tf] : b.foes.find(f => f.alive); if(!e) return 0;
  if(EN.liveUids(e).length < 2) return e.i;
  return e.i + '.' + (tp && e.units[tp] && !e.units[tp].broken ? tp : EN.defaultUid(e));
}
function recalc(){
  PV = computePreview(); renderAll();
  // 印や帯の中身を出しているなら、選んだカードに合わせて出し直す(使い終わりが重なるか)
  if(UI.mvKey){ const el = document.querySelector(`[data-mk="${UI.mvKey}"],[data-bk="${UI.mvKey}"]`); if(el) showMovePop(UI.mvKey, el); else hideMovePop(); }
}
function onCard(i){
  const k = S.b.hand[i].k, c = CARDS[k];
  if(sel && sel.kind === 'card' && sel.i === i){ execute(); return; }
  sel = {kind:'card', i, k, target: c.tgt ? defaultTarget() : null}; recalc();
}
function onWait(){
  if(sel && sel.kind === 'wait'){ execute(); return; }
  sel = {kind:'wait'}; recalc();
}
function onRedraw(){
  if(!RULE.econ && RULE.freeWait && !S.b.hand.length) return;
  const kind = rdKind();
  if(sel && sel.kind === kind){ execute(); return; }
  sel = {kind}; recalc();
}
// 敵(本体の絵か、ユニットのバー・絵)を押したとき。カードを選んでいれば狙いを変え、もう一度で使う。選んでいなければ詳細
function onFoe(i, uid){
  const e = S.b.foes[i]; if(!e || !e.alive) return;
  const multi = EN.liveUids(e).length > 1;
  if(uid && uid !== '*' && e.units[uid] && e.units[uid].broken) uid = null;
  if(sel && sel.kind === 'card' && CARDS[sel.k].tgt){
    const t = !multi ? i : i + '.' + (uid && uid !== '*' ? uid : (tFoe(sel.target) === i && tUnit(sel.target)) || EN.defaultUid(e));
    if(sel.target === t){ execute(); return; }
    sel.target = t; lastTarget = t; recalc(); return;
  }
  if(!sel) infoFoe(i, uid && uid !== '*' ? uid : null);
}
// タイムラインの印の中身(行動の名前・するユニット・何サイクル後か・文)
function showMovePop(key, el){
  const info = MKINFO.get(key); if(!info) return;
  if(info.kind === 'zone') return showZonePop(key, el, info);
  const e = S.b.foes[info.e]; if(!e) return;
  let title = '', by = '', lines = [];
  if(info.kind === 'pat'){ const a = info.a; title = a.n || ''; if(e.uids.length > 1){ const u = e.units[EN.actorUid(e, a)]; by = `<span class="mp-by"><span class="ic">${pIcon(u)}</span>${u.name}</span>`; } lines = moveLines(e, a); }
  else if(info.kind === 'react'){ title = e.react.n || ''; lines = [fillUi('pas.react', {min: e.react.min, part: SLOT_BY[e.react.p].fn, d: e.react.d + (e.str || 0)})]; }
  else if(info.kind === 'win'){ const a = info.a, W = a[info.w]; title = `${DATA.kwName[info.w]} ${info.val}`; lines = [fillUi('mv.' + info.w, info.w === 'wind' ? {w: W.w, poise: W.poise} : info.w === 'guard' ? {w: W.w, s: info.val} : {w: W.w, cd: W.d}), fillUi('band.before', {name: a.n, t: info.t})]; }
  else if(info.kind === 'rec'){ title = DATA.kwName.vuln; lines = [fillUi('mv.rec', {rec: info.a.rec}), fillUi('band.after', {name: info.a.n, t: info.t})]; }
  else if(info.kind === 'vulnNow'){ title = DATA.kwName.vuln; lines = [fillUi('st.vuln', {n: info.t1})]; if(e.uids.length > 1){ const u = e.units[info.uid]; by = `<span class="mp-by"><span class="ic">${pIcon(u)}</span>${u.name}</span>`; } }
  else lines = [fillUi('foe.rand', {})];
  // 帯と危険域: 何サイクル後から何サイクル後までか。カードを選んでいれば、使い終わりが重なるか
  const range = info.t0 != null ? (info.t0 === info.t1 ? `${info.t0}` : `${info.t0}–${info.t1}`) : info.t;
  if(info.t0 != null && PV && !busy){ const c = PV.completeAt; lines.push(fillUi(c >= info.t0 && c <= info.t1 ? 'band.hit' : 'band.miss', {c})); }
  const pop = $('#mvpop');
  pop.innerHTML = `<div class="mp-h"><b>${title || '?'}</b>${by}<span class="mp-t"><span class="ic">${IC.clock}</span>${range}</span></div>${lines.map(l => `<p>${refText(l)}</p>`).join('')}`;
  pop.style.left = Math.max(96, Math.min(844 - 296, el.offsetLeft - 40)) + 'px'; pop.style.top = (el.offsetTop + el.offsetHeight + 8) + 'px';
  pop.hidden = false; UI.mvKey = key; renderMarks();
}
function showZonePop(key, el, info){
  const z = info.z, lines = [fillUi('zone.now', {part: SLOT_BY[z.p].fn, d: z.d + (S.b.crack || 0)}), fillUi('zone.src', {name: z.n})];
  if(PV && !busy){ const c = PV.completeAt; lines.push(fillUi(c >= info.t0 && c <= info.t1 ? 'band.hit' : 'band.miss', {c})); }
  const pop = $('#mvpop'), range = info.t0 === info.t1 ? `${info.t0}` : `${info.t0}–${info.t1}`;
  pop.innerHTML = `<div class="mp-h"><b>${DATA.kwName.zone}</b><span class="mp-t"><span class="ic">${IC.clock}</span>${range}</span></div>${lines.map(l => `<p>${refText(l)}</p>`).join('')}`;
  const r = el.getBoundingClientRect(), st = $('#stage').getBoundingClientRect(), sc = st.width / 844;
  pop.style.left = Math.max(96, Math.min(844 - 296, (r.left - st.left) / sc - 40)) + 'px'; pop.style.top = ((r.bottom - st.top) / sc + 8) + 'px';
  pop.hidden = false; UI.mvKey = key; renderMarks(); renderStrip();
}
function hideMovePop(){ if($('#mvpop').hidden) return; $('#mvpop').hidden = true; UI.mvKey = null; if(S && S.b){ renderMarks(); renderStrip(); } }
// タイムラインを押すと、キャラを透かして予定を見やすくする(もう一度押すか、ほかを押すと戻る)
function setPeek(on){ $('#shaker').classList.toggle('peek', !!on); }
const peeking = () => $('#shaker').classList.contains('peek');
function flyCard(el, x, y){
  if(!el) return;
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = 'scale(.25) rotate(12deg)'; el.style.opacity = '0';
  setTimeout(() => el.remove(), 260);
}
// 耐久が減って行動が変わった敵を知らせる
function phaseCheck(){ for(const e of S.b.foes){ if(e.phased && !e._phaseShown && e.alive){ e._phaseShown = true; const p = foeCenter(e.i); floatAt(p.x, p.y - 96, '!!', 'foe big'); pulse(foeEl(e.i), 'ejust', 460); rescan('PHASE'); } } }
async function showEvent(ev, k, ti){
  if(ev.type === 'card' || ev.type === 'timer' || ev.type === 'foe') setTimeout(phaseCheck, 0);
  switch(ev.type){
    case 'tick': if(!ev.real) afterimage(); renderAll(); await sleep(ev.real ? T_TICK : T_SWIFT); break;
    case 'react': { const p = foeCenter(ev.e); floatAt(p.x, p.y - 70, '!', 'foe'); pulse(foeEl(ev.e), 'ehit', 200); renderAll(); await sleep(180); break; }
    case 'just': justFx(ev.e, 'JUST'); { const p = foeCenter(ev.e); floatAt(p.x, p.y - 86, DATA.kwName.just, 'just2 big'); } renderAll(); await sleep(420); break;
    case 'card': if(k) cardMotion(k, ti); for(const x of ev.ev) cardFx(x); renderAll(); await sleep(320); break;
    case 'timer': { const p = unitCenter(ev.t.e, ev.t.unit); const el = fxEl('burst', p.x, p.y - 10); setTimeout(() => el.remove(), 520); for(const x of ev.ev) cardFx(x); renderAll(); await sleep(320); break; }
    case 'turn': {
      const ids = new Set(S.b.hand.map(c => c.id));
      for(const [id, el] of cardEls) if(!ids.has(id)){ cardEls.delete(id); flyCard(el, 20, 340); }
      floatAt(NOW + 8, STRIP_Y - 14, '区切り', 'cy');
      renderAll(); await sleep(380); break;
    }
    case 'arrive': if(ev.r && ev.r.burn) floatAt(41, 290, '溢', 'foe'); renderAll(); await sleep(90); break;
    case 'foe': await foeFx(ev.e, ev.res); renderAll(); await sleep(190); break;
    case 'interrupt': interruptFx(); renderAll(); await sleep(420); break;
  }
}
async function execute(){
  const s = sel, b = S.b, a = selAction(); sel = null; PV = null; busy = true; UI.view = 'normal'; setPeek(false); hideMovePop();
  if(a.type === 'card'){
    if(a.t != null) lastTarget = a.t;
    const cd = b.hand[a.i], el = cardEls.get(cd.id); cardEls.delete(cd.id); flyCard(el, DROID.x - 48, DROID.y - 60);
    setTimeout(() => { const g = fxEl('cardghost', DROID.x, DROID.y - 50); setTimeout(() => g.remove(), 420); }, 180);
  } else if(a.type === 'swap' || a.type === 'reload'){
    b.hand.forEach((cd, n) => { const el = cardEls.get(cd.id); cardEls.delete(cd.id); setTimeout(() => flyCard(el, 20, 340), n * 30); });
  }
  const p = EN.beginAction(S, a);
  if(p.pursuit) for(const x of p.pursuit){ floatAt(xs(1), ROWY[x.e] - 14, '»' + x.n, 'foe'); pulse(foeEl(x.e), 'atk', 270); }
  $('#droid').classList.add('casting');
  renderAll();
  const g = EN.spendGen(S, p.cost, p.k, p.t, false); let r;
  while(!(r = g.next()).done) await showEvent(r.value, p.k, p.t);
  $('#droid').classList.remove('casting');
  const out = r.value;
  EN.endAction(S, p, out);
  if(out.dead){ renderAll(); await sleep(350); onLose(); busy = false; return; }
  if(out.won){ b.over = true; renderAll(); await sleep(500); onWin(); busy = false; return; }
  busy = false;
  renderAll();
}

const AREA = () => DATA.areas[(S && S.run && S.run.area) || 0];
/* ---------- 保存(0.19.0): 部屋に入るたび・地図に戻るたびに自動で保存。戦闘の途中でやめると、つづきからはその戦闘のはじめから ---------- */
const SAVE_KEY = 'asc.save';
function saveRun(pending){
  if(!S || !S.run || S.run.debug || (UI.node && UI.node.debug)) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({v:1, run:S.run, pending:pending || null, cls:clsKey(), at:Date.now()})); }catch(e){}
}
function loadSave(){ try{ const o = JSON.parse(localStorage.getItem(SAVE_KEY)); return o && o.v === 1 && o.run && o.run.map ? o : null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function resumeRun(){
  const o = loadSave(); if(!o){ showTitle(); return; }
  hideOv(); $('#titleScr').hidden = true;
  S = {run: o.run, b: null}; UI.mapSel = null; UI.node = null; UI.pick = null; if(S.run.alert == null) S.run.alert = 0;
  if(o.pending === 'transit'){ UI.node = {type:'transit'}; UI.eventId = DATA.transit[S.run.area - 1].id; UI.healed = null; showEventRoom(); }
  else if(o.pending){ const n = findNode(o.pending); if(n) enterRoom(n); else showMap(); }

/* ---------- 参照(0.18.0) ----------
   説明の文に出てくるカード(《》)・キーワード・ユニット(【】)を押すと、その説明を重ねて出す。重ねた説明の中からも参照できる */
function refText(h, self){
  const T = [], tok = x => { T.push(x); return `\u0001${T.length - 1}\u0001`; };
  h = h.replace(/《([^《》]+)》/g, (m, n) => { const k = Object.keys(CARDS).find(c => CARDS[c].name === n); return k ? tok(`<button type="button" class="ref" data-act="ref" data-arg="card:${k}">《${n}》</button>`) : m; });
  const fe = UI.focus && S && S.b ? S.b.foes[UI.focus.i] : null;
  h = h.replace(/【(?:<b>)?([^【】<]+)(?:<\/b>)?】/g, (m, n) => { const k = fe && fe.uids.find(u => fe.units[u].name === n); return k ? tok(`<button type="button" class="ref u" data-act="foeMove" data-arg="u:${k}">【${n}】</button>`) : m; });
  // キーワードは、文の中で最初に出たところだけ
  for(const [key, name] of kwList()){
    if(name === self) continue;
    const at = h.indexOf(name); if(at < 0) continue;
    h = h.slice(0, at) + tok(`<button type="button" class="ref" data-act="ref" data-arg="kw:${key}">${name}</button>`) + h.slice(at + name.length);
  }
  return h.replace(/\u0001(\d+)\u0001/g, (m, i) => T[+i]);
}
function pushRef(arg){ (UI.refs = UI.refs || []).push(arg); renderRef(); }

  if(kind === 'kw'){ const name = DATA.kwName[key]; h = `<h2>${name}</h2><p class="rdesc">${refText(KW[name] || '', name)}</p>`; }
  else if(kind === 'card') h = `<div style="display:flex;gap:16px;align-items:flex-start"><div class="cards" style="margin:0"><div class="card static">${cardInner(key, S && S.b ? S : null)}</div></div><div class="ckw">${kwBlock(key)}</div></div>`;

  const rows = [0, 1, 2].map(i => `<div class="dslot"><span class="dn">${'ABC'[i]}</span><div class="seg" style="margin:0"><button type="button" class="${DBG.custom[i] ? '' : 'on'}" data-act="dbgSlot" data-arg="${i}:">なし</button>${keys.map(k => `<button type="button" class="${DBG.custom[i] === k ? 'on' : ''}" data-act="dbgSlot" data-arg="${i}:${k}">${FOES[k].name}${['drone2','linkB'].includes(k) ? '′' : ''}</button>`).join('')}</div></div>`).join('');
  showOv(`<h2>自由に組む</h2>${rows}<div class="row"><button class="btn" type="button" data-act="dbgBack">戻る</button></div>`, false, true);
}
function dbgRedraw(){ ({top:showDebug, deck:showDebugDeck, parts:showDebugParts, nums:showDebugNums, custom:showDebugCustom})[UI.dbgView || 'top'](); }
// 選んだ設定で1戦だけ始める
function startDebugBattle(enc){
  const run = EN.newRun(Math.floor(Math.random() * 1e9));
  run.deck = DBG.deck.slice(); run.debug = true;
  for(const p of SLOTS) run.parts[p.id] = {id: DBG.parts[p.id], damaged: false};
  run.body = run.bodyMax = DBG.body;
  S = {run, b: null};
  const custom = enc === 'dbg';
  if(custom) ENC.dbg = {fam:'自由', foes: DBG.custom.filter(Boolean)};
  const E = ENC[enc];
  UI.node = {type: E.boss ? 'boss' : E.elite ? 'elite' : 'battle', enc, debug: true};
  UI.dbgEnc = enc; hideOv();
  startBattle(UI.node);
  if(custom) delete ENC.dbg; // 地図の生成に混ざらないように
  // 敵の攻撃と耐久の倍率
  const sc = x => Math.max(1, Math.round(x * DBG.dmg));
  const fixPat = pat => pat.map(a => { const o = JSON.parse(JSON.stringify(a)); if(o.d > 0) o.d = sc(o.d); if(o.counter) o.counter.d = sc(o.counter.d); return o; });
  for(const e of S.b.foes){
    for(const k of e.uids){ const u = e.units[k]; u.hp = u.max = Math.max(1, Math.round(u.max * DBG.hp)); }
    e.hp = e.uids.reduce((x, k) => x + (e.units[k].vital ? e.units[k].hp : 0), 0); e.maxHp = e.hp;
    e.pat = fixPat(e.pat);
    if(e.phase) e.phase = {at: e.phase.at, pat: fixPat(e.phase.pat)};
    if(e.react) e.react = {...e.react, d: sc(e.react.d)};
  }
  renderAll();
}
function showDebugResult(won){
  showOv(`<h2>${won ? '勝利' : '機能停止'}</h2>${bodyLine()}${partTiles()}<p class="sub" style="margin:8px 0 10px">${S.b.T}サイクル</p><div class="row"><button class="btn ghost" type="button" data-act="debug">デバッグへ</button><button class="btn" type="button" data-act="dbgAgain">もう一度</button></div>`);
}
function showRules(first){
  showOv(`<h2>遊び方</h2><ul>
    <li>時間はカードを使ったときだけ進む。カード左上の数字が、かかるサイクル。0は即時。</li>
    ${!RULE.econ ? `<li>手札は3サイクルごとに1枚届く(最大${RULE.handMax}枚)。届く時刻はタイムラインの下の段。軽いカードを続けると手札が減り、重いカードの間に手札がたまる。</li>`
      : RULE.econ.type === 'turn' ? `<li>${RULE.econ.len}サイクルごとに区切り(点線)。区切りで手札を捨てて${RULE.econ.hand}枚引き、ブロックも消える。右下の上段は区切りまで待つ。</li>`
      : `<li>手札は自動では届かない。好きなときに右下のリフレッシュ(${RULE.econ.r}サイクル)で、手札を全部捨てて${RULE.econ.hand}枚引く。リフレッシュを始めるとブロックをすべて失う。</li>`}
    <li>奥の画面に敵の行動の予定が流れてくる。数字はダメージ、下の印は狙う部位。紫の丸は不安定な行動、砂時計は自分へのディレイ。</li>
    <li>カードが発動する前に攻撃を受けると中断。ブロックで全部防ぐか、菱形のあるカード(アトミック)なら中断されない。不安定な行動と同じサイクルに発動すると、JUSTでブレイクする(行動が止まる)。</li>
    <li>目の印の敵は、重いカードを使い始めると撃ってくる。鎖の印の敵は、仲間と同時に攻撃すると強くなる。</li>
    <li>予定の下の帯は、その間にカードが発動したときに効く。<b>体勢</b>は一度に数字以上のダメージでブレイク。<b>防壁</b>は数字までダメージを防がれる。<b>反撃</b>は攻撃するたびに撃ち返される。<b>隙</b>はダメージ1.5倍。</li>
    ${!RULE.econ ? `<li>右下は手札の入れ替え(枚数ぶんのサイクル)${RULE.freeWait ? 'と、1サイクルの待機' : '。手札がないときは1サイクルの待機'}。</li>` : RULE.freeWait || RULE.econ.type === 'turn' ? '<li>右下の下段は1サイクルの待機。</li>' : ''}
    <li>上スワイプで手札を広げ、下スワイプで自分の内側を見る。長押しでカードと敵の詳細。タイムラインを押すとキャラが透ける。</li>
  </ul><div class="row">${first ? '<button class="btn ghost" type="button" data-act="debug">デバッグ</button>' : ''}<button class="btn" type="button" data-act="close">${first ? 'はじめる' : '閉じる'}</button></div>`, !first);
}
function showMenu(){
  const at = S.run.at, pos = !at ? '入口' : at.boss ? 'ボス' : `部屋${at.idx + 1}/${AREA().rooms + 1}`;
  showOv(`<h2>${AREA().name} · ${UI.screen === 'battle' && UI.node ? DATA.rooms[UI.node.type].name : pos}</h2><p class="sub">Ascendroid ${APP_VERSION} · ${CLS[clsKey()].name}</p><div class="mlist"><button class="opt" type="button" data-act="rules"><b>遊び方</b></button><button class="opt" type="button" data-act="unit"><b>機体</b></button><button class="opt" type="button" data-act="deck"><b>デッキ</b></button><button class="opt" type="button" data-act="fs"><b>全画面</b></button><button class="opt" type="button" data-act="title"><b>タイトルへ</b></button><button class="opt" type="button" data-act="debug"><b>デバッグ</b></button></div>${closeRow}`, true);
}
async function goFull(){
  hideOv();
  try{ await document.documentElement.requestFullscreen(); try{ await screen.orientation.lock('landscape'); }catch(e){} }catch(e){}
}
// 画面の出入りの動き(0.18.4): 開いたとき・別の段に移ったときだけ enter を付けて動かす(選び直しで描き直すたびには動かさない)
function enter(el){ if(!el) return; el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); clearTimeout(el._et); el._et = setTimeout(() => el.classList.remove('enter'), 700); }
const ovHead = html => (html.match(/<h2>([\s\S]*?)<\/h2>/) || [])[1] || html.slice(0, 40);
function showOv(html, closable, wide){ const ov = $('#ov'), head = ovHead(html), fresh = ov.hidden || ov._head !== head; ov._head = head; $('#ovbox').innerHTML = html; $('#ovbox').classList.toggle('wide', !!wide); ov.dataset.closable = closable ? '1' : ''; ov.hidden = false; if(fresh) enter(ov); }
function hideOv(){ $('#ov').hidden = true; }
function showOv2(html){ const fresh = $('#ov2').hidden; $('#ovbox2').innerHTML = html; $('#ov2').hidden = false; $('#ov').classList.add('under'); if(fresh) enter($('#ov2')); }
function hideOv2(){ $('#ov2').hidden = true; $('#ov').classList.remove('under'); }
function act(a, arg, el){
  switch(a){
    case 'close': hideOv(); break;
    case 'foeMove': if(UI.focus){ UI.focus.sel = arg; renderFocus(); } break;
    case 'ref': pushRef(arg); break;
    case 'refBack': popRef(); break;
    case 'refClose': popRef(true); break;
    case 'foeClose': closeFocus(); break;
    case 'menu': if(!busy) showMenu(); break;
    case 'rules': showRules(false); break;
    case 'deck': infoDeck(); break;
    case 'unit': infoUnit('parts'); break;
    case 'alert': infoAlert(); break;
    case 'unitTab': infoUnit(arg); break;
    case 'fs': goFull(); break;
    case 'debug': if(!DBG) dbgLoad(); UI.pick = DBG.enc; showDebug(); break;
    case 'dbgPick': UI.pick = UI.pick === arg ? null : arg; DBG.enc = UI.pick; dbgSave(); showDebug(); break;
    case 'dbgGo': if(UI.pick && (UI.pick !== 'dbg' || DBG.custom.some(Boolean))){ const k = UI.pick; UI.pick = null; startDebugBattle(k); } break;
    case 'dbgAgain': startDebugBattle(UI.dbgEnc); break;
    case 'dbgView': ({deck:showDebugDeck, parts:showDebugParts, nums:showDebugNums, custom:showDebugCustom})[arg](); break;
    case 'dbgBack': showDebug(); break;
    case 'dbgPreset': DBG.deck = DBG_PRESET[arg](); dbgSave(); showDebugDeck(); break;
    case 'dbgCard': { const [k, d] = arg.split(':'); if(+d > 0) DBG.deck.push(k); else { const i = DBG.deck.lastIndexOf(k); if(i >= 0) DBG.deck.splice(i, 1); } dbgSave(); showDebugDeck(); break; }
    case 'dbgPart': { const [sl, id] = arg.split(':'); DBG.parts[sl] = id; dbgSave(); showDebugParts(); break; }
    case 'dbgNum': { const [key, v] = arg.split(':'); DBG[key] = +v; dbgSave(); applyEcon(); showDebugNums(); break; }
    case 'dbgCls': DBG.cls = arg; dbgSave(); applyEcon(); showDebugNums(); break;
    case 'dbgWait': DBG.wait = arg === 'c' ? null : arg === '1'; dbgSave(); applyEcon(); showDebugNums(); break;
    case 'dbgSlot': { const [i, k] = arg.split(':'); DBG.custom[+i] = k || null; dbgSave(); showDebugCustom(); break; }
    case 'restart': UI.pick = null; UI.learnOpts = []; newRun(); break;
    case 'title': UI.pick = null; UI.learnOpts = []; showTitle(); break;
    case 'continue': resumeRun(); break;
    case 'reload': reloadApp(); break;
    case 'newGame': if(loadSave() && UI.titleConfirm !== true){ UI.titleConfirm = true; showTitle(); break; } UI.titleConfirm = false; clearSave(); newRun(); break;
    case 'retry': S = {run: JSON.parse(snapshot), b: null}; hideOv(); startBattle(UI.node); break;
    case 'node': UI.mapSel = UI.mapSel === arg ? null : arg; showMap(); break;
    case 'go': { const n = findNode(UI.mapSel); if(UI.going || !EN.nextNodes(S.run).some(x => nodeKey(x) === UI.mapSel)) break;
      // 選んだ部屋が光ってから、地図が引いて部屋へ
      UI.going = true; const el = document.querySelector(`.mn[data-arg="${UI.mapSel}"]`); if(el) el.classList.add('go'); $('#mapScr').classList.add('leave');
      setTimeout(() => { UI.going = false; enterRoom(n); }, RM ? 0 : 230); break; }
    case 'afterWin': UI.pick = null; hideOv(); afterWin(); break;
    case 'pick': {
      UI.pick = UI.pick === arg ? null : arg;
      const v = el.dataset.view;
      ({learn:showLearn, rest:showRest, defrag:showDefrag, shop:showShop, event:showEventRoom, part:showPartOffer})[v]();
      break;
    }
    case 'learn': if(UI.pick){ S.run.deck.push(UI.pick); afterLearn(); } break;
    case 'skipLearn': afterLearn(); break;
    case 'takePart': if(UI.pick) showSwap(); break;
    case 'swapBack': hideOv2(); break;
    case 'swapGo': if(UI.pick){ const d = PARTDEF[UI.pick]; S.run.parts[d.slot] = {id:UI.pick, damaged:false}; UI.pick = null; completeRoom(); } break;
    case 'skipPart': UI.pick = null; completeRoom(); break;
    case 'rest':
      if(UI.pick === 'repair'){ S.run.body = Math.min(S.run.bodyMax, S.run.body + 15); for(const p of SLOTS) S.run.parts[p.id].damaged = false; completeRoom(); }
      else if(UI.pick === 'defrag'){ UI.pick = null; UI.back = 'rest'; showDefrag(); }
      break;
    case 'backDefrag': UI.pick = null; if(UI.back === 'shop') showShop(); else if(UI.back === 'event') showEventRoom(); else { UI.pick = 'defrag'; showRest(); } break;
    case 'del': if(UI.pick){ const i = S.run.deck.indexOf(UI.pick); if(i >= 0) S.run.deck.splice(i, 1); UI.pick = null; if(UI.back === 'shop'){ S.run.scrap -= DATA.shop.defrag; showShop(); } else completeRoom(); } break;
    case 'buy': {
      const pk = UI.pick, sh = DATA.shop, run = S.run; if(!pk) break;
      if(pk[0] === 'c'){ const i = +pk.slice(1), k = UI.offers[i]; if(!k || run.scrap < price(k)) break; run.scrap -= price(k); run.deck.push(k); UI.offers[i] = null; UI.pick = null; showShop(); }
      else if(pk === 'repair'){ if(run.scrap < sh.repairCost) break; run.scrap -= sh.repairCost; run.body = Math.min(run.bodyMax, run.body + sh.repairBody); for(const p of SLOTS) run.parts[p.id].damaged = false; UI.pick = null; showShop(); }
      else if(pk === 'defrag'){ if(run.scrap < sh.defrag) break; UI.pick = null; UI.back = 'shop'; showDefrag(); }
      break;
    }
    case 'leave': completeRoom(); break;
    case 'choose': { if(UI.pick == null) break; const ev = findEvent(UI.eventId); const fx = ev.choices[+UI.pick].fx; UI.pick = null; applyEvent(fx); break; }
    case 'done': completeRoom(); break;
  }
}

/* ---------- input ---------- */
const stage = $('#stage');
let lpTimer = null, longFired = false, swipe = null, swallow = false;
const inBattle = () => UI.screen === 'battle' && S && S.b;
stage.addEventListener('pointerdown', ev => {
  swipe = {x: ev.clientX, y: ev.clientY};
  if(!inBattle() || busy || !$('#ov').hidden || !$('#ref').hidden || UI.view === 'self' || UI.focus) return;
  const c = ev.target.closest('#hand .card[data-i]'), f = ev.target.closest('.foe[data-f],.eu[data-f],.ew[data-f],.upt[data-f]');
  if(!c && !f) return;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    longFired = true; setTimeout(() => { longFired = false; }, 700);
    if(c) infoCard(S.b.hand[+c.dataset.i].k); else infoFoe(+f.dataset.f, f.dataset.u && f.dataset.u !== '*' ? f.dataset.u : null);
  }, 430);
});
stage.addEventListener('pointermove', ev => {
  if(swipe && Math.hypot(ev.clientX - swipe.x, ev.clientY - swipe.y) > 10) clearTimeout(lpTimer);
});
stage.addEventListener('pointerup', ev => {
  clearTimeout(lpTimer);
  if(!swipe) return;
  const dy = ev.clientY - swipe.y, dx = ev.clientX - swipe.x, s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
  swipe = null;
  if(inBattle() && $('#ov').hidden && $('#ref').hidden && !busy && !UI.focus && Math.abs(dy) > 34 * s && Math.abs(dy) > Math.abs(dx) * 1.3){
    let v = UI.view;
    if(dy < 0) v = v === 'self' ? 'normal' : v === 'normal' ? 'hand' : v;
    else v = v === 'hand' ? 'normal' : v === 'normal' ? 'self' : v;
    if(v !== UI.view){ UI.view = v; if(v === 'self'){ sel = null; PV = null; } renderAll(); }
    swallow = true; setTimeout(() => { swallow = false; }, 350);
  }
});
['pointercancel','pointerleave'].forEach(n => stage.addEventListener(n, () => { clearTimeout(lpTimer); }));
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('click', ev => {
  if(longFired){ longFired = false; return; }
  if(swallow){ swallow = false; return; }
  const t = ev.target, a = t.closest('[data-act]');
  if(a && !a.disabled){ act(a.dataset.act, a.dataset.arg, a); return; }
  if(!$('#ref').hidden){ if(t === $('#ref')) popRef(); return; }
  if(!$('#ov2').hidden){ if(t === $('#ov2')) hideOv2(); return; }
  const ov = $('#ov');
  if(!ov.hidden){ if(t === ov && ov.dataset.closable) hideOv(); return; }
  if(UI.focus){ if(!t.closest('#focus')) closeFocus(); return; }
  // 地図: 部屋を選んだあと、何もないところを押すと選ぶ前に戻る
  if(!$('#mapScr').hidden && UI.mapSel && !t.closest('.minfo,.mh-bar')){ UI.mapSel = null; showMap(); return; }
  if(!inBattle() || busy || UI.view === 'self') return;
  // タイムラインを押すと透かす(何も選んでいないとき)。透かしている間は、ほかを押すと戻る
  const mk = t.closest('.mk[data-mk]'); if(mk){ if(UI.mvKey === mk.dataset.mk) hideMovePop(); else showMovePop(mk.dataset.mk, mk); return; }
  const bd = t.closest('[data-bk]'); if(bd){ if(UI.mvKey === bd.dataset.bk) hideMovePop(); else showMovePop(bd.dataset.bk, bd); return; }
  if(t.closest('#mvpop')) return;
  if(!$('#mvpop').hidden && !t.closest('#hand .card,#redraw,#waitBtn')){ hideMovePop(); if(t.closest('#screen')) return; }
  if(t.closest('#screen') && !sel){ setPeek(!peeking()); return; }
  if(peeking()){ setPeek(false); if(!t.closest('#hand .card,#redraw,#waitBtn')) return; }
  const card = t.closest('#hand .card[data-i]'); if(card){ onCard(+card.dataset.i); return; }
  if(t.closest('#redraw')){ onRedraw(); return; }
  if(t.closest('#waitBtn')){ onWait(); return; }
  const f = t.closest('[data-f]'); if(f){ onFoe(+f.dataset.f, f.dataset.u); return; }
  const p = t.closest('#parts .part'); if(p){ infoPart(p.dataset.p); return; }
  if(t.closest('.pile')){ infoDeck(); return; }
  if(sel){ sel = null; PV = null; renderAll(); }
});

function fit(){
  const w = $('#wrap');
  document.documentElement.style.setProperty('--s', Math.max(0.2, Math.min(w.clientWidth / 844, w.clientHeight / 390)));
}
addEventListener('resize', fit);
// ボタンにフォーカスが移ったときなどに、画面がずれないようにする
for(const el of [$('#wrap'), stage]) el.addEventListener('scroll', () => { el.scrollTop = 0; el.scrollLeft = 0; });
fit();
buildStatic();
dbgLoad(); applyEcon();
showTitle();
</script>
<script>
// オフライン用のサービスワーカー登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
