<title>Ascendroid 案A 白熱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 配置: 自機(左)と敵(右)のあいだの線路がそのままタイムライン。枠や窓は置かず、暗がりの中の光だけで読ませる */
:root{
  color-scheme:dark;
  --soot:#070605;   /* 地。煤の黒 */
  --iron:#15120f;   /* 鋼板 */
  --iron2:#221d19;
  --ash:#958b80;    /* 副の文字 */
  --bone:#f1e8da;   /* 主の文字 */
  --frost:#cdefe6;  /* 自分と操作: 焼き入れた鋼の冷たさ */
  --frost-d:#2f9c90;
  --ember:#b8321a;  /* 脅威(遠い) */
  --flame:#ff7a1f;  /* 脅威(近い) */
  --glow:#ffe6ae;   /* 白熱 */
  --arc:#b7a0ff;    /* 不安定と JUST: 溶接の光 */
  --steel:#8f9aa3;
  --num:"Big Shoulders Display","Barlow Condensed","Arial Narrow",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
html,body{height:100%}
body{background:var(--soot);color:var(--bone);font-family:var(--jp);overflow:hidden;overflow:clip;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--frost);outline-offset:2px}
#wrap{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#fit{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;transform-origin:50% 50%;overflow:hidden;overflow:clip;background:var(--soot)}
#rot{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:13px;color:var(--ash);z-index:5}
#shake{position:absolute;inset:0}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .f{fill:currentColor;stroke:none}
.view{position:absolute;inset:0}

/* ---- 塔の中 ---- */
#bg{position:absolute;inset:0;pointer-events:none}
#bg .ribs{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,transparent 0 86px,rgba(255,236,214,.028) 86px 88px,transparent 88px 174px),
  linear-gradient(180deg,#0e0b09 0%,#070605 72%)}
#bg .col{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#040303,#0b0908 70%,#131009);box-shadow:1px 0 0 rgba(255,220,190,.05)}
#bg .haze{position:absolute;right:-14%;bottom:40px;width:80%;height:130%;background:radial-gradient(closest-side at 72% 82%,rgba(255,104,30,.36),rgba(184,50,26,.13) 46%,transparent 76%);opacity:calc(.22 + var(--threat,0)*.78);transition:opacity .5s}
#bg .cold{position:absolute;left:-14%;bottom:30px;width:52%;height:95%;background:radial-gradient(closest-side at 36% 82%,rgba(160,232,220,.11),transparent 72%)}
#bg .floor{position:absolute;left:0;right:0;top:var(--floorY);height:1px;background:linear-gradient(90deg,transparent,rgba(205,239,230,.3) 10%,rgba(241,232,218,.14) 45%,rgba(255,140,70,.4) 84%,transparent)}
#bg .under{position:absolute;left:0;right:0;top:calc(var(--floorY) + 1px);bottom:0;background:linear-gradient(180deg,#0d0a09,#040303 60%)}
#bg .gantry{position:absolute;left:0;right:0;top:calc(var(--floorY) - 262px);height:26px;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.55) 30px 34px),repeating-linear-gradient(60deg,rgba(255,236,214,.035) 0 2px,transparent 2px 26px),linear-gradient(180deg,#0a0807,#050404);box-shadow:0 1px 0 rgba(255,220,190,.06),0 -1px 0 rgba(255,220,190,.04)}
#bg .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.75))}
#embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---- 上の列 ---- */
#top{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:11px;z-index:20}
#top .area{font-weight:700;letter-spacing:.06em}
.heat{display:flex;align-items:center;gap:6px;color:var(--ash)}
.heat .segs{display:flex;gap:2px}
.heat .segs i{width:11px;height:5px;background:#2a231e}
.heat .segs i.on{background:var(--flame)}
.heat .segs i.on.c{background:var(--frost-d)}
.heat b{color:var(--bone);font-weight:700}
#top .sp{flex:1}
#top .scrap{display:flex;align-items:center;gap:4px;font:700 15px var(--num);color:var(--bone)}
#top .scrap .ic{color:var(--ash)}
#menuBtn{width:30px;height:26px;display:grid;place-items:center;color:var(--ash)}
#tabs{position:absolute;left:50%;top:4px;transform:translateX(-50%);display:flex;align-items:center;gap:1px;padding:2px;border-radius:999px;background:rgba(255,240,220,.07);z-index:21}
#tabs em{font-style:normal;font-size:9px;color:var(--ash);padding:0 6px 0 8px;letter-spacing:.1em}
#tabs button{font-size:10.5px;padding:3px 10px;border-radius:999px;color:var(--ash);line-height:1.3}
#tabs button.on{background:var(--bone);color:#14100c;font-weight:700}

/* ---- 線路(タイムライン) ---- */
#railLine{position:absolute;left:var(--x0);width:calc(var(--x1) - var(--x0));top:var(--railY);height:1px;background:linear-gradient(90deg,rgba(205,239,230,.7),rgba(241,232,218,.2) 28%,rgba(255,122,31,.3))}
#ticks{position:absolute;left:var(--x0);top:calc(var(--railY) - 3px);width:calc(var(--x1) - var(--x0) + 1px);height:7px;background:repeating-linear-gradient(90deg,rgba(241,232,218,.42) 0 1px,transparent 1px var(--cw))}
.tn{position:absolute;top:calc(var(--railY) + 7px);font:500 10px var(--num);color:#6d655d;transform:translateX(-50%);pointer-events:none}
#now{position:absolute;left:calc(var(--x0) - 5px);top:calc(var(--railY) - 5px);width:10px;height:10px;transform:rotate(45deg);background:var(--frost);box-shadow:0 0 12px rgba(205,239,230,.8)}
#clip{position:absolute;inset:0;clip-path:inset(0 0 0 calc(var(--x0) - 18px));pointer-events:none}
.tok{position:absolute;left:0;top:var(--railY);width:0;height:0;transition:transform linear,opacity .2s;will-change:transform;--hc:#b8321a;--hg:0;pointer-events:auto;cursor:pointer}
.tok::before{content:"";position:absolute;left:-17px;top:-38px;width:34px;height:64px}
.tok .halo{position:absolute;left:-38px;top:-38px;width:76px;height:76px;border-radius:50%;background:radial-gradient(closest-side,var(--hc),transparent 72%);opacity:calc(.1 + var(--hg)*.5);pointer-events:none}
.tok .disc{position:absolute;left:-14px;top:-14px;width:28px;height:28px;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;background:#0e0a08;border:1.5px solid var(--hc);color:var(--hc);font:700 17px/1 var(--num)}
.tok.near .disc{background:var(--hc);color:#1c0e06}
.tok .tg{position:absolute;left:-7px;top:-33px;width:14px;height:14px;color:var(--hc)}
.tok .ug{position:absolute;left:-5px;top:18px;width:10px;height:10px;color:var(--ash);opacity:.9}
.tok .ug .ic{display:block;width:10px;height:10px}
.tok.sub .disc{left:-10px;top:-10px;width:20px;height:20px;font-size:13px}
.tok.sub .lk{position:absolute;right:10px;top:-1px;height:2px;width:calc(var(--cw) - 22px);background:var(--hc);opacity:.6}
.tok.move .disc{border-radius:5px;font-size:13px;gap:1px;grid-auto-flow:column}
.tok.move .disc .ic{width:10px;height:10px}
.tok.ch .disc{border-color:var(--arc);box-shadow:0 0 0 2px rgba(183,160,255,.2),0 0 16px rgba(183,160,255,.55)}
.tok.ch .ring{position:absolute;left:-21px;top:-21px;width:42px;height:42px;box-sizing:border-box;border-radius:50%;border:1.5px dashed var(--arc);animation:spin 7s linear infinite;pointer-events:none}
.tok .note{position:absolute;left:-36px;width:72px;top:-54px;text-align:center;font:900 12px/1 var(--num);letter-spacing:.1em;white-space:nowrap;display:none}
.tok.pv-absorb .disc{border-color:var(--frost);color:var(--frost);background:#0b1211}
.tok.pv-hurt .disc{box-shadow:0 0 0 2px var(--glow),0 0 18px var(--flame);animation:pulse .7s ease-in-out infinite alternate}
.tok.pv-cut .note,.tok.pv-just .note,.tok.pv-broken .note{display:block}
.tok.pv-cut .note{color:var(--flame)}
.tok.pv-just .note,.tok.pv-broken .note{color:var(--arc);text-shadow:0 0 10px rgba(183,160,255,.8)}
.tok.pv-just .disc,.tok.pv-broken .disc{border-color:#fff;color:#fff;background:#3b2f6b;box-shadow:0 0 0 3px rgba(183,160,255,.5),0 0 26px #b7a0ff}
.tok.burst{transition:none;animation:burst .42s ease-out forwards;pointer-events:none}
.win{position:absolute;left:0;top:calc(var(--railY) + 20px);height:22px;transition:transform linear,width .15s;pointer-events:none}
.win i{position:absolute;left:0;right:0;top:0;height:5px;border-radius:1px}
.win b{position:absolute;left:1px;top:8px;white-space:nowrap;font:700 9px/1 var(--jp);letter-spacing:.02em}
.win b span{font:700 11px/1 var(--num);margin-left:2px}
.win.wind i{background:repeating-linear-gradient(115deg,var(--arc) 0 3px,transparent 3px 6px)}
.win.wind b{color:var(--arc)}
.win.guard{top:calc(var(--railY) + 40px)}
.win.guard i{background:repeating-linear-gradient(90deg,var(--steel) 0 2px,transparent 2px 4px)}
.win.guard b{color:var(--steel)}
.win.rec i{background:var(--frost);opacity:.75}
.win.rec b{color:var(--frost)}
#blade{position:absolute;left:var(--x0);top:var(--railY);width:0;height:0;pointer-events:none}
#blade .b1{position:absolute;left:0;top:-2px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(205,239,230,.45),var(--frost));box-shadow:0 0 14px rgba(205,239,230,.65)}
#blade .b2{position:absolute;top:-1px;height:2px;background:repeating-linear-gradient(90deg,rgba(205,239,230,.4) 0 4px,transparent 4px 8px)}
#blade .tip{position:absolute;top:-31px;width:2px;margin-left:-1px;height:62px;background:var(--frost);box-shadow:0 0 12px var(--frost)}
#blade .zone{position:absolute;left:0;top:-31px;height:62px;box-sizing:border-box;background:linear-gradient(90deg,rgba(205,239,230,.02),rgba(205,239,230,.17));border-top:1px solid rgba(205,239,230,.4);border-bottom:1px solid rgba(205,239,230,.4)}
#blade.cutting .zone{background:linear-gradient(90deg,rgba(255,122,31,.02),rgba(255,122,31,.22));border-color:rgba(255,122,31,.55)}
#blade .cut{position:absolute;top:-9px;margin-left:-9px;width:18px;height:18px;color:var(--flame)}
#blade .cut .ic{width:18px;height:18px;stroke-width:2.4}
#blade.cutting .b1{background:linear-gradient(90deg,rgba(205,239,230,.4),var(--flame));box-shadow:0 0 14px rgba(255,122,31,.6)}
#aim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#aim path{fill:none;stroke:var(--frost);stroke-width:1;stroke-dasharray:2 5;opacity:.6}

/* ---- 自機 ---- */
#me{position:absolute;left:58px;top:calc(var(--floorY) - 142px);width:86px;height:142px;transition:transform .12s}
#me svg{position:relative;width:100%;height:100%;overflow:visible}
#me::before{content:"";position:absolute;left:-70px;right:-50px;top:-30px;bottom:-16px;background:radial-gradient(closest-side at 50% 55%,rgba(150,225,212,.16),transparent 78%);pointer-events:none}
#me .body{fill:#060505;stroke:url(#rimMe);stroke-width:1.3;stroke-linejoin:round}
#me .eye{stroke:var(--frost);stroke-width:1.8;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--frost))}
#me .edge{stroke:var(--frost);stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(205,239,230,.9))}
#me .scarf{fill:#17302d;stroke:rgba(205,239,230,.35);stroke-width:.8;transform-origin:36px 36px;animation:sway 3.6s ease-in-out infinite alternate}
#me.lunge{transform:translateX(16px)}
#me.hurt .body{fill:#5a1a0c}
#parts{position:absolute;left:8px;top:calc(var(--floorY) - 128px);width:50px;display:grid;gap:7px}
.pt{display:flex;align-items:center;gap:4px;height:15px;color:var(--ash)}
.pt .ic{width:12px;height:12px}
.pt .pips{display:flex;gap:1px;flex-wrap:wrap;width:32px}
.pt .pips i{width:3px;height:9px;background:#2b2520}
.pt .pips i.on{background:var(--bone)}
.pt .pips i.gh{background:var(--flame);animation:blink .5s steps(2) infinite}
.pt.aim{color:var(--flame)}
.pt.dead{opacity:.45}
.pt.dead .ic{color:var(--ember)}
#hp{position:absolute;left:8px;top:calc(var(--floorY) + 9px);width:132px;display:flex;align-items:center;gap:6px}
#hp .bar{position:relative;flex:1;height:4px;background:#2b2520}
#hp .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bone);transition:width .2s}
#hp .bar s{position:absolute;top:0;bottom:0;background:var(--flame);animation:blink .5s steps(2) infinite}
#hp b{font:700 16px/1 var(--num);min-width:42px;text-align:right}
#hp b small{font-size:11px;color:var(--ash);font-weight:500}
#wall{position:absolute;left:calc(var(--x0) - 24px);top:calc(var(--railY) - 46px);width:4px;height:84px;border-radius:2px;background:linear-gradient(180deg,transparent,var(--frost) 30%,var(--frost) 70%,transparent);box-shadow:0 0 16px rgba(205,239,230,.75);opacity:0;transition:opacity .2s,transform .2s;transform-origin:50% 50%}
#wall.on{opacity:1}
#wall.hit{animation:wallhit .3s ease-out}
#blk{position:absolute;left:calc(var(--x0) - 52px);top:calc(var(--railY) + 42px);width:60px;display:flex;justify-content:center;align-items:center;gap:3px;font:900 20px/1 var(--num);color:var(--frost);opacity:0;transition:opacity .2s}
#blk.on{opacity:1}
#blk small{font:700 12px var(--num);color:var(--ash)}
#meSt{position:absolute;left:62px;top:calc(var(--floorY) - 160px);display:flex;gap:6px;font:700 13px/1 var(--num)}
#meSt span{display:flex;align-items:center;gap:2px;color:var(--flame)}
#say{position:absolute;left:10px;top:calc(var(--floorY) - 196px);max-width:230px;font-size:11px;line-height:1.5;color:var(--bone);opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 1px 6px #000}
#say.on{opacity:.92}
#say::before{content:"";display:inline-block;width:10px;height:1px;background:var(--frost);vertical-align:middle;margin-right:6px}

/* ---- 敵 ---- */
#foe{position:absolute;right:16px;top:calc(var(--floorY) - 172px);width:214px;height:172px;transition:transform .1s}
#foe svg.fig{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#foe .back{position:absolute;left:-90px;right:-60px;top:-70px;bottom:-30px;background:radial-gradient(closest-side at 55% 58%,rgba(255,120,40,calc(.3 + var(--threat,0)*.3)),rgba(184,50,26,.14) 55%,transparent 80%);pointer-events:none}
#foe .body,#foe .foot{fill:#050404}
#foe .joint{fill:#050404;stroke:#2a1a12;stroke-width:1}
#foe .near{fill:none;stroke:#050404;stroke-width:10;stroke-linejoin:round;stroke-linecap:round}
#foe .far{fill:none;stroke:#1a100b;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
#foe .mast{fill:none;stroke:#050404;stroke-width:2}
#foe .hl{fill:none;stroke:#ffb070;stroke-width:1;opacity:.55;stroke-linecap:round}
#foe .eyeF{fill:var(--flame);filter:drop-shadow(0 0 5px var(--flame))}
#foe.recoil{transform:translateX(7px)}
#foe.dead{animation:fall 1.2s ease-in forwards}
#foeName{position:absolute;right:20px;top:calc(var(--floorY) - 196px);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ash)}
.un{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;display:grid;place-items:center;border-radius:50%}
.un svg.rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.un circle{fill:none;stroke-width:3}
.un .tr{stroke:#2a211c}
.un .hpc{stroke:var(--flame);transition:stroke-dashoffset .25s}
.un .ghc{stroke:var(--bone);opacity:0}
.un.pv .ghc{opacity:1;animation:blink .5s steps(2) infinite}
.un b{position:relative;font:700 15px/1 var(--num);color:var(--bone)}
.un .nm{position:absolute;left:50%;top:-12px;transform:translateX(-50%);white-space:nowrap;font-size:8.5px;font-weight:700;color:var(--ash);display:flex;align-items:center;gap:2px}
.un .nm .ic{width:8px;height:8px}
.un.vital::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(255,122,31,.5)}
.un .bd{position:absolute;display:flex;align-items:center;gap:1px;font:700 11px/1 var(--num);padding:1px 3px;border-radius:2px;background:#0c0a09}
.un .bd .ic{width:9px;height:9px}
.un .bd.ar{right:-14px;bottom:-2px;color:var(--steel)}
.un .bd.cr{left:-12px;bottom:-2px;color:var(--frost)}
.un .bd.vu{right:-12px;top:-2px;color:var(--frost)}
.un.tgt::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--frost);border-left-color:transparent;border-right-color:transparent;animation:spin 5s linear infinite;filter:drop-shadow(0 0 4px rgba(205,239,230,.7))}
.un.broken{opacity:.3;pointer-events:none}
.un.broken .hpc{stroke:#3a2c25}
.un.flash{animation:unflash .25s ease-out}
.un .to{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);font:700 11px/1 var(--num);color:var(--bone);white-space:nowrap;display:none}
.un.pv .to{display:block}

/* ---- 手札と下の操作 ---- */
#hand{position:absolute;left:150px;right:150px;bottom:0;height:106px;display:flex;justify-content:center;z-index:10}
.card{position:relative;flex:none;width:98px;height:136px;margin:0 2px;box-sizing:border-box;padding:7px 8px 8px;text-align:left;display:flex;flex-direction:column;border-radius:2px;
  background:linear-gradient(172deg,#26211c 0%,#17130f 38%,#0f0c0a 100%);box-shadow:0 0 0 1px #000,inset 0 1px 0 rgba(255,240,220,.1);transition:transform .14s cubic-bezier(.2,.9,.3,1.2);color:var(--bone)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#5d554c}
.card.r-uncommon::before{background:linear-gradient(90deg,#6d5fd0,#3d8fd8)}
.card.r-rare::before{background:linear-gradient(90deg,#e9c46a,#b8752a)}
.card .crow{display:flex;align-items:center;gap:6px;height:26px}
.card .cost{font:900 28px/1 var(--num);color:var(--frost);min-width:14px}
.card .len{display:flex;gap:2px}
.card .len i{width:9px;height:4px;background:var(--frost);opacity:.85}
.card .len.zero{font:700 9px var(--jp);color:var(--frost);opacity:.8}
.card .attr{height:11px;font-size:8.5px;font-weight:700;color:var(--arc);letter-spacing:.04em}
.card .nm{font-size:13px;font-weight:900;line-height:1.15;letter-spacing:.01em;white-space:nowrap}
.card .nm.long{font-size:11px}
.card .big{display:flex;align-items:center;gap:4px;height:30px;font:900 26px/1 var(--num)}
.card .big .ic{width:15px;height:15px;color:var(--ash)}
.card .tx{font-size:9.5px;line-height:1.4;color:#b9afa3;white-space:pre-wrap}
.card .wm{position:absolute;right:5px;top:30px;width:46px;height:46px;stroke-width:.9;color:var(--bone);opacity:.09}
.card.sel{transform:translateY(-36px);box-shadow:0 0 0 1px var(--frost),0 0 22px rgba(205,239,230,.35),inset 0 1px 0 rgba(255,240,220,.1);z-index:3}
.card.hov{transform:translateY(-12px)}
.card.in{animation:deal .28s cubic-bezier(.2,.8,.3,1) backwards}
#piles{position:absolute;left:8px;top:calc(var(--floorY) + 34px);display:flex;gap:4px;z-index:11}
.pile{width:41px;height:34px;display:flex;align-items:center;justify-content:center;gap:3px;background:var(--iron);border-radius:2px;color:var(--ash);font:700 15px/1 var(--num)}
.pile b{color:var(--bone);font-weight:700}
#acts{position:absolute;right:10px;bottom:10px;display:flex;align-items:flex-end;gap:8px;z-index:11}
.act{display:grid;place-items:center;border-radius:50%;background:var(--iron);color:var(--bone);position:relative;box-shadow:inset 0 1px 0 rgba(255,240,220,.08)}
.act .ic{width:20px;height:20px}
.act b{position:absolute;right:-2px;top:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--frost);color:#0b1513;font:900 13px/17px var(--num);text-align:center}
#refBtn{width:58px;height:58px}
#waitBtn{width:42px;height:42px}
.act.sel{box-shadow:0 0 0 1.5px var(--frost),0 0 18px rgba(205,239,230,.4)}

<script>
(function(){

/* ================= 音: 鋼と蒸気。広い空洞に低く響く ================= */

  melee(heavy){

    const at = heavy ? .09 : .04;

  ranged(){ A.osc({type:'sawtooth', f:140, f2:2600, dur:.16, g:.09, lp:3000}); A.noise({at:.15, dur:.32, f:2400, f2:300, q:.7, g:.32, wet:.5}); A.osc({f:90, f2:30, at:.15, dur:.5, g:.6}); A.metal({f:310, at:.16, dur:1.4, g:.1, wet:.7}); },

    A.metal({f:880, dur:2, g:.22, wet:.9, damp:.4}); A.metal({f:1320, at:.02, dur:1.5, g:.13, wet:.9, damp:.4});
    A.noise({at:.03, dur:.8, type:'highpass', f:3800, g:.24, wet:.5, a:.02}); A.osc({f:130, f2:30, at:.02, dur:.55, g:.6}); },
  brk(){ A.noise({dur:.09, f:1800, q:.8, g:.36}); A.osc({type:'sawtooth', f:240, f2:60, dur:.42, g:.17, lp:1200, wet:.5}); A.metal({f:230, at:.03, dur:.8, g:.11, wet:.6}); },

  if(el.dataset.s != null){ const [k, , arg] = SFX_LIST[+el.dataset.s]; SFX[k](arg); }
  else if(el.dataset.seq){ const q = [[0, 'select'], [350, 'tick'], [500, 'tick'], [650, 'tick'], [800, 'melee', true], [1500, 'tick'], [1700, 'absorb'], [2100, 'charge'], [3300, 'tick'], [3420, 'tick'], [3540, 'tick'], [3660, 'tick'], [3780, 'just'], [5300, 'tick'], [5500, 'ranged'], [5900, 'kill']]; for(const [t, k, a] of q) setTimeout(() => SFX[k](a), t); }
  else if(el.id === 'bgmBtn'){ if(BGM.on) BGM.stop(); else BGM.start(); el.classList.toggle('on', BGM.on); } }});

/* ================= 画面の切り替え ================= */
const VIEWS = {battle:'#vBattle', map:'#vMap', reward:'#vReward', sound:'#vSound'};
function go(name){
  if(!VIEWS[name]) name = 'battle';
  for(const [k, s] of Object.entries(VIEWS)) $(s).hidden = k !== name;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  $('#ov').hidden = true; $('#zoom').hidden = true;
  if(name === 'map'){ mapPick = null; renderMap(); }
  if(name === 'reward'){ rwPick = null; renderReward(); countUp(); }
  if(name === 'sound') renderSound();
  if(name === 'battle' && st.over) restart();
  try{ if(location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name); }catch(e){}
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if(b){ au(); SFX.ui(); go(b.dataset.go); } });
$('#menuBtn').innerHTML = ic('menu');
$('#menuBtn').addEventListener('click', () => { $('#about').hidden = false; });
$('#about').innerHTML = `<div class="in"><h2>A<span>白熱</span></h2><h3>時間は距離、脅威は熱。</h3>
<p>K-7 と敵のあいだの空間が、そのままタイムラインです。敵の予定は熱の塊として線路を滑ってきて、近づくほど白く熱くなります。</p>
<p>カードは冷たい刃で、長さがコストです。刃の中に入った熱は発動の前に当たり、刃の先に重なれば JUST になります。</p>
<p>枠や窓は置かず、暗がりの中の光だけで読ませます。警戒が上がると、塔の底から街の熱が上がってきます。音は鋼と蒸気です。</p>
<p class="keys">操作: カードを押して選び、もう一度押すと使う(刃の先の丸でも可)。長押し・右クリックで拡大。敵のユニットを押して狙いを変える。熱の塊を押すと行動の中身。<br>キー: 1〜7 で選ぶ、Enter で使う、R リフレッシュ、W 待機、↑↓ 狙い、Esc 取り消し。</p>
<div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn" type="button">閉じる</button></div></div>`;
$('#about').addEventListener('click', e => { if(e.target.closest('.btn') || e.target.id === 'about') $('#about').hidden = true; });
addEventListener('hashchange', () => go(location.hash.slice(1)));
for(const t of ['touchend', 'click', 'keydown']) addEventListener(t, () => au(), {capture:true, passive:true}); // 最初の操作で音を使えるようにする
addEventListener('resize', layout);

$('#parts').innerHTML = partsHtml(); $('#units').innerHTML = unitsHtml(); $('#foeName').textContent = st.foe.name;
$('#refBtn').innerHTML = ic('refresh') + '<b>2</b>'; $('#waitBtn').innerHTML = ic('wait') + '<b>1</b>';
layout(); embers(); go(location.hash.slice(1) || 'battle'); setTimeout(speak, 900);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
