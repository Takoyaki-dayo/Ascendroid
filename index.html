function cardVal(k, st){

async function showEvent(ev, k, ti){

  switch(ev.type){
    case 'tick': if(!ev.real) afterimage(); else anim($('#nowLine'), [{transform: 'scaleX(2.6)', filter: 'brightness(1.8)'}, {transform: 'none', filter: 'none'}], {duration: 180, easing: EZ.out}); renderAll(); await sleep(ev.real ? T_TICK : T_SWIFT); break;
    case 'react': { const p = foeCenter(ev.e); floatAt(p.x, p.y - 70, '!', 'foe'); pulse(foeEl(ev.e), 'ehit', 200); renderAll(); await sleep(180); break; }

async function execute(pa){

  const s = sel, b = S.b, a = pa || selAction(); sel = null; PV = null; busy = true; EXEC_ID++; SKIP = false; QUEUED = null; UI.view = 'normal'; setPeek(false); hideMovePop();

  }

  const g = EN.spendGen(S, p.cost, p.k, p.t, false); let r;

}

/* ---------- 警戒 ---------- */
// 警戒(0.44.0): 相対値の5段(−2〜+2)。0 以外は上向き・下向きの折れ線(シェブロン)を重ねて見せる。色は熱い側が橙〜赤、冷たい側が青
const hLv = () => EN.heatLevel(S.run);
const hName = lv => DATA.ui['heat.' + lv] || '';
const hCls = lv => lv >= 2 ? 'h2' : lv === 1 ? 'h1' : lv === 0 ? 'h0' : lv === -1 ? 'hm1' : 'hm2';
// 折れ線の矢印を n 本重ねる(n>0 上向き / n<0 下向き / 0 は横線)。big は演出用の大きいもの
function chevSvg(n, big){
  const k = Math.abs(n), w = big ? 64 : 16, step = big ? 15 : 4.2, hh = big ? 18 : 5, sw = big ? 7 : 2.2;
  const H = k ? hh + step * (k - 1) + sw * 2 : sw * 4, y0 = sw + (n > 0 ? hh : 0);
  let p = '';
  if(!k) p = `<path d="M${sw} ${H / 2}H${w - sw}" />`;
  else for(let j = 0; j < k; j++){ const y = n > 0 ? y0 + step * j : sw + step * j, d = n > 0 ? -hh : hh; p += `<path class="cv" style="--j:${j}" d="M${sw} ${y}L${w / 2} ${y + d}L${w - sw} ${y}" />`; }
  return `<svg class="chev" viewBox="0 0 ${w} ${H}" width="${w}" height="${H}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}
function heatChip(){ const lv = hLv(); return `<span class="hchip ${hCls(lv)}" id="hchip"><span class="hc-ic">${chevSvg(lv)}</span><span class="hc-n"><i>${DATA.ui.heat}</i><b>${hName(lv)}</b></span></span>`; }
// 地図の区画の説明に出す「警戒の動き」: 足す量 − 冷める量の向きと大きさ
function heatHint(type){ const d = EN.heatDelta(type); if(Math.abs(d) < 0.05) return ''; const n = d >= 2 ? 2 : d > 0 ? 1 : d <= -2 ? -2 : -1; return `<span class="mi-al ${n > 0 ? 'up' : 'dn'}">${chevSvg(n)}</span>`; }
// 段が変わったときの演出: 画面の縁が熱い色・冷たい色に光り、大きな矢印が上(下)へ抜け、新しい段の名前が出る

// 学習: 候補は全カード(パーツ専用とノイズを除く)から。倒した敵の pool のカードだけ、ごくわずかに出やすい
// (同じアーキタイプを作るために同じ敵とばかり戦う、を避けるため。地図にも敵は出さない)
const LEARN_BIAS = 1.3;
// レア度(0.32.0): 報酬・ショップに出せるカード(初期のカード・パーツのカード・ノイズ・属性付きは除く)
const offerPool = () => Object.keys(CARDS).filter(k => !CARDS[k].junk && !CARDS[k].attr && !CARDS[k].upgraded && !CARDS[k].cut && !['charge','scatter'].includes(k) && !['starter', 'special'].includes(DATA.rarityOf(k)));
// レア度を1つ引く。kind は battle / elite / shop。報酬(battle・elite)は救済(rareOff)を使い、更新する
function rollRarity(kind){
  const R = DATA.rarityRule, w = Object.assign({}, R[kind] || R.battle), run = S.run, pity = kind === 'battle' || kind === 'elite';
  // 0.44.0: 警戒の段で、戦闘の報酬のレア度の重みを変える(low コモンが出やすい / high アンコモンが出やすい)
  if(pity){ const hr = EN.heatCards(run).r, m = hr && DATA.heat.rar[hr]; if(m) for(const r of ['common', 'uncommon', 'rare']) w[r] *= m[r] || 1; }
  if(pity){ if(run.rareOff == null) run.rareOff = R.pity.start; w.rare = Math.max(0, w.rare + run.rareOff); w.common = Math.max(0, w.common - Math.max(0, run.rareOff)); }
  let x = Math.random() * (w.common + w.uncommon + w.rare), r = 'common';
  if((x -= w.common) >= 0) r = (x -= w.uncommon) >= 0 ? 'rare' : 'uncommon';
  if(pity){ if(r === 'rare') run.rareOff = R.pity.start; else if(r === 'common') run.rareOff += R.pity.step; }
  return r;
}
// n 枚を選ぶ。1枚ごとにレア度を引き、そのレア度の中から(近い敵の学習の候補は少し出やすく)。そのレア度が尽きたら残りから
function rarityPick(n, kind, near){
  const all = offerPool(), out = [];
  for(let j = 0; j < n; j++){

  h = h.replace(/【(?:<b>)?([^【】<]+)(?:<\/b>)?】/g, (m, n) => { const k = fe && fe.uids.find(u => fe.units[u].name === n); return k ? tok(`<button type="button" class="ref u" data-act="foeMove" data-arg="u:${k}">【${n}】</button>`) : m; });

function startDebugBattle(enc){

  for(const p of SLOTS) run.parts[p.id] = {id: DBG.parts[p.id], damaged: false};

  // 敵の攻撃と耐久の倍率

    if(e.react) e.react = {...e.react, d: sc(e.react.d)};
  }

}

function hideOv2(){ $('#ov2').hidden = true; $('#ov').classList.remove('under'); }
function act(a, arg, el){
  switch(a){
    case 'close': hideOv(); break;
    case 'foeMove': if(UI.focus){ UI.focus.sel = arg; renderFocus(); } break;
    case 'ref': pushRef(arg); break;
    case 'pickOk': pickOk(); break;
    case 'refBack': popRef(); break;
    case 'refClose': popRef(true); break;
    case 'foeClose': closeFocus(); break;
    case 'menu': if(!busy) showMenu(); break;
    case 'rules': showRules(false); break;
    case 'deck': infoDeck(); break;
    case 'unit': infoUnit('parts'); break;
    case 'alert': infoAlert(); break;
    case 'unitTab': infoUnit(arg); break;
    case 'fs': goFull(); break;
    case 'debug': if(!DBG) dbgLoad(); UI.pick = DBG.enc; showDebug(); break;
    case 'dbgPick': UI.pick = UI.pick === arg ? null : arg; DBG.enc = UI.pick; dbgSave(); showDebug(); break;
    case 'dbgGo': if(UI.pick && (UI.pick !== 'dbg' || DBG.custom.some(Boolean))){ const k = UI.pick; UI.pick = null; startDebugBattle(k); } break;
    case 'dbgAgain': startDebugBattle(UI.dbgEnc); break;
    case 'dbgView': ({deck:showDebugDeck, parts:showDebugParts, nums:showDebugNums, custom:showDebugCustom})[arg](); break;
    case 'dbgBack': showDebug(); break;
    case 'dbgPreset': DBG.deck = DBG_PRESET[arg](); dbgSave(); showDebugDeck(); break;
    case 'dbgCard': { const [k, d] = arg.split(':'); if(+d > 0) DBG.deck.push(k); else { const i = DBG.deck.lastIndexOf(k); if(i >= 0) DBG.deck.splice(i, 1); } dbgSave(); showDebugDeck(); break; }
    case 'dbgPart': { const [sl, id] = arg.split(':'); DBG.parts[sl] = id; dbgSave(); showDebugParts(); break; }
    case 'dbgNum': { const [key, v] = arg.split(':'); DBG[key] = +v; dbgSave(); applyEcon(); showDebugNums(); break; }
    case 'dbgCls': DBG.cls = arg; dbgSave(); applyEcon(); showDebugNums(); break;
    case 'dbgWait': DBG.wait = arg === 'c' ? null : arg === '1'; dbgSave(); applyEcon(); showDebugNums(); break;
    case 'dbgSlot': { const [i, k] = arg.split(':'); DBG.custom[+i] = k || null; dbgSave(); showDebugCustom(); break; }
    case 'restart': UI.pick = null; UI.learnOpts = []; wipe(newRun); break;
    case 'title': UI.pick = null; UI.learnOpts = []; showTitle(); break;
    case 'continue': wipe(resumeRun); break;
    case 'reload': reloadApp(); break;
    case 'newGame': if(loadSave() && UI.titleConfirm !== true){ UI.titleConfirm = true; showTitle(); break; } UI.titleConfirm = false; clearSave(); wipe(newRun); break;
    case 'retry': S = {run: JSON.parse(snapshot), b: null}; hideOv(); startBattle(UI.node); break;
    case 'node': UI.mapSel = UI.mapSel === arg ? null : arg; showMap(); break;
    case 'go': { const n = findNode(UI.mapSel); if(UI.going || !EN.nextNodes(S.run).some(x => nodeKey(x) === UI.mapSel)) break;
      // 選んだ部屋が光ってから、地図が引いて部屋へ
      UI.going = true; const el = document.querySelector(`.mn[data-arg="${UI.mapSel}"]`); if(el) el.classList.add('go');
      /* 0.50.0: 今いる部屋から選んだ部屋へ印が走り、画面が切り替わって部屋へ */
      travel(UI.mapSel, () => wipe(() => { UI.going = false; enterRoom(n); })); break; }
    case 'afterWin': UI.pick = null; hideOv(); afterWin(); break;
    case 'pick': {
      UI.pick = UI.pick === arg ? null : arg;
      const v = el.dataset.view;
      ({learn:showLearn, rest:showRest, defrag:showDefrag, shop:showShop, event:showEventRoom, part:showPartOffer, attach:showAttach, up:showUpgrade})[v]();
      break;
    }
    case 'learn': if(UI.pick){ flyGain(document.querySelector('#ov .cards .card.picked'), inBattle() ? '#pileDraw' : '.mh-bar [data-v="deck"]'); S.run.deck.push(UI.pick); afterLearn(); } break;
    case 'skipLearn': afterLearn(); break;
    case 'takePart': if(UI.pick && UI.pick.startsWith('up:')){ const sl = UI.pick.slice(3); S.run.slotLv = Object.assign({}, S.run.slotLv, {[sl]: slotLv(sl) + 1}); UI.pick = null; completeRoom(); } else if(UI.pick) showSwap(); break;
    case 'swapBack': hideOv2(); break;
    case 'swapGo': if(UI.pick){ const d = PARTDEF[UI.pick]; S.run.parts[d.slot] = {id:UI.pick, damaged:false}; UI.pick = null; completeRoom(); } break;
    case 'skipPart': UI.pick = null; completeRoom(); break;
    case 'rest':
      if(UI.pick === 'heal'){ UI.pick = null; restHeal(); completeRoom(); }
      else if(UI.pick === 'upgrade'){ UI.pick = null; showUpgrade(); }
      else if(UI.pick === 'defrag'){ UI.pick = null; UI.back = 'rest'; showDefrag(); }
      break;
    case 'backAttach': UI.pick = null; hideOv(); showShop(); break;
    case 'attach': { const k = UI.pick, a = UI.attachA, run = S.run; if(!k || !a || run.scrap < DATA.attrRule.price) break; const i = run.deck.indexOf(k); if(i < 0) break; const key = k + '@' + a; DATA.regAttrCard(CARDS, key); run.deck[i] = key; run.scrap -= DATA.attrRule.price; UI.attrOffers[UI.attachI] = null; UI.pick = null; hideOv(); showShop(); break; }
    case 'backDefrag': UI.pick = null; if(UI.back === 'shop') showShop(); else if(UI.back === 'event') showEventRoom(); else { UI.pick = 'defrag'; showRest(); } break;
    case 'del': if(UI.pick){ dissolve(document.querySelector('.card.picked')); const i = S.run.deck.indexOf(UI.pick); if(i >= 0) S.run.deck.splice(i, 1); UI.pick = null; if(UI.back === 'shop'){ S.run.scrap -= DATA.shop.defrag; showShop(); } else completeRoom(); } break;
    case 'buy': {
      const pk = UI.pick, sh = DATA.shop, run = S.run; if(!pk) break;
      if(pk[0] === 'c'){ const i = +pk.slice(1), k = UI.offers[i]; if(!k || run.scrap < price(k)) break; flyGain(document.querySelector('.shop .card.picked'), '.mh-bar [data-v="deck"]'); run.scrap -= price(k); run.deck.push(k); UI.offers[i] = null; UI.pick = null; showShop(); }
      else if(pk === 'repair'){ if(run.scrap < sh.repairCost) break; run.scrap -= sh.repairCost; run.body = Math.min(run.bodyMax, run.body + sh.repairBody); for(const p of SLOTS) run.parts[p.id].damaged = false; UI.pick = null; showShop(); }
      else if(pk === 'defrag'){ if(run.scrap < sh.defrag) break; UI.pick = null; UI.back = 'shop'; showDefrag(); }
      else if(pk[0] === 'a'){ const i = +pk.slice(1), a = UI.attrOffers[i]; if(!a || run.scrap < DATA.attrRule.price) break; UI.attachA = a; UI.attachI = i; UI.pick = null; showAttach(); }
      break;
    }
    case 'leave': completeRoom(); break;
    case 'backUp': UI.pick = 'upgrade'; hideOv(); showRest(); break;
    case 'doUp': if(UI.pick){ const i = S.run.deck.indexOf(UI.pick), nk = DATA.upKey(UI.pick); if(i >= 0 && DATA.regAttrCard(CARDS, nk)) S.run.deck[i] = nk; UI.pick = null; completeRoom(); } break;
    case 'choose': { if(UI.pick == null) break; const ev = findEvent(UI.eventId); const fx = ev.choices[+UI.pick].fx; UI.pick = null; applyEvent(fx); break; }
    case 'done': completeRoom(); break;
  }
}

/* ---------- input ---------- */
const stage = $('#stage');
let lpTimer = null, longFired = false, swipe = null, swallow = false;
const inBattle = () => UI.screen === 'battle' && S && S.b;
stage.addEventListener('pointerdown', ev => {
  swipe = {x: ev.clientX, y: ev.clientY};
  // 0.34.0: 報酬・ショップ・イベントなどのカードも長押しで拡大(手札は下の処理)
  const oc = !ev.target.closest('#hand') && !ev.target.closest('#ref') && ev.target.closest('.card');
  const ock = oc && oc.querySelector('.ck');
  if(ock){ clearTimeout(lpTimer); lpTimer = setTimeout(() => { longFired = true; setTimeout(() => { longFired = false; }, 700); UI.refs = []; pushRef('card:' + ock.dataset.ck); }, 430); return; }
  if(!inBattle() || busy || !$('#ov').hidden || !$('#ref').hidden || UI.view === 'self' || UI.focus) return;
  const c = ev.target.closest('#hand .card[data-i]'), f = ev.target.closest('.foe[data-f],.eu[data-f],.ew[data-f],.upt[data-f]');
  if(!c && !f) return;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    longFired = true; setTimeout(() => { longFired = false; }, 700);
    if(c) infoCard(S.b.hand[+c.dataset.i].k); else infoFoe(+f.dataset.f, f.dataset.u && f.dataset.u !== '*' ? f.dataset.u : null);
  }, 430);
});
stage.addEventListener('pointermove', ev => {
  if(swipe && Math.hypot(ev.clientX - swipe.x, ev.clientY - swipe.y) > 10) clearTimeout(lpTimer);
});
stage.addEventListener('pointerup', ev => {
  clearTimeout(lpTimer);
  if(!swipe) return;
  const dy = ev.clientY - swipe.y, dx = ev.clientX - swipe.x, s = LAY.s || 1;
  swipe = null;
  if(inBattle() && $('#ov').hidden && $('#ref').hidden && !busy && !UI.focus && Math.abs(dy) > 34 * s && Math.abs(dy) > Math.abs(dx) * 1.3){
    let v = UI.view;
    if(dy < 0) v = v === 'self' ? 'normal' : v === 'normal' ? 'hand' : v;
    else v = v === 'hand' ? 'normal' : v === 'normal' ? 'self' : v;
    if(v !== UI.view){ UI.view = v; if(v === 'self'){ sel = null; PV = null; } renderAll(); }
    swallow = true; setTimeout(() => { swallow = false; }, 350);
  }
});
['pointercancel','pointerleave'].forEach(n => stage.addEventListener(n, () => { clearTimeout(lpTimer); }));
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('click', ev => {
  if(longFired){ longFired = false; return; }
  if(swallow){ swallow = false; return; }
  /* 0.50.0: 画面の切り替え中(印が走る・面が横切る)は押しても何もしない(二度押しで部屋を2回終えないように) */
  if(WIPING || UI.going) return;
  const t = ev.target, a = t.closest('[data-act]');
  if(a && !a.disabled){ act(a.dataset.act, a.dataset.arg, a); return; }
  if(!$('#ref').hidden){ if(t === $('#ref')) popRef(); return; }
  if(!$('#ov2').hidden){ if(t === $('#ov2')) hideOv2(); return; }
  const ov = $('#ov');
  if(!ov.hidden){ if(t === ov && ov.dataset.closable) hideOv(); return; }
  if(UI.focus){ if(!t.closest('#focus')) closeFocus(); return; }
  // 地図: 部屋を選んだあと、何もないところを押すと選ぶ前に戻る
  if(!$('#mapScr').hidden && UI.mapSel && !t.closest('.minfo,.mh-bar')){ UI.mapSel = null; showMap(); return; }
  /* 0.50.0: 演出中に手札・入れ替え・待機を押したら、演出を打ち切って、終わったらその入力を受け付ける */
  if(busy && inBattle() && UI.view !== 'self'){
    const qc = t.closest('#hand .card[data-i]'), qid = qc ? [...cardEls].find(([, el]) => el === qc) : null;
    const q = qid ? {kind: 'card', id: qid[0]} : t.closest('#redraw') ? {kind: 'redraw'} : t.closest('#waitBtn') ? {kind: 'wait'} : null;
    if(q){ QUEUED = q; skipNow(); }
    return;
  }
  if(!inBattle() || busy || UI.view === 'self') return;
  // タイムラインを押すと透かす(何も選んでいないとき)。透かしている間は、ほかを押すと戻る
  const mk = t.closest('.mk[data-mk]'); if(mk){ if(UI.mvKey === mk.dataset.mk) hideMovePop(); else showMovePop(mk.dataset.mk, mk); return; }
  const bd = t.closest('[data-bk]'); if(bd){ if(UI.mvKey === bd.dataset.bk) hideMovePop(); else showMovePop(bd.dataset.bk, bd); return; }
  if(t.closest('#mvpop')) return;
  if(!$('#mvpop').hidden && !t.closest('#hand .card,#redraw,#waitBtn')){ hideMovePop(); if(t.closest('#screen')) return; }
  const lhd = t.closest('.lh[data-f]'); if(lhd && !sel && !peeking()){ infoFoe(+lhd.dataset.f); return; }
  if(t.closest('#screen') && !sel){ setPeek(!peeking()); return; }
  if(peeking()){ setPeek(false); if(!t.closest('#hand .card,#redraw,#waitBtn')) return; }
  if(t.closest('#pvGo')){ if(sel) execute(); return; }
  const card = t.closest('#hand .card[data-i]'); if(card){ onCard(+card.dataset.i); return; }
  if(t.closest('#redraw')){ onRedraw(); return; }
  if(t.closest('#waitBtn')){ onWait(); return; }
  const f = t.closest('[data-f]'); if(f){ onFoe(+f.dataset.f, f.dataset.u); return; }
  const p = t.closest('#parts .part'); if(p){ infoPart(p.dataset.p); return; }
  if(t.closest('.pile')){ infoDeck(); return; }
  if(sel){ sel = null; PV = null; renderAll(); }
});

function fit(){
  layout(); buildStatic();
  if(S && S.b && UI.screen === 'battle'){ clearMarks(); buildFoes(); renderAll(); }
}
addEventListener('resize', fit);
// ボタンにフォーカスが移ったときなどに、画面がずれないようにする
for(const el of [$('#wrap'), stage]) el.addEventListener('scroll', () => { el.scrollTop = 0; el.scrollLeft = 0; });
fit();
/* 0.46.0: 敵の列の軌条に、次の攻撃までの区間を刻む */
{  const dm = document.createElement('div'); dm.id = 'dim'; dm.className = 'np'; $('#world').insertBefore(dm, $('#fx'));
  const th = document.createElement('div'); th.id = 'threat'; th.className = 'np'; $('#tl').insertBefore(th, $('#marks')); }
dbgLoad(); applyEcon();
showTitle();
</script>
<script>
// オフライン用のサービスワーカー登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
