<title>Ascendroid カード工房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* ゲームのデータ台帳: 上に種類のタブ、左に一覧、右に選んだ項目の編集と依頼。色はゲームと同じ(シアン=自分の操作、赤=未対応、紫=相談中) */
:root{
  --bg:#f2f5f8; --panel:#ffffff; --raised:#eaf0f5; --line:#d3dde6; --fg:#0d1620; --fg2:#3b4f61; --dim:#6a7d8e;
  --cy:#0a86ad; --cy-soft:rgba(10,134,173,.1); --foe:#d0284a; --foe-soft:rgba(208,40,74,.1); --just:#6a45d4; --just-soft:rgba(106,69,212,.1); --ok:#1d8a57; --ok-soft:rgba(29,138,87,.1);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Chakra Petch","BIZ UDPGothic",ui-monospace,monospace;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f15; --panel:#0f1720; --raised:#141f2b; --line:#1f2e3d; --fg:#e6eef5; --fg2:#a9bccb; --dim:#6f8396;
  --cy:#38d3ff; --cy-soft:rgba(56,211,255,.1); --foe:#ff6b84; --foe-soft:rgba(255,77,106,.12); --just:#b99bff; --just-soft:rgba(177,140,255,.13); --ok:#5fd39a; --ok-soft:rgba(95,211,154,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f15; --panel:#0f1720; --raised:#141f2b; --line:#1f2e3d; --fg:#e6eef5; --fg2:#a9bccb; --dim:#6f8396;
  --cy:#38d3ff; --cy-soft:rgba(56,211,255,.1); --foe:#ff6b84; --foe-soft:rgba(255,77,106,.12); --just:#b99bff; --just-soft:rgba(177,140,255,.13); --ok:#5fd39a; --ok-soft:rgba(95,211,154,.12); color-scheme:dark}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
main.wide{grid-template-columns:minmax(0,1fr)}
main.wide .side{display:none}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.5;margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:1400px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;letter-spacing:.04em;font-weight:700}
.ver{font-family:var(--f-num);font-size:12px;color:var(--dim)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--fg2);font-weight:700;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:var(--raised)}
.tab.on{background:var(--cy-soft);color:var(--cy)}
.tab .n{font-family:var(--f-num);font-size:11px;color:var(--foe);font-weight:700}
.tab .n.rp{color:#fff;background:var(--just);border-radius:9px;padding:0 6px;line-height:16px}
.badge.rp{background:var(--just);color:#fff;margin-left:4px}
tr.row.hl td:first-child{box-shadow:inset 3px 0 0 var(--just)} tr.row.hl td{background:var(--just-soft)}
.req.hl{border-color:var(--just);box-shadow:0 0 0 1px var(--just) inset}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,460px);gap:16px;padding-block:12px}
.listwrap{min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.tools{display:flex;gap:8px;align-items:center}
.tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px}
.btn{border:1px solid var(--cy);background:var(--cy);color:var(--bg);font-weight:700;border-radius:6px;padding:6px 14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--cy)}
.btn.quiet{border-color:var(--line);background:var(--panel);color:var(--fg2)}
.btn:disabled{opacity:.4;cursor:default}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:0;flex:1}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--raised);text-align:left;font-size:11px;color:var(--dim);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--raised)}
tr.row.sel td{background:var(--cy-soft)}
td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.nm{font-weight:700;white-space:nowrap}
td.tx{color:var(--fg2);min-width:180px}
td .k{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);font-weight:400}
.badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-num);font-size:11px;font-weight:700;border-radius:9px;padding:0 7px;line-height:18px}
.badge.open{background:var(--foe-soft);color:var(--foe)} .badge.discuss{background:var(--just-soft);color:var(--just)} .badge.done{background:var(--ok-soft);color:var(--ok)} .badge.dropped{background:var(--raised);color:var(--dim)}
.badge.new{background:var(--cy-soft);color:var(--cy)}
/* 右: 編集 */
.side{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.side-h h2{font-size:15px;margin:0;line-height:1.3}
.side-h .k{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.side-h .x{margin-left:auto}
.side-b{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.empty{color:var(--dim);padding:24px 14px;line-height:1.7}
.preview{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--raised);color:var(--fg2)}
.preview b{color:var(--fg)}
.mode{display:flex;gap:4px}
.mode button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 10px;font-size:12px;color:var(--fg2)}
.mode button.on{border-color:var(--cy);color:var(--cy);background:var(--cy-soft)}
.grp{display:flex;flex-direction:column;gap:5px}
.grp h3{margin:4px 0 0;font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:.03em}
/* 折りたためる欄の組(0.29.0)。カードが使っている組は開き、使っていない組は見出しだけ */
details.grp{gap:0;border-top:1px solid var(--line);padding-top:2px}
details.grp > summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:6px 0;font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:.03em;touch-action:manipulation}
details.grp > summary::-webkit-details-marker{display:none}
details.grp > summary::before{content:'▸';display:inline-block;width:10px;transition:transform .15s}
details.grp[open] > summary::before{transform:rotate(90deg)}
details.grp > summary .gs{font-weight:400;color:var(--fg);opacity:.8;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
details.grp > summary .gs.off{opacity:.45}
details.grp[open]{gap:5px;padding-bottom:6px}
.fld{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px;align-items:center}
.fld label{font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld label i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--dim);margin-left:4px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 7px}
.fld input[type=number]{font-family:var(--f-num);font-weight:600}
.fld textarea{resize:vertical;min-height:52px;line-height:1.5}
.fld.chg input,.fld.chg select,.fld.chg textarea{border-color:var(--cy);background:var(--cy-soft)}
.fld.chg label{color:var(--cy);font-weight:700}
.json{width:100%;min-height:320px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px;resize:vertical}
.err{color:var(--foe);font-size:12px}
.newkey{display:flex;gap:8px;align-items:center}
.newkey input{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--panel);font-family:var(--f-mono)}
/* 送る */
.send{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel);border-radius:0 0 10px 10px}
.bi .one{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bis{display:flex;flex-direction:column;gap:8px}
.bi{display:flex;flex-direction:column;gap:3px;padding:6px 0;border-bottom:1px solid var(--line)} .bi>b,.bi>a b{font-size:13px} .bi .badge{align-self:flex-start}
.diff{display:flex;flex-direction:column;gap:3px;max-height:140px;overflow:auto}
.dl{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:8px;font-size:12px}
.dl .p{font-family:var(--f-mono);font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .v s{color:var(--dim)} .dl .v b{color:var(--cy)}
.send textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);resize:vertical}
.send .row{display:flex;gap:8px;align-items:center}
.send .row .sp{flex:1;min-width:0;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.send .row.btns{flex-wrap:wrap;justify-content:flex-end} .send .row.btns .btn{flex:none}
/* 依頼 */
.reqs{display:flex;flex-direction:column;gap:10px}
.req{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.req.open{border-left:3px solid var(--foe)} .req.discuss{border-left:3px solid var(--just)} .req.done{border-left:3px solid var(--ok)} .req.dropped{opacity:.6}
.req-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req-h .t{font-weight:700}
.req-h .d{font-family:var(--f-num);font-size:11.5px;color:var(--dim);margin-left:auto}
.req-h a{color:var(--cy);cursor:pointer;text-decoration:none;font-weight:700}
.req .cm{white-space:pre-wrap}
.msg{border-radius:6px;padding:6px 9px;white-space:pre-wrap;font-size:12.5px}
.msg.user{background:var(--raised)}
.msg.claude{background:var(--just-soft)}
.msg .w{display:block;font-size:10.5px;color:var(--dim);font-weight:700}
.reply{display:flex;gap:6px}
.reply input{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--panel)}
.filters{display:flex;gap:4px}
.reqpane{flex:1;overflow:auto;min-height:0}
.note{color:var(--dim);font-size:12px}
.tapdot{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid var(--cy);border-radius:50%;pointer-events:none;z-index:60;animation:tapdot .45s ease-out forwards}
@keyframes tapdot{from{opacity:.9;transform:scale(.5)}to{opacity:0;transform:scale(1.3)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:6px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* カード工房 */
.btn.sm{padding:2px 9px;font-size:12px}
.wbbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.wbbar .sp{flex:1}
.wbbar b.up,.ef.up{color:var(--cy)} .wbbar b.dn,.ef.dn{color:var(--foe)}
.wbt th{top:41px}
tr.row.cut td{opacity:.45} tr.row.cut td.nm{text-decoration:line-through}
.rar{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;white-space:nowrap;background:var(--raised);color:var(--dim)}
.rar.r-starter{color:var(--fg2)} .rar.r-common{color:var(--fg);background:var(--raised)} .rar.r-uncommon{color:var(--cy);background:var(--cy-soft)} .rar.r-rare{color:#b8860b;background:rgba(218,165,32,.14)} .rar.r-special{color:var(--just);background:var(--just-soft)}
.effc{white-space:nowrap}
.ef{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--f-num);font-weight:700;margin-right:8px}
.ef i{font-style:normal;font-family:var(--f-body);font-size:10px;color:var(--dim)} .ef em{font-style:normal;font-family:var(--f-body);font-size:10px;color:var(--dim);margin-left:2px}
.wbt .badge{white-space:nowrap}
.badge.w-draft{background:var(--raised);color:var(--fg2)} .badge.w-review{background:var(--foe-soft);color:var(--foe)} .badge.w-reviewed{background:var(--just-soft);color:var(--just)}
.badge.w-ok{background:var(--ok-soft);color:var(--ok)} .badge.w-merged{background:var(--cy-soft);color:var(--cy)} .badge.w-cut{background:var(--raised);color:var(--dim)}
.cardpv{border:1px solid var(--line);border-radius:8px;background:var(--raised);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cf{display:flex;align-items:center;gap:8px} .cf b{font-size:14px}
.cc{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--cy);color:var(--cy);font-family:var(--f-num);font-weight:700}
.ct{font-size:11px;color:var(--dim)} .cf .rar{margin-left:auto}
.cft{color:var(--fg2)} .cft b{color:var(--fg)}
.chks{display:flex;gap:12px;flex-wrap:wrap;font-size:12px} .chks label{display:inline-flex;gap:4px;align-items:center}
.wtext{width:100%;min-height:60px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);resize:vertical;line-height:1.5}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto 2em auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.drow.on .dn{font-weight:700} .drow .dn i{font-style:normal;font-family:var(--f-num);font-size:11px;color:var(--dim);margin-left:6px} .drow b{text-align:center;font-family:var(--f-num)}
.play{position:fixed;inset:0;z-index:40;background:#05090e;display:flex;flex-direction:column;padding:max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.play-h{display:flex;align-items:center;gap:10px;color:#e6eef5;padding-bottom:8px} .play-h .sp{flex:1} .play-h .note{color:#8a9fb2}
.play-f{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.play-f iframe{width:100%;height:100%;max-width:calc((100vh - 60px) * 844 / 390);border:1px solid #1f2e3d;border-radius:8px;background:#0a0f15}
@media (pointer:coarse){
  .btn{min-height:34px} .btn.sm{min-height:32px;min-width:38px;font-size:14px}
  .drow{padding:6px 0}
}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  /* 右の欄は重ねず(position:fixed を使わない)、一覧と見出しを隠して同じ場所に出す。
     iframe の中の固定配置は、キーボードの出し入れのあとに押した位置と反応する位置がずれることがある */
  .app.sideopen header,.app.sideopen .listwrap{display:none}
  .app.sideopen main{padding-block:0}
  body.sideopen{padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
  .side{border-radius:0;border-inline:0;padding-bottom:env(safe-area-inset-bottom, 0px)}
  .side[hidden]{display:none}
  .send{border-radius:0}
  .tabs{margin-left:0}
  .tools{flex-wrap:wrap} .tools input{flex:1 1 100%}
  .wbt th:nth-child(4),.wbt td:nth-child(4){display:none}
}
@media (min-width:821px){ .side-h .x{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>Ascendroid カード工房</h1>
    <span class="ver" id="ver"></span>
    <button class="btn ghost sm" id="bulkBtn" type="button" disabled>まとめて添削に出す</button>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main>
    <section class="listwrap" id="listwrap">
      <div class="tools"><input id="q" type="search" placeholder="名前・キーで絞り込む" aria-label="絞り込み"><button class="btn ghost" id="addBtn" type="button">＋ 追加</button><button class="btn quiet" id="deckBtn" type="button" hidden>最初のデッキ</button><button class="btn" id="playBtn" type="button" hidden>試遊</button></div>
      <div class="tbl" id="tbl"></div>
    </section>
    <aside class="side" id="side"></aside>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="play" id="play" hidden><div class="play-h"><b>試遊</b><span class="note" id="playInfo"></span><span class="sp"></span><button class="btn quiet" type="button" id="playReload">読み直す</button><button class="btn" type="button" id="playClose">閉じる</button></div><div class="play-f"><iframe id="playFrame" title="試遊版" allow="fullscreen"></iframe></div></div>

<script src="data/parts.js"></script>
<script src="data/cards.js"></script>
<script src="data/enemies.js"></script>
<script src="data/map.js"></script>
<script src="data/classes.js"></script>
<script src="data/attrs.js"></script>
<script src="data/text.js"></script>
<script src="meta.js"></script>
<script>
'use strict';
// データ台帳: ゲームの data/*.js をそのまま読み、一覧にする。編集は依頼(requests)として共有データベースに送り、Claude がリポジトリに反映する
const D = window.DATA, META = window.SHEET_META || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const K7 = D.classes[D.defaultClass];
const SLOT = Object.fromEntries(D.slots.map(s => [s.id, s.fn]));
const TNAME = {melee:'近接', ranged:'遠隔'};
// 通常戦は、どのエリアのどの警戒度の組に入っているか(0.23.0 から data/map.js の areas の pools)
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const ENCNAME = (e, k) => e.boss ? 'ボス' : e.elite ? 'エリート' : '通常 ' + (D.areas.map((A, i) => { const ps = (A.pools || []).filter(p => p.enc.includes(k)); return ps.length ? `エリア${i + 1} ${ps.map(p => ROMAN[p.at - 1] + '〜').join('・')}` : ''; }).filter(Boolean).join(' / ') || '出ない');

/* ---------- 項目の種類 ---------- */
// カードは data/cards.js の値に、K-7 の数値(data/classes.js)を k7 として添える
function cardView(k, c){ const o = clone(c); const ov = K7.cards[k]; if(ov) o.k7 = clone(ov); return o; }
function cardText(c){
  const k = c.k7 || {}, v = {dmg: k.dmg ?? (c.dmg && c.dmg.n), x: c.dmg && c.dmg.x, block: k.block ?? c.block, delay: c.delay, crack: c.crack, draw: c.draw, t: c.timer && c.timer.t,
    tdmg: k.timer ?? (c.timer && c.timer.dmg.n), gain: c.gain, per: k.per ?? (c.spend && (c.spend.dmg ? c.spend.dmg.n : c.spend.block))};
  return esc(c.text || '').replace(/\{(\w+)\}/g, (m, n) => v[n] != null ? `<b>${esc(v[n])}</b>` : m);

//   カード → 保存して添削待ち / カード以外の変更 → 項目ごとの依頼 / 全体への相談 → 項目によらない依頼
async function bulkSend(){
  if(!DB) return;
  const cs = bulkCards(), es = bulkEdits().filter(e => !(e.draft.isNew && !e.draft.key.trim())), text = (S.bulkText || '').trim();
  if(!cs.length && !es.length && !text) return;
  const btn = $('#bulkSend'); if(btn) btn.disabled = true;
  const now = new Date().toISOString();
  let ok = 0, ng = 0;
  for(const c of cs){
    try{
      if(c.w){ await DB.doc('cards/' + c.key).set(wbDoc(c.w, 'review')); c.w.dirty = false; delete WBDRAFT[c.key]; }
      else await DB.doc('cards/' + c.key).update({status:'review', at:now});
      ok++;
    }catch(e){ ng++; }
  }
  for(const e of es){
    try{
      await DB.collection('requests').add(reqDoc(e.kind, e.draft, e.comment));
      delete EDRAFT[e.kind + '|' + (e.draft.isNew ? '+' : e.draft.key)];
      if(e.cur || (S.kind === e.kind && S.draft === e.draft)){ S.comment = ''; if(e.draft.isNew){ S.draft = null; S.sel = null; } else { const it = curItem(); if(it) startDraft(it); } }
      ok++;
    }catch(err){ ng++; }
  }
  if(text){ try{ await DB.collection('requests').add({at:now, kind:'general', key:'', label:'', type:'note', changes:[], comment:text, status:'open', thread:[]}); S.bulkText = ''; ok++; }catch(e){ ng++; } }
  if(!ng){ S.bulkOpen = false; S.mobileOpen = false; }
  toast(ng ? `${ok}件を送りました(${ng}件は送れませんでした)` : `${ok}件を送りました`);
  renderAll();
}

// 入力: 'full' なら右の欄を描き直す
function abInput(id, el){
  const w = S.ab, a = w.attr, f = a.fx = a.fx || {}, num = () => el.value === '' ? 0 : Math.max(0, Math.round(Number(el.value)));
  if(id === 'a_name'){ a.name = el.value; return 'part'; }
  if(id === 'a_on'){ a.on = el.value; if(a.on !== 'hit') delete f.again; return 'full'; }
  if(id === 'a_again'){ if(el.checked) f.again = true; else delete f.again; return 'full'; }
  if(id === 'a_text'){ a.text = el.value; return 'part'; }
  if(id === 'a_idea'){ w.idea = el.value; return 'part'; }
  if(id.startsWith('t:')){ const k = id.slice(2); w.test = w.test.filter(x => x !== k); if(el.checked) w.test.push(k); return 'part'; }
  const k = id.slice(2); if(AFX.some(x => x[0] === k)){ const v = num(); if(v) f[k] = v; else delete f[k]; return 'full'; }
  return 'part';
}

function fieldHTML(p, v, orig){
  const last = p.split('.').pop(), chg = JSON.stringify(v) !== JSON.stringify(getPath(orig, p)), id = 'f-' + p.replace(/[^\w]/g, '_');
  let input;
  if(typeof v === 'boolean') input = `<input id="${id}" type="checkbox" data-path="${esc(p)}" data-t="bool"${v ? ' checked' : ''}>`;
  else if(typeof v === 'number') input = `<input id="${id}" type="number" step="any" data-path="${esc(p)}" data-t="num" value="${v}">`;
  else if(last === 'p' && typeof v === 'string' && SLOT[v]) input = `<select id="${id}" data-path="${esc(p)}" data-t="str">${Object.entries(SLOT).map(([k, n]) => `<option value="${k}"${k === v ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
  else if(last === 't' && (v === 'melee' || v === 'ranged')) input = `<select id="${id}" data-path="${esc(p)}" data-t="str">${Object.entries(TNAME).map(([k, n]) => `<option value="${k}"${k === v ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
  else if(typeof v === 'string') input = v.length > 22 ? `<textarea id="${id}" data-path="${esc(p)}" data-t="str">${esc(v)}</textarea>` : `<input id="${id}" type="text" data-path="${esc(p)}" data-t="str" value="${esc(v)}">`;
  else if(last === 'lines' && isPrimArr(v)) input = `<textarea id="${id}" data-path="${esc(p)}" data-t="lines" rows="${Math.max(2, v.length + 1)}" placeholder="1行に1つ">${esc(v.join('\n'))}</textarea>`;
  else if(isPrimArr(v)) input = `<input id="${id}" type="text" data-path="${esc(p)}" data-t="arr" value="${esc(v.join(', '))}">`;
  else input = `<input id="${id}" type="text" data-path="${esc(p)}" data-t="json" value="${esc(JSON.stringify(v))}">`;
  if(last === 'vars') return v ? `<div class="note">差し込み: ${esc(v)}</div>` : '';
  const lab = last === 'n' ? (typeof v === 'number' ? '値' : '名前') : p.startsWith('say.') ? SAYW(last, orig) : segLabel(last);
  return `<div class="fld${chg ? ' chg' : ''}"><label for="${id}" title="${esc(p)}">${esc(lab)}<i>${esc(last)}</i></label>${input}</div>`;
}

const EDRAFT = {};
function eDirty(kind, d, comment){
  if(!d) return false;
  if(d.isNew) return !!(d.key && d.key.trim());
  const it = KBY[kind].items().find(x => x.key === d.key);
  return !!it && (diff(it.obj, d.obj).length > 0 || !!(comment || '').trim());
}
function eStash(){
  if(!S.draft || !KBY[S.kind] || KBY[S.kind].wb || S.kind === 'requests') return;
  const id = S.kind + '|' + (S.draft.isNew ? '+' : S.draft.key);
  if(eDirty(S.kind, S.draft, S.comment)) EDRAFT[id] = {kind:S.kind, draft:S.draft, comment:S.comment, json:S.json, jsonText:S.jsonText};
  else delete EDRAFT[id];
}
const eUnsent = (kind, key) => !!EDRAFT[kind + '|' + key] || (S.kind === kind && S.draft && !S.draft.isNew && S.draft.key === key && eDirty(kind, S.draft, S.comment));
// 依頼の文書(カード以外の1項目ぶん)
function reqDoc(kind, d, comment){
  const now = new Date().toISOString();
  if(d.isNew){ const key = d.key.trim(); return {at:now, kind, key, label:(d.obj && (d.obj.name || d.obj.title)) || key, type:'new', obj:d.obj, changes:[], comment:(comment || '').trim(), status:'open', thread:[]}; }
  const it = KBY[kind].items().find(x => x.key === d.key), ch = diff(it.obj, d.obj);
  return {at:now, kind, key:it.key, label:it.name || it.key, type:ch.length ? 'edit' : 'note', changes:ch, comment:(comment || '').trim(), status:'open', thread:[]};
}
function startDraft(it){ S.draft = {isNew:false, key:it.key, obj:clone(it.obj)}; S.json = false; S.jsonErr = ''; S.comment = ''; }
function selectItem(key){
  S.bulkOpen = false;
  if(KBY[S.kind] && KBY[S.kind].ab){ if(!(S.ab && S.ab.key === key)) abOpen(key); S.sel = key; S.mobileOpen = true; renderAll(); return; }
  if(KBY[S.kind] && KBY[S.kind].wb){ if(!(S.wb && S.wb.key === key)) wbOpen(key); S.sel = key; S.wbDeckOpen = false; S.revertArm = null; S.mobileOpen = true; renderAll(); return; }
  const it = curItems().find(x => x.key === key); if(!it) return;
  if(S.draft && !S.draft.isNew && S.draft.key === key){ S.mobileOpen = true; renderAll(); return; }
  eStash();
  S.sel = key; const st = EDRAFT[S.kind + '|' + key];
  if(st){ S.draft = st.draft; S.comment = st.comment; S.json = st.json; S.jsonText = st.jsonText; S.jsonErr = ''; delete EDRAFT[S.kind + '|' + key]; } else startDraft(it);
  S.mobileOpen = true; renderAll();
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
async function send(){
  if(!DB) return;
  const it = curItem();
  if(S.draft.isNew && !S.draft.key.trim()) return;
  const doc = reqDoc(S.kind, S.draft, S.comment);
  delete EDRAFT[S.kind + '|' + (S.draft.isNew ? '+' : S.draft.key)];
  const btn = $('#sendBtn'); if(btn) btn.disabled = true;
  try{ await DB.collection('requests').add(doc); S.comment = ''; if(S.draft.isNew){ S.draft = null; S.sel = null; } else startDraft(it); toast('送りました'); }
  catch(e){ toast(e && e.code === 'quota_exceeded' ? '保存できる件数の上限です' : '送れませんでした。もう一度試してください'); }
  renderAll();
}
async function sendGeneral(){
  const t = ($('#generalText').value || '').trim(); if(!t || !DB) return;
  try{ await DB.collection('requests').add({at:new Date().toISOString(), kind:'general', key:'', label:'', type:'note', changes:[], comment:t, status:'open', thread:[]}); toast('送りました'); }
  catch(e){ toast('送れませんでした。もう一度試してください'); }
  renderAll();
}
// 「その案で」: Claude の案で進めてよい、と返して対応待ちに戻す
async function agree(id){
  const r = REQ.find(x => x.id === id); if(!r || !DB) return;
  try{ await DB.doc('requests/' + id).update({thread:[...(r.thread || []), {who:'user', text:'その案で', at:new Date().toISOString()}], status:'open'}); toast('返しました'); }catch(e){ toast('送れませんでした'); }
}
async function reply(id){
  const r = REQ.find(x => x.id === id), inp = document.querySelector(`[data-reply="${CSS.escape(id)}"]`); if(!r || !inp || !DB) return;
  const t = inp.value.trim(); if(!t) return;
  try{ await DB.doc('requests/' + id).update({thread:[...(r.thread || []), {who:'user', text:t, at:new Date().toISOString()}], status:'open'}); toast('返信しました'); }
  catch(e){ toast('送れませんでした'); }
}
async function drop(id){
  if(!DB) return;
  try{ await DB.doc('requests/' + id).update({status:'dropped'}); toast('取り下げました'); } catch(e){ toast('変更できませんでした'); }
}

/* ---------- 入力 ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('[data-tab]'); if(tab){ S.bulkOpen = false; wbStash(); eStash(); if(S.ab && S.ab.dirty) ABDRAFT[S.ab.key] = S.ab; S.ab = null; S.kind = tab.dataset.tab; S.sel = null; S.draft = null; S.wb = null; S.wbDeckOpen = false; S.mobileOpen = false; S.q = ''; $('#q').value = ''; renderAll(); return; }
  // カード工房
  const wf = t.closest('[data-wbf]'); if(wf){ S.wbFilter = wf.dataset.wbf; renderList(); return; }
  const wt = t.closest('[data-wbtext]'); if(wt && S.wb){ S.wb.custom = wt.dataset.wbtext === 'custom'; if(S.wb.custom && !S.wb.card.text) S.wb.card.text = genText(S.wb.card); S.wb.dirty = true; renderSide(); return; }
  const dk = t.closest('[data-dk]'); if(dk){ const d = S.wbDeckDraft || wbDeck().slice(), k = dk.dataset.dk.slice(1); if(dk.dataset.dk[0] === '+') d.push(k); else { const i = d.lastIndexOf(k); if(i >= 0) d.splice(i, 1); } S.wbDeckDraft = d; renderSide(); return; }
  if(t.closest('#wbSave')){ wbSave(); return; }
  if(t.closest('#wbReview')){ wbSave('review'); return; }
  if(t.closest('#wbOk')){ wbSave('ok'); return; }
  if(t.closest('#wbCut')){ wbStatus(WB[S.wb.key].status === 'cut' ? 'draft' : 'cut'); return; }
  if(t.closest('#wbRevert')){ wbRevert(); return; }
  if(t.closest('#wbReply')){ wbReply(); return; }
  if(t.closest('#bulkBtn')){ S.bulkOpen = !S.bulkOpen; S.mobileOpen = S.bulkOpen || !!S.sel; renderAll(); return; }
  if(t.closest('#bulkSend')){ bulkSend(); return; }
  if(t.closest('#deckBtn')){ S.bulkOpen = false; wbStash(); S.wbDeckOpen = true; S.wbDeckDraft = null; S.sel = null; S.wb = null; S.mobileOpen = true; renderAll(); return; }
  if(t.closest('#deckSave')){ (async () => { try{ await DB.doc('config/deck').set({startDeck:S.wbDeckDraft, at:new Date().toISOString()}); S.wbDeckDraft = null; toast('保存しました'); renderAll(); }catch(e){ toast('保存できませんでした'); } })(); return; }
  if(t.closest('#deckReset')){ S.wbDeckDraft = D.startDeck.slice(); renderSide(); return; }
  if(t.closest('#playBtn')){ openPlay(); return; }
  if(t.closest('#playReload')){ openPlay(); return; }
  if(t.closest('#playClose')){ $('#play').hidden = true; $('#playFrame').src = 'about:blank'; return; }
  const row = t.closest('tr.row'); if(row){ selectItem(row.dataset.key); return; }
  const md = t.closest('[data-mode]'); if(md){ setMode(md.dataset.mode === 'json'); return; }
  const rf = t.closest('[data-rf]'); if(rf){ S.reqFilter = rf.dataset.rf; renderList(); return; }
  const go = t.closest('[data-goto]'); if(go){ const [k, key] = go.dataset.goto.split('|'); if(KBY[k]){ eStash(); S.kind = k; S.draft = null; renderAll(); if(key) selectItem(key); } return; }
  const sr = t.closest('[data-send-reply]'); if(sr){ reply(sr.dataset.sendReply); return; }
  const ag = t.closest('[data-agree]'); if(ag){ agree(ag.dataset.agree); return; }
  const dr = t.closest('[data-drop]'); if(dr){ drop(dr.dataset.drop); return; }
  if(t.closest('#sendBtn')){ send(); return; }
  if(t.closest('#sendGeneral')){ sendGeneral(); return; }
  if(t.closest('#resetDraft')){ const it = curItem(); if(it){ startDraft(it); renderSide(); } return; }
  if(t.closest('#closeSide')){ if(S.bulkOpen){ S.bulkOpen = false; renderAll(); return; } S.mobileOpen = false; S.wbDeckOpen = false; renderSide(); if(KBY[S.kind] && KBY[S.kind].wb) renderList(); return; }
  if(t.closest('#addBtn') && KBY[S.kind] && KBY[S.kind].ab){ S.bulkOpen = false; if(S.ab && S.ab.dirty) ABDRAFT[S.ab.key] = S.ab; const k = 'a' + Date.now().toString(36); S.sel = k; abStart(k); S.mobileOpen = true; renderAll(); setTimeout(() => { const n = $('#a_name'); if(n) n.focus(); }, 50); return; }
  if(t.closest('#abSave')){ abSave(); return; }
  if(t.closest('#abReview')){ abSave('review'); return; }
  if(t.closest('#abOk')){ abSave('ok'); return; }
  if(t.closest('#abCut')){ abStatus(AB[S.ab.key].status === 'cut' ? 'draft' : 'cut'); return; }
  if(t.closest('#abReply')){ abReply(); return; }
  const at = t.closest('[data-abtext]'); if(at && S.ab){ S.ab.custom = at.dataset.abtext === 'custom'; if(S.ab.custom && !S.ab.attr.text) S.ab.attr.text = abText(S.ab.attr); S.ab.dirty = true; renderSide(); return; }
  if(t.closest('#addBtn') && KBY[S.kind] && KBY[S.kind].wb){ S.bulkOpen = false; wbStash(); const k = 'n' + Date.now().toString(36); S.sel = k; S.wbDeckOpen = false; wbStart(k); S.mobileOpen = true; renderAll(); setTimeout(() => { const n = $('#w_name'); if(n) n.focus(); }, 50); return; }
  if(t.closest('#addBtn')){ S.bulkOpen = false; eStash(); const it = curItem(); S.draft = {isNew:true, key:'', obj:it ? clone(it.obj) : {}}; S.sel = null; S.json = true; S.jsonText = JSON.stringify(S.draft.obj, null, 2); S.jsonErr = ''; S.comment = ''; S.mobileOpen = true; renderAll(); return; }
});
document.addEventListener('keydown', e => { if(e.key === 'Enter'){ const row = e.target.closest && e.target.closest('tr.row'); if(row) selectItem(row.dataset.key); } });
function setMode(json){
  if(json === S.json) return;
  if(json){ S.jsonText = JSON.stringify(S.draft.obj, null, 2); S.jsonErr = ''; }
  else if(S.jsonErr) return;
  S.json = json; renderSide();
}
// 欄・JSON・コメントの入力は、描き直さずに状態と差分の表示だけ更新する
const later = () => refreshDyn();
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ S.q = t.value; renderList(); return; }
  if(t.id === 'bulkText'){ S.bulkText = t.value; keepUnsent(); return; }
  if(t.id === 'w_reply' && S.wb){ S.wb.reply = t.value; return; }
  if(t.id === 'a_reply' && S.ab){ S.ab.reply = t.value; return; }
  if(t.dataset && t.dataset.ab && S.ab){ const was = S.ab.dirty, r = abInput(t.dataset.ab, t); S.ab.dirty = true; if(r === 'full') renderSide(); else abRefresh(); if(!was || r === 'full') renderList(); return; }
  if(t.dataset && t.dataset.wb && S.wb){ const was = S.wb.dirty, r = wbInput(t.dataset.wb, t); S.wb.dirty = true; if(!S.wb.custom && t.dataset.wb !== 'w_text') S.wb.card.text = genText(S.wb.card); if(r === 'full') renderSide(); else wbRefresh(); if(!was){ bulkLabel(); if(innerWidth > 820) renderList(); } return; }
  if(t.id === 'comment'){ S.comment = t.value; refreshDyn(); return; }
  if(t.id === 'newkey'){ S.draft.key = t.value; later(); return; }
  if(t.id === 'jsonbox'){ S.jsonText = t.value; try{ S.draft.obj = JSON.parse(t.value); S.jsonErr = ''; }catch(err){ S.jsonErr = 'JSON の書き方が崩れています: ' + err.message; } later(); return; }
  if(t.dataset.path){
    const p = t.dataset.path, ty = t.dataset.t; let v;
    if(ty === 'bool') v = t.checked;
    else if(ty === 'num') v = t.value === '' ? undefined : Number(t.value);
    else if(ty === 'lines') v = t.value.split('\n').map(s => s.trim()).filter(Boolean);
    else if(ty === 'arr') v = t.value.split(/[,、]\s*/).map(s => s.trim()).filter(Boolean).map(s => /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : s);
    else if(ty === 'json'){ try{ v = JSON.parse(t.value); }catch(_){ return; } }
    else v = t.value;
    setPath(S.draft.obj, p, v); later();
  }
});
document.addEventListener('change', e => { const t = e.target; if(t.dataset && t.dataset.wb && S.wb && (t.tagName === 'SELECT' || t.type === 'checkbox') && !t._done){ /* input で処理済み */ } });
// 画面の大きさが変わっても描き直さない(スマホではキーボードが開くと大きさが変わる)
addEventListener('resize', () => { const side = $('#side'); if(S.kind === 'requests') side.hidden = innerWidth <= 820; else side.hidden = innerWidth <= 820 && !S.mobileOpen; syncSideMode(); });

const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'q'; };
document.addEventListener('focusout', () => setTimeout(() => { fixScroll(); flushRender(); }, 400));
// ページ全体はスクロールしない作り。キーボードやフォーカスでずれたまま残ると、押した位置と反応する位置がずれるので戻す
function fixScroll(){
  if(typing()) return;
  const se = document.scrollingElement || document.documentElement;
  if(se.scrollTop || se.scrollLeft) se.scrollTop = se.scrollLeft = 0;
  if(document.body.scrollTop) document.body.scrollTop = 0;
  const app = $('.app'); if(app && app.scrollTop) app.scrollTop = 0;
}
addEventListener('scroll', () => { if(!typing()) fixScroll(); }, {passive:true});
if(window.visualViewport) visualViewport.addEventListener('resize', () => setTimeout(fixScroll, 120));
// 押している最中に描き直すと、押したボタンが消えて別の物が押される。指(マウス)を離すまで待つ
// 離したことが届かない場合(ダイアログ・画面の切り替えなど)もあるので、押してから1.2秒たったら押していない扱い
let PRESS = 0;
document.addEventListener('pointerdown', e => { PRESS = Date.now(); setTimeout(flushRender, 1300); tapDot(e); }, true);
// 押したところに輪を出す(ページが受け取った位置。指の位置とずれていたら、ページの外側のずれ)
function tapDot(e){ if(e.pointerType === 'mouse') return; const d = document.createElement('i'); d.className = 'tapdot'; d.style.left = e.clientX + 'px'; d.style.top = e.clientY + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 500); }
const pressEnd = () => { const at = PRESS; setTimeout(() => { if(PRESS === at) PRESS = 0; flushRender(); }, 80); };
for(const ev of ['pointerup', 'pointercancel', 'click']) document.addEventListener(ev, pressEnd, true);
addEventListener('blur', pressEnd); document.addEventListener('visibilitychange', pressEnd);
const pressing = () => PRESS && Date.now() - PRESS < 1200;
const busy = () => pressing() || typing();
function flushRender(){ if(S.pending && !busy()){ S.pending = false; renderAll(); } }
// データベースから届いた変更を描く。押している・入力している間は後回し。side=false なら右の欄は描き直さない
function requestRender(side){
  if(busy()){ S.pending = true; renderTabs(); return; }
  renderTabs(); renderList(); if(side) renderSide();
}
/* ---------- 共有データベース(依頼) ---------- */
$('#ver').textContent = META.version ? `ゲーム ${META.version}${META.commit ? ' · ' + META.commit : ''}` : '';
restoreUnsent();
document.addEventListener('input', () => keepUnsent());
renderAll();
(async () => {
  const use = window.claude && window.claude.use;
  DB = use ? await window.claude.use('db') : null;
  if(!DB){ dbState = 'off'; renderAll(); return; }
  // 入力中(キーボードが開いている間)は描き直さず、入力を離れてから描き直す
  // カード工房: 保存したカードと最初のデッキ
  DB.collection('cards').onSnapshot(s => {
    const cur = S.wb ? S.wb.key : null, before = cur ? JSON.stringify(WB[cur] || null) : '';
    WB = {}; for(const d of s.docs) WB[d.id] = d.data(); wbState = 'on';
    const changed = !cur || JSON.stringify(WB[cur] || null) !== before;
    if(changed && S.wb && !S.wb.dirty && WB[cur]){ const rp = S.wb.reply; wbStart(cur); S.wb.reply = rp; }
    requestRender(changed && !!(KBY[S.kind] && KBY[S.kind].wb));
  }, () => { wbState = 'off'; });
  DB.collection('attrs').onSnapshot(s => {
    const cur = S.ab ? S.ab.key : null, before = cur ? JSON.stringify(AB[cur] || null) : '';
    AB = {}; for(const d of s.docs) AB[d.id] = d.data();
    const changed = !cur || JSON.stringify(AB[cur] || null) !== before;
    if(changed && S.ab && !S.ab.dirty && AB[cur]){ const rp = S.ab.reply; abStart(cur); S.ab.reply = rp; }
    requestRender(changed && !!(KBY[S.kind] && KBY[S.kind].ab));
  }, () => {});
  DB.doc('config/deck').onSnapshot(d => { WBDECK = d.exists ? d.data() : null; requestRender(S.wbDeckOpen && !S.wbDeckDraft); }, () => {});
  DB.collection('requests').onSnapshot(s => { REQ = s.docs.map(d => Object.assign({id:d.id}, d.data())); dbState = 'on'; if(busy()){ S.pending = true; renderTabs(); refreshDyn(); } else renderAll(); },
    () => { dbState = 'off'; DB = null; renderAll(); });
})();
</script>
