<title>Ascendroid 案B 定刻</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
/* 配置: 画面は塔が打ち出す運行表(連続帳票)。五本の線は K-7 の五つの部位で、敵の攻撃が「いつ・どこに・どれだけ」で並ぶ。下の台に切符(手札) */
:root{
  color-scheme:light;
  --paper:#dbe1d3;  /* 帳票の紙 */
  --bar:#c8d3c1;    /* 1サイクルおきの縞 */
  --rule:#9eab9b;   /* 罫線 */
  --ink:#1a2025;    /* 塔の黒インク */
  --ink2:#5d6862;   /* 薄い印字 */
  --red:#cf3620;    /* 塔の赤インク: 脅威 */
  --blue:#1c46c4;   /* K-7 の青: 自分と操作 */
  --mark:#ffdb3a;   /* 黄色のマーカー: 狙い目 */
  --bed:#1f2c28;    /* 機械の台 */
  --bed2:#2c3d37;
  --stock:#f1eee2;  /* 切符の紙 */
  --dot:"DotGothic16","BIZ UDGothic",monospace;
  --ui:"BIZ UDGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
html,body{height:100%}
body{background:var(--bed);color:var(--ink);font-family:var(--ui);overflow:hidden;overflow:clip;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#wrap{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#fit{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;transform-origin:50% 50%;overflow:hidden;overflow:clip;background:var(--bed)}
#rot{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:13px;color:#b9c4bb;z-index:5}
#shake{position:absolute;inset:0}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .f{fill:currentColor;stroke:none}
.view{position:absolute;inset:0}

/* ---- 帳票 ---- */
#paper{position:absolute;left:0;right:0;top:0;height:var(--pb);background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.4);overflow:hidden;overflow:clip}
#feedClip{position:absolute;left:calc(var(--x0) - var(--cw) * .5);right:calc(100% - var(--x1) - 14px);top:30px;bottom:0;overflow:hidden;overflow:clip}
#feed{position:absolute;left:0;top:0;bottom:0;width:calc(100% + var(--cw) * 4);
  background:
   radial-gradient(circle at calc(var(--cw) * .5) 9px,var(--bed) 0 3.2px,transparent 3.6px) 0 0/var(--cw) 18px repeat-x,
   radial-gradient(circle at calc(var(--cw) * .5) 9px,var(--bed) 0 3.2px,transparent 3.6px) 0 100%/var(--cw) 18px repeat-x,
   repeating-linear-gradient(90deg,var(--bar) 0 var(--cw),transparent var(--cw) calc(var(--cw) * 2))}
#rules{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.ln{position:absolute;left:var(--x0);width:calc(var(--x1) - var(--x0) + 14px);height:1px;background:var(--ink);opacity:.55}
.ln.soft{opacity:.2}
#nowLine{position:absolute;left:calc(var(--x0) - 1.25px);top:52px;bottom:20px;width:2.5px;background:var(--ink)}
#nowLine::before{content:"";position:absolute;left:-5px;top:-7px;border:6.2px solid transparent;border-top:8px solid var(--ink)}
.tn{position:absolute;font:400 12px/1 var(--dot);color:var(--ink2);transform:translateX(-50%)}
#edgeR{position:absolute;left:calc(var(--x1) + 14px);top:30px;bottom:0;width:1px;background:repeating-linear-gradient(180deg,var(--ink2) 0 3px,transparent 3px 6px)}
.rowlb{position:absolute;left:calc(var(--x0) - 96px);width:88px;height:16px;margin-top:-8px;display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;white-space:nowrap}
.rowlb .pips{margin-left:auto}
.rowlb.lane{justify-content:flex-end}
.rowlb .ic{width:11px;height:11px}
.rowlb .pips{display:flex;gap:1px}
.rowlb .pips i{width:3px;height:9px;box-shadow:inset 0 0 0 1px var(--ink);box-sizing:border-box}
.rowlb .pips i.on{background:var(--ink)}
.rowlb .pips i.gh{background:var(--red);box-shadow:none;animation:blink .5s steps(2) infinite}
.rowlb.aim{color:var(--red)}
.rowlb.dead{color:var(--ink2);text-decoration:line-through}
.rowlb.lane{color:var(--ink2);font-weight:400;font-size:9px}
.rowlb.lane.k{color:var(--blue);font-weight:700}

/* ---- 上の印字 ---- */
#top{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:12px;padding:0 10px 0 12px;font-size:11px;z-index:20;border-bottom:1px solid var(--rule);box-sizing:border-box}
#top .area{font-weight:700}
.heat{display:flex;align-items:center;gap:5px;color:var(--ink2)}
.heat .segs{display:flex;gap:2px}
.heat .segs i{width:9px;height:9px;box-shadow:inset 0 0 0 1px var(--ink2);box-sizing:border-box}
.heat .segs i.on{background:var(--red);box-shadow:none}
.heat .segs i.on.c{background:var(--ink)}
.heat b{color:var(--ink)}
#top .sp{flex:1}
#top .scrap{display:flex;align-items:center;gap:4px;font:400 16px/1 var(--dot)}
#menuBtn{width:30px;height:26px;display:grid;place-items:center}
#tabs{position:absolute;left:50%;top:4px;transform:translateX(-50%);display:flex;align-items:center;gap:1px;padding:2px;border-radius:3px;background:rgba(26,32,37,.1);z-index:21}
#tabs em{font-style:normal;font-size:9px;color:var(--ink2);padding:0 6px 0 8px;letter-spacing:.1em}
#tabs button{font-size:10.5px;padding:3px 10px;border-radius:2px;color:var(--ink2);line-height:1.3}
#tabs button.on{background:var(--ink);color:var(--paper);font-weight:700}
.dark #top{color:#d5ddd2;border-color:#3a4d46}
.dark #top .heat,.dark #top .heat b{color:#d5ddd2}
.dark .heat .segs i{box-shadow:inset 0 0 0 1px #8a968c}
.dark .heat .segs i.on.c{background:#d5ddd2}
.dark #top .scrap,.dark #menuBtn{color:#d5ddd2}
.dark #tabs{background:rgba(255,255,255,.08)}
.dark #tabs em,.dark #tabs button{color:#a9b5ab}
.dark #tabs button.on{background:var(--stock);color:var(--ink)}

/* ---- 譜(敵の予定) ---- */
#noteClip{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x1) - 14px) 0 calc(var(--x0) - 15px));pointer-events:none}
.nt{position:absolute;left:0;top:0;width:0;height:0;transition:transform linear,opacity .2s;will-change:transform;pointer-events:auto;cursor:pointer;--ny:100px}
.nt .hit{position:absolute;left:-13px;top:calc(var(--ye) - 12px);width:26px;height:calc(var(--ny) - var(--ye) + 26px)}
.nt .stem{position:absolute;left:-.75px;top:var(--ye);width:1.5px;height:calc(var(--ny) - var(--ye));background:var(--red)}
.nt .hd{position:absolute;left:-11px;top:calc(var(--ny) - 11px);width:22px;height:22px;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--red);color:var(--red);font:400 16px/1 var(--dot)}
.nt.near .hd{background:var(--red);color:#fff}
.nt .ug{position:absolute;left:-8px;top:calc(var(--ye) - 8px);width:16px;height:16px;box-sizing:border-box;display:grid;place-items:center;background:var(--paper);border:1.5px solid var(--red);color:var(--red)}
.nt .ug .ic{width:10px;height:10px}
.nt.sub .hd{left:-9px;top:calc(var(--ny) - 9px);width:18px;height:18px;font-size:12px;border-width:1.5px}
.nt.sub .beam{position:absolute;right:0;top:calc(var(--ye) - 1.5px);height:3px;width:var(--cw);background:var(--red)}
.nt.move .ug{width:auto;min-width:16px;left:-13px;padding:0 3px;height:18px;top:calc(var(--ye) - 9px);border-color:var(--ink);color:var(--ink);display:flex;align-items:center;gap:1px;font:400 12px/1 var(--dot)}
.nt.ch .mk{position:absolute;left:-15px;top:calc(var(--ye) - 12px);width:30px;height:calc(var(--ny) - var(--ye) + 27px);background:var(--mark);opacity:.75;border-radius:3px}
.nt.ch .hd{border-style:dashed}
.nt.ch .perf{position:absolute;left:-16px;top:calc(var(--ny) - 16px);width:32px;height:32px;box-sizing:border-box;border-radius:50%;border:1.5px dashed var(--ink)}
.nt .memo{position:absolute;left:14px;top:calc(var(--ny) - 30px);white-space:nowrap;font:600 14px/1 var(--hand);color:var(--blue);transform:rotate(-5deg);display:none}
.nt.pv-absorb .hd{border-color:var(--blue);color:var(--blue);background:var(--paper)}
.nt.pv-absorb .stem{background:var(--blue)}
.nt.pv-hurt .hd{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--red);animation:pulse .6s ease-in-out infinite alternate}
.nt.pv-cut .memo,.nt.pv-just .memo,.nt.pv-broken .memo{display:block}
.nt.pv-cut .memo{color:var(--red)}
.nt.pv-just .ring,.nt.pv-broken .ring{position:absolute;left:-19px;top:calc(var(--ny) - 19px);width:38px;height:38px;box-sizing:border-box;border:2.5px solid var(--blue);border-radius:48% 52% 50% 50%/52% 48% 52% 48%;transform:rotate(-8deg)}
.nt.burst{transition:none;animation:burst .4s ease-out forwards;pointer-events:none}
.win{position:absolute;left:0;top:calc(var(--ye) - 26px);height:12px;transition:transform linear,width .15s;pointer-events:none;font:700 9px/12px var(--ui);white-space:nowrap}
.win i{position:absolute;left:0;right:0;top:0;bottom:0;border-radius:2px}
.win b{position:relative;padding:0 3px}
.win b span{font:400 12px/1 var(--dot);margin-left:1px}
.win.wind i,.win.rec i{background:var(--mark);opacity:.85}
.win.guard i{background:repeating-linear-gradient(115deg,var(--ink) 0 1.5px,transparent 1.5px 4px);opacity:.35}
.win.guard b{background:var(--paper)}
#pvBar{position:absolute;left:var(--x0);top:calc(var(--yk) - 6px);height:12px;pointer-events:none}
#pvBar .b1{position:absolute;left:0;top:0;height:12px;background:var(--blue);border-radius:1px}
#pvBar .b2{position:absolute;top:5px;height:2px;background:repeating-linear-gradient(90deg,var(--blue) 0 4px,transparent 4px 8px);opacity:.6}
#pvBar .v{position:absolute;top:calc(var(--ye) - var(--yk) - 8px);width:0;height:calc(var(--yk) - var(--ye) + 14px);border-left:2px dashed var(--blue)}
#pvBar .span{position:absolute;left:0;top:calc(var(--ye) - var(--yk) - 8px);height:calc(var(--yk) - var(--ye) + 14px);background:rgba(28,70,196,.07)}
#pvBar.cutting .b1{background:var(--red)}
#pvBar.cutting .span{background:rgba(207,54,32,.09)}
#pvBar .cut{position:absolute;top:-4px;margin-left:-10px;width:20px;height:20px;color:var(--red)}
#pvBar .cut .ic{width:20px;height:20px;stroke-width:2.6}
#goBtn{position:absolute;z-index:12;height:30px;padding:0 10px 0 8px;transform:translate(-50%,0) rotate(-3deg);display:flex;align-items:center;gap:6px;white-space:nowrap;font:400 20px/1 var(--dot);color:var(--blue);background:var(--paper);border:2px solid var(--blue);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--blue);border-radius:3px}
#goBtn span{display:flex;align-items:center;gap:2px}
#goBtn .ic{width:13px;height:13px}
#goBtn .pl{width:11px;height:11px}
#goBtn small{font:700 12px var(--ui)}
#goBtn.cut{color:var(--red);border-color:var(--red);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--red)}
#goBtn.ghost{pointer-events:none;box-shadow:none;border-style:dashed}
#goBtn.ghost .pl{display:none}
#goBtn:not(.ghost){background:var(--blue);color:#fff}
#goBtn.cut:not(.ghost){background:var(--red)}

/* ---- 自機(左の余白) ---- */
#me{position:absolute;left:8px;top:calc(var(--ye) - 6px);width:70px;height:116px;transition:transform .1s}
#me svg{width:100%;height:100%;overflow:visible}
#me .body{fill:var(--paper);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
#me .scarf{fill:url(#hatchB);stroke:var(--blue);stroke-width:1.1}
#me .eye,#me .edge{stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;fill:none}
#me.lunge{transform:translateX(8px)}
#me.hurt .body{fill:#f1b8ae}
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#leaders path{fill:none;stroke:var(--ink2);stroke-width:.7}
#blk{position:absolute;left:14px;top:calc(var(--yk) - 14px);height:26px;padding:0 7px;display:flex;align-items:center;gap:3px;font:400 20px/1 var(--dot);color:var(--blue);border:2px solid var(--blue);border-radius:3px;transform:rotate(-4deg);opacity:0;transition:opacity .15s;background:var(--paper)}
#blk.on{opacity:1}
#blk.hit{animation:stamp .25s ease-out}
#meSt{position:absolute;left:84px;top:calc(var(--yk) - 8px);display:flex;gap:6px;font:400 14px/1 var(--dot);color:var(--red)}
#meSt span{display:flex;align-items:center;gap:1px}
#say{position:absolute;left:10px;top:calc(var(--pb) - 30px);max-width:calc(var(--x0) + 180px);font:600 13px/1.35 var(--hand);color:var(--blue);transform:rotate(-1.5deg);transform-origin:0 50%;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;z-index:6}
#say.on{opacity:1}

/* ---- 敵(右の余白) ---- */
#foeBox{position:absolute;left:calc(var(--x1) + 22px);right:8px;top:34px;bottom:6px}
#foeName{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#foe{position:relative;height:92px;margin-top:2px;transition:transform .1s}
#foe svg{width:100%;height:100%;overflow:visible}
#foe .body,#foe .foot,#foe .joint{fill:var(--paper);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
#foe .near,#foe .far{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
#foe .far{stroke:var(--ink2);stroke-dasharray:2 2}
#foe .mast{fill:none;stroke:var(--ink);stroke-width:1.2}
#foe .sh{fill:url(#hatchK);stroke:none}
#foe .eyeF{fill:var(--red)}
#foe [data-u].t .body,#foe [data-u].t .near{stroke:var(--blue);stroke-width:2.2}
#foe [data-u].x{opacity:.25}
#foe.recoil{transform:translateX(4px)}
#foe.dead{animation:fall 1s ease-in forwards}
#units{display:grid;gap:3px;margin-top:4px}
.un{display:grid;grid-template-columns:13px 28px 1fr 22px;align-items:center;gap:4px;height:19px;padding:0 3px 0 2px;text-align:left;font-size:10px;font-weight:700;position:relative;border-radius:2px}
.un .ic{width:11px;height:11px}
.un .bar{position:relative;height:7px;box-shadow:inset 0 0 0 1px var(--ink)}
.un .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .2s}
.un .bar s{position:absolute;top:0;bottom:0;background:var(--blue);animation:blink .5s steps(2) infinite}
.un b{font:400 14px/1 var(--dot);text-align:right}
.un .bd{position:absolute;right:28px;top:-4px;display:flex;gap:3px;font:400 11px/1 var(--dot)}
.un .bd span{display:flex;align-items:center;background:var(--paper);padding:0 1px}
.un .bd .ic{width:9px;height:9px}
.un .bd .cr,.un .bd .vu{color:var(--blue)}
.un .bd .vu{background:var(--mark)}
.un .vt{position:absolute;left:-7px;top:6px;width:6px;height:6px;background:var(--red);transform:rotate(45deg)}
.un.tgt{box-shadow:0 0 0 1.5px var(--blue);color:var(--blue)}
.un.tgt .bar{box-shadow:inset 0 0 0 1px var(--blue)}
.un.tgt .bar i{background:var(--blue)}
.un.broken{color:var(--ink2);text-decoration:line-through;pointer-events:none;opacity:.6}
.un.flash{animation:stamp .25s ease-out}
.un .to{position:absolute;right:26px;bottom:-5px;font:600 11px/1 var(--hand);color:var(--blue);background:var(--paper);padding:0 2px;display:none}
.un.pv .to{display:block}

/* ---- 下の台: 切符(手札)と鍵 ---- */
#bed{position:absolute;left:0;right:0;top:var(--pb);bottom:0;background:linear-gradient(180deg,#17211e 0,var(--bed) 10px,var(--bed2) 100%)}
#hand{position:absolute;left:150px;right:150px;bottom:0;height:108px;display:flex;justify-content:center;z-index:10}
.card{position:relative;flex:none;width:98px;height:136px;margin:0 2px;box-sizing:border-box;padding:6px 8px 8px 9px;text-align:left;display:flex;flex-direction:column;background:var(--stock);color:var(--ink);border-radius:3px 3px 0 0;box-shadow:0 1px 0 #fff inset,0 3px 8px rgba(0,0,0,.45);transition:transform .14s cubic-bezier(.2,.9,.3,1.2)}
.card.r-uncommon{background:repeating-linear-gradient(135deg,rgba(28,70,196,.07) 0 2px,transparent 2px 6px),#e4eaea}
.card.r-rare{background:repeating-linear-gradient(45deg,rgba(150,110,0,.1) 0 2px,transparent 2px 6px),repeating-linear-gradient(135deg,rgba(150,110,0,.1) 0 2px,transparent 2px 6px),#f1e4b6}
.card .crow{display:flex;align-items:center;gap:6px;height:30px}
.card .cost{font:400 32px/1 var(--dot);min-width:16px}
.card .len{display:flex;gap:3px}
.card .len i{width:7px;height:7px;border-radius:50%;background:var(--bed);box-shadow:inset 0 1px 1px #000}
.card .len.zero{font-size:9px;font-weight:700;color:var(--ink2)}
.card .attr{height:11px;font-size:8.5px;font-weight:700;color:var(--blue)}
.card .nm{font-size:13px;font-weight:700;line-height:1.15;white-space:nowrap;border-bottom:1px solid var(--ink);padding-bottom:3px}
.card .nm.long{font-size:11px}
.card .big{display:flex;align-items:center;gap:4px;height:28px;font:400 24px/1 var(--dot)}
.card .big .ic{width:14px;height:14px}
.card .tx{font-size:9.5px;line-height:1.4;color:#3c4640;white-space:pre-wrap}
.card .wm{display:none}
.card.sel{transform:translateY(-36px);box-shadow:0 0 0 2.5px var(--blue),0 8px 16px rgba(0,0,0,.5);z-index:3}
.card.hov{transform:translateY(-12px)}
.card.in{animation:deal .26s cubic-bezier(.2,.8,.3,1) backwards}
#hp{position:absolute;left:10px;top:calc(var(--pb) + 12px);width:128px;display:flex;align-items:center;gap:6px;color:#d5ddd2}
#hp .ic{width:12px;height:12px}
#hp .bar{position:relative;flex:1;height:7px;box-shadow:inset 0 0 0 1px #8a968c}
#hp .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--stock);transition:width .2s}
#hp .bar s{position:absolute;top:0;bottom:0;background:var(--red);animation:blink .5s steps(2) infinite}
#hp b{font:400 16px/1 var(--dot);min-width:44px;text-align:right}
#hp b small{font-size:11px;color:#8a968c}
#piles{position:absolute;left:10px;top:calc(var(--pb) + 38px);display:flex;gap:4px;z-index:11}
.pile,.act{display:flex;align-items:center;justify-content:center;gap:3px;background:var(--stock);color:var(--ink);border-radius:4px;box-shadow:0 3px 0 #9d9a8c,0 5px 6px rgba(0,0,0,.4)}
.pile{width:40px;height:32px;font:400 16px/1 var(--dot)}
#acts{position:absolute;right:10px;bottom:14px;display:flex;align-items:flex-end;gap:8px;z-index:11}
.act{position:relative}
.act .ic{width:20px;height:20px}
.act b{position:absolute;right:-5px;top:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font:400 14px/18px var(--dot);text-align:center}
#refBtn{width:60px;height:52px}
#waitBtn{width:44px;height:38px}
.act.sel{box-shadow:0 0 0 2.5px var(--blue),0 3px 0 #9d9a8c;transform:translateY(1px)}

/* ---- 演出 ---- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:15}
.pop{position:absolute;transform:translate(-50%,-50%);font:400 24px/1 var(--dot);white-space:nowrap;display:flex;align-items:center;gap:2px}
.pop .ic{width:13px;height:13px}
.pop.big{font-size:32px}
.pop.blue{color:var(--blue)}
.pop.red{color:var(--red)}
.pop.ink{color:var(--ink);font-size:16px}
.pop.word{font:600 22px/1 var(--hand);transform:translate(-50%,-50%) rotate(-6deg)}
.pop.bx{background:var(--paper);padding:1px 4px}
.strike{position:absolute;height:2px;transform-origin:0 50%}

/* ================= 戦闘: 動かす ================= */
async function settle(){ if(playP){ skipAll(); await playP; } }
async function choose(a){
  au(); await settle(); hideTip(); if(st.over) return;
  if(a && sameAct(a, sel)) return commit();
  sel = a; hov = null; if(a) SFX.select(); renderSel();
}
async function commit(){
  await settle(); if(!sel || st.over) return; const a = sel; sel = null; hov = null;
  const act = a.type === 'card' ? {type:'card', i:a.i, uid:st.target} : a;
  const evs = M.run(st, act); renderHand(); renderSel(); playP = play(evs); await playP;
}
const tickDur = of => RM.matches ? 60 : of <= 1 ? 190 : of <= 3 ? 150 : 115;
async function play(evs){
  skip = false; const me = $('#me');
  for(const ev of evs){ const s = ev.snap;
    if(ev.type === 'start'){ if(ev.kind === 'refresh') SFX.refresh(); continue; }
    if(ev.type === 'tick'){ const d = skip ? 0 : tickDur(ev.of); show(s, d); feedTick(d); SFX.tick(); await wait(d); continue; }
    if(ev.type === 'fire'){ await fireFx(ev); show(s, skip ? 0 : 140); await wait(120); continue; }
    if(ev.type === 'foe'){ await foeFx(ev); show(s, skip ? 0 : 140); await wait(150); continue; }
    if(ev.type === 'interrupt'){ SFX.interrupt(); pop(G.x0 + 70, G.yk, 'ブレイク', 'red word bx'); me.classList.add('hurt'); await wait(280); me.classList.remove('hurt'); continue; }
    if(ev.type === 'refresh'){ renderHand(true); await wait(260); continue; }
    if(ev.type === 'won'){ await killFx(); continue; }
    if(ev.type === 'dead'){ SFX.kill(); showOver('機能停止', '', 'この戦闘をやり直す', restart); continue; }
    if(ev.type === 'end') show(s, 0);
  }
  skip = false; playP = null; renderHand(); renderSel(); speak();
}
async function fireFx(ev){
  const c = ev.c, heavy = c.cost >= 3, me = $('#me'), tu = ev.uid && !st.foe.units[ev.uid].broken ? ev.uid : 'core', [ux, uy] = unitXY(tu);
  if(c.dmg || c.delay) me.classList.add('lunge');
  if(ev.just && ev.res.some(r => r.kind === 'just')) await justFx(ev.res.find(r => r.kind === 'just'));
  if(c.dmg){ SFX[c.dmg.t === 'ranged' ? 'ranged' : 'melee'](heavy); strikeLine(G.x0, G.yk, ux - 60, uy, 'var(--blue)'); await wait(heavy ? 90 : 40); if(heavy) shake(3); }
  else if(c.block) SFX.block(); else if(c.delay) SFX.delay();
  let dn = 0;
  for(const r of ev.res){
    if(r.kind === 'block'){ pop(60, G.yk - 28, ic('block') + '+' + r.n, 'blue bx'); const w = $('#blk'); w.classList.remove('hit'); void w.offsetWidth; w.classList.add('hit'); }
    if(r.kind === 'dmg'){ const [x, y] = unitXY(r.unit); pop(x - 92 - dn * 30, y, '−' + r.n, 'blue bx' + (r.n >= 12 ? ' big' : '')); dn++; const el = document.querySelector(`.un[data-u="${r.unit}"]`); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); const f = $('#foe'); f.classList.add('recoil'); setTimeout(() => f.classList.remove('recoil'), 110); }
    if(r.kind === 'armored' || r.kind === 'guarded'){ const [x, y] = unitXY(r.unit); pop(x - 96 - dn * 30, y - 16, ic('block') + r.n, 'ink bx'); SFX.absorb(); }
    if(r.kind === 'vulnHit'){ const [x, y] = unitXY(r.unit); pop(x - 150, y - 14, '×1.5', 'blue word', {dur:800}); }
    if(r.kind === 'crack'){ const [x, y] = unitXY(r.unit); pop(x - 100, y + 16, ic('crack') + '+' + r.n, 'blue bx'); }
    if(r.kind === 'delay'){ pop(X(Math.max(2, st.foe.r - r.n)) + 30, G.ye - 4, ic('delay') + '+' + r.n, 'blue bx'); }
    if(r.kind === 'unitBreak'){ SFX.unitBreak(); shake(4); const [x, y] = unitXY(r.unit); pop(x - 30, y, '破壊', 'blue word', {dur:1000}); }
    if(r.kind === 'break'){ burstSeq(r.seq); SFX.brk(); pop(X(2), G.y0 + 2 * G.dy, 'BREAK', 'blue word bx'); await wait(200); }
    if(r.kind === 'cancel') burstSeq(r.seq);

let sayT = null, lastSay = '';

  if(st.over) return; const sc = M.schedule(st, V), ch = sc.find(x => x.a.ch), e = st.foe; let t = '';
  if(st.me.hp <= 14) t = '機能停止箇所多数……もうだめかも。';
  else if(e.uids.some(k => e.units[k].vuln > 1)) t = `${e.name}に隙がある……狙えるかな？`;
  else if(ch && ch.a.wind && ch.t <= ch.a.wind.w) t = '……崩せそうな気がする。';
  else if(ch && ch.t <= 7) t = `悪い予感。あと、${ch.t}サイクル。`;

/* ================= 地図(路線図) ================= */
let mapPick = null;
function renderMap(){
  const mp = M.MAP, W = G.W, H = G.H, L = 150, R = W - 84, sheetB = H - 70, top = 64, gap = 30, step = 22, base = Math.min(sheetB - 30, top + 3 * step + 2 * gap + (sheetB - top - 3 * step - 2 * gap) * .62);
  const P = (l, c) => [L + c * (R - L) / 12, base - Math.floor(c / 3) * step - (2 - l) * gap];
  const here = mp.path[mp.path.length - 1], nc = here[1] + 1, cross = mp.transfers.includes(here[1]);
  const reach = l => Math.abs(l - here[0]) <= (cross ? 1 : 0);
  const done = (l, c) => mp.path.some(p => p[0] === l && p[1] === c);
  let svg = '';
  for(const c of mp.transfers){ const [x1, y1] = P(0, c), [, y2] = P(2, c); svg += `<rect class="cap" x="${x1 - 15}" y="${y1 - 15}" width="30" height="${y2 - y1 + 30}" rx="15"/><text x="${x1}" y="${y2 + 29}" text-anchor="middle">乗り換え</text>`; }
  for(let l = 0; l < 3; l++) for(let c = 0; c < 11; c++){ const [x1, y1] = P(l, c), [x2, y2] = P(l, c + 1), mx = (x1 + x2) / 2; const dn = done(l, c) && done(l, c + 1), op = l === here[0] && c === here[1];
    svg += `<path class="e${dn ? ' done' : op ? ' open' : ''}" d="M${x1} ${y1}L${mx - 6} ${y1}L${mx + 6} ${y2}L${x2} ${y2}"/>`;
    if(mp.transfers.includes(c)) for(const d of [-1, 1]) if(l + d >= 0 && l + d < 3){ const [x3, y3] = P(l + d, c + 1); svg += `<path class="e x${l === here[0] && c === here[1] ? ' open' : ''}" d="M${x1} ${y1}L${x3} ${y3}"/>`; } }
  const [bx, by] = [R + 40, P(1, 11)[1] - step];
  for(let l = 0; l < 3; l++){ const [x1, y1] = P(l, 11); svg += `<path class="e" d="M${x1} ${y1}L${bx - 26} ${y1}L${bx - 14} ${by}L${bx} ${by}"/>`; }
  $('#mapSvg').innerHTML = svg;
  let h = '';
  for(let l = 0; l < 3; l++) for(let c = 0; c < 12; c++){ const [x, y] = P(l, c), t = mp.lanes[l][c], isHere = l === here[0] && c === here[1], r = c === nc && reach(l);
    h += `<button class="mn ${t}${done(l, c) ? ' done' : ''}${isHere ? ' here' : ''}${r ? ' reach' : ''}${mapPick && mapPick[0] === l && mapPick[1] === c ? ' pick' : ''}" type="button" style="left:${x}px;top:${y}px" data-l="${l}" data-c="${c}" ${r ? '' : 'disabled'} aria-label="${M.ROOM[t].name}">${ic(t)}</button>`; }
  h += `<button class="mn boss" type="button" style="left:${bx}px;top:${by}px" disabled aria-label="ボス">${ic('boss')}</button>`;
  $('#mapNodes').innerHTML = h;
  $('#mapTop').innerHTML = `<span>${ic('hp')}<b>${mp.body[0]}/${mp.body[1]}</b></span><span>${ic('deck')}<b>${mp.deck}</b></span>`;
  const t = mapPick ? mp.lanes[mapPick[0]][mapPick[1]] : null, g1 = t ? Math.max(-10, Math.min(10, mp.heat + M.ROOM[t].heat)) : mp.heat, lv = M.HEAT.level(mp.heat), lv1 = M.HEAT.level(g1);
  $('#thermo').innerHTML = `<div class="tt">警戒</div>${[2, 1, 0, -1, -2].map(v => `<div class="r${v === lv ? ' on' : ''}${v > 0 ? ' hot' : ''}${t && v === lv1 && lv1 !== lv ? ' to' : ''}"><i></i>${M.HEAT.names[v]}</div>`).join('')}<div class="fx">${(M.HEAT.fx[t ? lv1 : lv] || []).join('<br>')}</div>`;
  const info = $('#mapInfo');
  if(!t){ info.innerHTML = `<div class="d"><span>行き先を選ぶ。乗り換えの区画のあとは、隣の列へ移れる。</span></div>`; }
  else { const r = M.ROOM[t], d = r.heat; info.innerHTML = `${ic(t)}<div class="d"><b>${r.name}</b><span>${r.desc}</span></div><div class="h">警戒 <b class="${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'}</b><br>${M.HEAT.names[lv]}${lv1 !== lv ? ' → <b class="' + (lv1 > lv ? 'up' : 'dn') + '">' + M.HEAT.names[lv1] + '</b>' : ''}</div><button class="btn pri" type="button" id="mapGo">決定</button>`;
    $('#mapGo').onclick = () => { au(); SFX.step(); mapPick = null; go('battle'); restart(); }; }
  $('#heatChip').innerHTML = `警戒<span class="segs">${[-2, -1, 0, 1, 2].map(v => `<i class="${v === lv ? 'on' + (v <= 0 ? ' c' : '') : ''}"></i>`).join('')}</span><b>${M.HEAT.names[lv]}</b>`;
  $('#scrapChip').innerHTML = ic('scrap') + mp.scrap;
}
