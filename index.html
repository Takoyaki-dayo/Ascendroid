<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>塔の戦闘試作3</title>
<meta name="theme-color" content="#0e0d11">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: fixed 844x390 landscape stage, scaled to fit. Back to front: battle-forecast screen (timeline), characters in a row, status column at left, hand at bottom.
   Color is meaning only: red = threat, violet = charge/JUST, teal = what you have selected, amber = now and cost. Everything else is neutral. Text is kept to numbers, part names and card names. */
:root{
  --bg:#0e0d11; --panel:#131217; --line:#23212a; --grid:#1b1a21; --raised:#16151b;
  --fg:#e8e6ec; --fg2:#b9b5c2; --dim:#77727f; --dim2:#4d4955; --neutral:#cfcbd6;
  --time:#e9a23b; --time-dim:#6b5a3e; --me:#46d1c2; --foe:#ff5266; --foe2:#ff7a88; --just:#a98bff; --just2:#c3adff;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Chakra Petch","BIZ UDPGothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#rot{display:none;position:absolute;left:0;right:0;top:10px;text-align:center;color:var(--time);font-size:13px}
@media (orientation:portrait){#rot{display:block}}
#stage{position:absolute;left:50%;top:50%;width:844px;height:390px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:var(--bg);font-size:11px;line-height:1.35}
#stage *{box-sizing:border-box}
#shaker{position:absolute;inset:0}
#shaker.shake{animation:shake .28s linear}
@keyframes shake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,0)}}
button{font:inherit;color:inherit;cursor:pointer;padding:0;margin:0;background:none;border:0;text-align:left}
button:focus-visible{outline:2px solid var(--time);outline-offset:2px}
.num{font-family:var(--f-num)}
.ic{display:inline-flex;flex:none}
.ic svg{width:12px;height:12px;display:block}
.abs{position:absolute}
.np{pointer-events:none}

/* timeline (battle forecast) */
#tl{position:absolute;inset:0;transition:opacity .2s}
#shaker.executing #tl{opacity:.62}
#screen{position:absolute;left:96px;top:8px;width:620px;height:164px;border:1px solid #201e27;border-radius:6px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),#111015}
.tl{position:absolute;top:40px;width:1px;height:126px;background:var(--grid)}
.tn{position:absolute;top:10px;width:20px;text-align:center;font-family:var(--f-num);font-size:10px;color:var(--time-dim)}
#nowTri{position:absolute;left:174px;top:11px}
#nowLine{position:absolute;left:179px;top:22px;width:2px;height:144px;background:var(--time)}
.rowline{position:absolute;left:180px;height:1px;width:458px;background:rgba(255,255,255,.07)}
.rowline.tgt{background:rgba(70,209,194,.45)}
.rowline.dead{opacity:.3}
.rowtag{position:absolute;left:646px;width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:10px;font-weight:700;background:#24222b;color:var(--fg)}
.rowtag.tgt{background:var(--me);color:var(--bg)}
.rowtag.dead{opacity:.3}
.rowhit{position:absolute;left:180px;width:490px;height:34px}
#pvRegion{position:absolute;left:181px;top:24px;height:142px;background:rgba(70,209,194,.06)}
#pvLine{position:absolute;top:22px;width:2px;height:144px;background:var(--me)}
#selfBar{position:absolute;left:181px;top:25px;height:9px;border-radius:0 3px 3px 0;transition:width .13s linear}
#selfBar.pre{background:rgba(70,209,194,.45)}
#selfBar.cast{background:rgba(70,209,194,.75);box-shadow:0 0 8px rgba(70,209,194,.5)}
#selfBar.broken{background:var(--foe);animation:barbreak .38s ease-out forwards}
@keyframes barbreak{0%{opacity:1;transform:none}40%{opacity:1;transform:scaleY(2.2)}100%{opacity:0;transform:scaleY(.2) translateY(-6px)}}
.mk{position:absolute;width:32px;height:22px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:4px;border:1.5px solid var(--foe);background:#24131a;color:#ffdade;transition:left .13s linear,top .2s,opacity .2s,transform .2s,box-shadow .15s}
.mk b{font-family:var(--f-num);font-size:13px;font-weight:700}
.mk span{font-size:9.5px}
.mk .ic svg{width:10px;height:10px}
.mk.later{opacity:.45}
.mk.ch{border-color:var(--just);background:#1d1830;color:#e6defc;border-radius:11px}
.mk.dl{border:1px solid #4d4955;background:var(--raised);color:var(--fg2)}
.mk.danger{box-shadow:0 0 0 3px rgba(255,82,102,.42)}
.mk.just{background:var(--just);color:#1a1030;box-shadow:0 0 16px rgba(169,139,255,.85)}
.mk.fire{transform:scale(1.35);box-shadow:0 0 14px rgba(255,82,102,.8)}
.mk.out{opacity:0!important;transform:scale(1.6)}

/* stage */
#floor{position:absolute;left:0;top:214px;width:844px;height:80px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.03))}
#droid{position:absolute;left:108px;top:142px;width:50px;height:128px;transform-origin:50% 100%}
#droid svg{display:block}
#droid.casting{filter:drop-shadow(0 0 5px rgba(70,209,194,.55))}
#droid.lunge{animation:lunge .36s ease-out}
@keyframes lunge{35%{transform:translateX(72px) rotate(8deg)}100%{transform:none}}
#droid.recoil{animation:recoil .3s ease-out}
@keyframes recoil{25%{transform:translateX(-7px) rotate(-3deg)}100%{transform:none}}
#droid.hit{animation:dhit .3s linear}
@keyframes dhit{0%{filter:brightness(2.2) drop-shadow(0 0 6px rgba(255,82,102,.9))}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{transform:none;filter:none}}
#droid.stagger{animation:stagger .4s ease-out}
@keyframes stagger{30%{transform:rotate(-10deg) translateX(-6px)}100%{transform:none}}
#droid.glitch{animation:glitch .3s steps(4)}
@keyframes glitch{25%{transform:translateX(3px)}50%{transform:translateX(-3px);filter:hue-rotate(60deg)}75%{transform:translateX(2px)}100%{transform:none}}
.foe{position:absolute;top:170px;width:90px;height:100px;transition:opacity .4s,transform .4s}
.foe svg{display:block}
.foe.atk{animation:fatk .26s ease-out}
@keyframes fatk{40%{transform:translateX(-26px)}100%{transform:none}}
.foe.ehit{animation:fhit .26s ease-out}
@keyframes fhit{0%{filter:brightness(2.4)}30%{transform:translateX(10px)}100%{transform:none;filter:none}}
.foe.ejust{animation:fjust .45s ease-out}
@keyframes fjust{0%{filter:brightness(2) drop-shadow(0 0 10px #a98bff)}30%{transform:translateX(16px) rotate(6deg)}100%{transform:none;filter:none}}
.foe.dead{opacity:0;transform:translateY(14px) scaleY(.85)}
.reticle{position:absolute;left:4px;top:6px;width:82px;height:90px;border:2px solid var(--me);border-radius:4px;opacity:0;transition:opacity .15s;
  -webkit-mask:linear-gradient(#000 0 0) top left/14px 14px no-repeat,linear-gradient(#000 0 0) top right/14px 14px no-repeat,linear-gradient(#000 0 0) bottom left/14px 14px no-repeat,linear-gradient(#000 0 0) bottom right/14px 14px no-repeat;
  mask:linear-gradient(#000 0 0) top left/14px 14px no-repeat,linear-gradient(#000 0 0) top right/14px 14px no-repeat,linear-gradient(#000 0 0) bottom left/14px 14px no-repeat,linear-gradient(#000 0 0) bottom right/14px 14px no-repeat}
.foe.tgt .reticle{opacity:1}
.finfo{position:absolute;top:272px;width:100px;display:flex;flex-direction:column;gap:3px;transition:opacity .4s}
.finfo.dead{opacity:.25}
.frow{display:flex;gap:4px;align-items:center}
.ftag{width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:10px;font-weight:700;background:#24222b;flex:none}
.ftag.tgt{background:var(--me);color:var(--bg)}
.fhp{position:relative;display:block;width:58px;height:4px;background:#24222b;border-radius:2px;overflow:hidden}
.fhp i{position:absolute;left:0;top:0;bottom:0;background:var(--neutral);transition:width .25s}
.fhp s{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--foe) 0 2px,transparent 2px 4px)}
.fhpt{font-family:var(--f-num);font-size:10.5px;color:var(--fg2)}
.fhpt.pv{color:var(--foe2)}
.fst{display:inline-flex;gap:2px;align-items:center;color:var(--foe2);font-family:var(--f-num);font-size:10px;font-weight:700}
.fst .ic svg{width:11px;height:11px}

/* status column */
#body{position:absolute;left:8px;top:8px;width:74px;display:flex;align-items:center;gap:4px;color:var(--fg2)}
#bodyBar{position:relative;display:block;flex:1;height:4px;background:#24222b;border-radius:2px;overflow:hidden}
#bodyBar i{position:absolute;left:0;top:0;bottom:0;background:var(--neutral);transition:width .25s}
#bodyNum{font-family:var(--f-num);font-size:10.5px}
#bodyNum.pv{color:var(--foe2)}
#chips{position:absolute;left:8px;top:26px;display:flex;gap:10px}
.chip{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-num);font-size:11px;font-weight:700}
#blk{color:var(--fg)} #blk.zero{color:var(--dim2)}
#blk.flash{animation:blkflash .35s}
@keyframes blkflash{0%{color:#fff;filter:drop-shadow(0 0 6px #fff)}100%{filter:none}}
#swf{color:var(--time)}
.part{position:absolute;left:8px;width:74px;display:block;transition:background .2s}
.ph{display:flex;align-items:center;gap:4px}
.pico{position:relative;display:inline-flex;color:var(--fg)}
.pico svg{width:12px;height:12px;display:block}
.pname{font-size:10.5px;font-weight:700}
.pnum{margin-left:auto;font-family:var(--f-num);font-size:10.5px;font-weight:600;color:var(--fg2)}
.pnum.pv{color:var(--foe2)}
.pips{display:flex;gap:2px;margin-top:4px}
.pip{display:block;height:7px;border-radius:1px;background:#24222b}
.pip.full{background:var(--neutral)}
.pip.loss{background:repeating-linear-gradient(135deg,var(--foe) 0 2px,#3a1820 2px 4px)}
.pip.worn{background:repeating-linear-gradient(135deg,#2c2a33 0 2px,#16151b 2px 4px)}
.part.th-hit .pico,.part.th-hit .pname{color:var(--foe2)}
.part.th-ch .pico,.part.th-ch .pname{color:var(--just2)}
.part.broken .pname{color:var(--dim2)}
.part.broken .pico{color:var(--dim2)}
.part.broken .pico::after{content:"";position:absolute;left:-2px;top:5px;width:16px;height:2px;background:var(--foe);transform:rotate(-40deg)}
.part.flash{background:rgba(255,82,102,.2)}
#menuBtn{position:absolute;left:806px;top:8px;width:28px;height:22px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--dim);display:flex;align-items:center;justify-content:center}

/* hand */
#handShade{position:absolute;left:0;top:200px;width:844px;height:190px;background:linear-gradient(180deg,rgba(14,13,17,0),rgba(14,13,17,.92) 30%);opacity:0;transition:opacity .2s;pointer-events:none}
#handShade.on{opacity:1}
.pile{position:absolute;left:8px;width:66px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:6px}
.pile .ic svg{width:14px;height:14px}
.pile b{font-family:var(--f-num);font-size:13px}
#pileDisc{color:var(--dim)}
.card{position:absolute;overflow:hidden;border-radius:8px;background:var(--raised);border:1px solid #2a2832;color:var(--fg);
  transition:left .22s cubic-bezier(.2,.8,.2,1),top .22s cubic-bezier(.2,.8,.2,1),width .2s,height .2s,transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s,border-color .15s,box-shadow .2s}
.card.sel{border:1.5px solid var(--me);box-shadow:0 10px 22px rgba(70,209,194,.25)}
.card:disabled{cursor:default}
.card.static{position:relative;width:122px;height:132px;transition:none}
.cart{position:relative;display:block;height:44px;background:repeating-linear-gradient(135deg,#1d1c23 0 6px,#18171d 6px 12px);transition:height .2s}
.card.exp .cart{height:58px}
.cost{position:absolute;left:4px;top:4px;width:20px;height:20px;border:1.5px solid var(--time);border-radius:10px;background:var(--bg);color:var(--time);font-family:var(--f-num);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.atom{position:absolute;right:6px;top:7px;width:8px;height:8px;background:var(--fg);transform:rotate(45deg)}
.cval{position:absolute;right:6px;bottom:3px;display:flex;align-items:center;gap:3px}
.cval b{font-family:var(--f-num);font-size:16px;line-height:1}
.cname{display:block;padding:5px 6px 0;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctext{display:none;padding:3px 7px 0;font-size:10.5px;color:var(--fg2)}
.card.exp .ctext{display:block}
.kwp{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:700;border:1px solid #3a3743;border-radius:3px;padding:0 4px;line-height:14px;color:var(--fg)}
.kw-me{font-weight:700;color:var(--fg)} .kw-t{font-weight:700;color:var(--fg)} .kw-f{font-weight:700;color:var(--foe2)}
#toggle{position:absolute;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--dim);display:flex;align-items:center;justify-content:center;transition:left .2s,top .2s,width .2s,height .2s}
#toggle svg{transition:transform .2s}
#toggle.exp svg{transform:rotate(180deg)}
#detail{position:absolute;left:560px;top:306px;width:172px;height:76px;border-radius:8px;background:var(--panel);border:1px solid var(--line);padding:7px 9px;display:flex;flex-direction:column;gap:3px;transition:opacity .15s}
#detail .dn{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700}
#detail .dn b{color:var(--time);font-family:var(--f-num)}
#detail .dt{font-size:10.5px;color:var(--fg2)}
#redraw{position:absolute;left:742px;top:306px;width:92px;height:76px;border:1px solid #2c2a33;border-radius:8px;background:#141318;color:#9a96a3;display:flex;align-items:center;justify-content:center;gap:8px;transition:top .15s,border-color .15s,box-shadow .15s}
#redraw svg{width:20px;height:20px}
#redraw b{font-family:var(--f-num);font-size:24px;color:var(--time)}
#redraw.sel{top:296px;border:1.5px solid var(--me);box-shadow:0 10px 22px rgba(70,209,194,.2)}
#redraw:disabled{opacity:.4;cursor:default}

/* fx */
#fx,#floats{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:17px;white-space:nowrap;text-shadow:0 0 6px #000,0 1px 0 #000;animation:rise .9s ease-out forwards;color:#fff}
.float.foe{color:var(--foe2)} .float.dim{color:var(--dim);font-size:13px} .float.time{color:var(--time);font-size:14px} .float.big{font-size:26px;text-shadow:0 0 10px rgba(169,139,255,.9),0 2px 0 #000}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
.burst{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--just);box-shadow:0 0 18px rgba(169,139,255,.9),inset 0 0 12px rgba(169,139,255,.6);animation:burst .5s ease-out forwards}
@keyframes burst{0%{transform:scale(.4);opacity:1}70%{opacity:1}100%{transform:scale(1.8);opacity:0}}
.shard{position:absolute;width:9px;height:3px;background:var(--just2);transition:transform .45s ease-out,opacity .45s}
.beam{position:absolute;height:3px;transform-origin:0 50%;border-radius:2px;background:linear-gradient(90deg,rgba(232,255,251,0),#e8fffb 25%,#cfeeea);box-shadow:0 0 10px rgba(232,255,251,.7);animation:beam .3s ease-out forwards}
@keyframes beam{0%{opacity:0;clip-path:inset(0 100% 0 0)}30%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}
.slash{position:absolute;width:60px;height:3px;margin:-1px 0 0 -30px;background:#fff;box-shadow:0 0 8px #fff;transform:rotate(-35deg);animation:slash .25s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:rotate(-35deg) scaleX(.2)}40%{opacity:1;transform:rotate(-35deg) scaleX(1)}100%{opacity:0;transform:rotate(-35deg) scaleX(1.2)}}
.shield{position:absolute;left:92px;top:136px;width:82px;height:140px;border:1.5px solid rgba(232,230,236,.8);border-radius:40% 40% 46% 46%;box-shadow:0 0 14px rgba(232,230,236,.35),inset 0 0 14px rgba(232,230,236,.2);animation:shield .55s ease-out forwards}
@keyframes shield{0%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
.noise{position:absolute;width:6px;height:6px;background:var(--fg2);transition:left .32s ease-in,top .32s ease-in,opacity .32s}
.ghost{position:absolute;width:24px;height:34px;border:1.5px solid var(--foe);border-radius:4px;background:var(--raised);transition:left .4s ease-in,top .4s ease-in,opacity .4s,transform .4s}
.spark{position:absolute;width:4px;height:4px;border-radius:2px;background:#ffd28a;transition:transform .4s ease-out,opacity .4s}
.after{position:absolute;opacity:.35;transition:opacity .3s,transform .3s}
#toast{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:18px;font-weight:700;letter-spacing:.14em;opacity:0;pointer-events:none;text-shadow:0 0 10px #000}
#toast.show{animation:toast 1.6s ease-out}
@keyframes toast{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}

/* overlay */
#ov{position:absolute;inset:0;background:rgba(8,7,11,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;max-width:580px;width:100%;max-height:362px;overflow:auto}
.box h2{font-size:16px;margin:0 0 4px;letter-spacing:.04em}
.box .sub{color:var(--dim);margin:0 0 8px}
.box .eff{font-size:12px;margin:6px 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.box li.cur{color:var(--time)}
.gl{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:10.5px}
.gl dt{font-weight:700;color:var(--fg2)} .gl dd{margin:0;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--time);background:var(--time);color:#22170a;font-weight:700;border-radius:6px;padding:7px 16px;text-align:center}
.btn.ghost{background:transparent;color:var(--time)}
.opts{display:flex;gap:10px;justify-content:center;margin:8px 0 12px;flex-wrap:wrap}
.opts.col{flex-direction:column;align-items:stretch}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:12px} .opt span{color:var(--dim)} .opt:disabled{opacity:.4;cursor:default}
.dk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){#stage *{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <div id="rot">横画面にすると大きく表示されます</div>
  <div id="stage">
    <div id="shaker">
      <div id="tl">
        <div id="screen"></div>
        <div id="ticks" class="np"></div>
        <svg id="nowTri" class="np" width="12" height="9" viewBox="0 0 12 9" aria-label="今"><path d="M0 0H12L6 9Z" fill="#e9a23b"/></svg>
        <div id="nowLine" class="np"></div>
        <div id="rows"></div>
        <div id="pvRegion" class="np" hidden></div>
        <div id="pvLine" class="np" hidden></div>
        <div id="selfBar" class="np" hidden></div>
        <div id="marks" class="np"></div>
      </div>
      <div id="floor" class="np"></div>

}

/* ---------- engine ---------- */
function applyCard(st, k, ti){
  const c = CARDS[k], b = st.b, ev = [];
  const targets = c.all ? b.foes.filter(e => e.alive) : (c.tgt ? [b.foes[ti]].filter(e => e && e.alive) : []);
  if(c.tgt && !targets.length) ev.push({kind:'miss'});
  if(c.dmg){
    const n = c.dmg.n + (c.dmg.t === 'phys' ? bonus(st,'out') : bonus(st,'arm'));
    for(const e of targets){
      for(let h = 0; h < (c.dmg.x || 1); h++){
        if(!e.alive) break;
        const d = n + e.crack; e.hp -= d; ev.push({kind:'dmg', e:e.i, n:d});
        if(e.hp <= 0){ e.hp = 0; e.alive = false; ev.push({kind:'kill', e:e.i}); }
      }
    }
  }
  if(c.crack) for(const e of targets) if(e.alive){ e.crack += c.crack; ev.push({kind:'crack', e:e.i, n:c.crack}); }
  if(c.delay) for(const e of targets) if(e.alive){ e.r += c.delay; ev.push({kind:'delay', e:e.i, n:c.delay}); }
  if(c.block){ const n = c.block + bonus(st,'dur'); b.block += n; ev.push({kind:'block', n}); }
  if(c.swift){ b.swift += c.swift; ev.push({kind:'swift', n:c.swift}); }
  return ev;
}
function enemyAct(st, e){
  const a = cur(e), b = st.b, res = {name:a.n};
  if(a.kind === 'delay'){ res.kind = 'delay'; res.v = a.v; }
  else {
    const raw = a.d, ab = Math.min(b.block, raw); b.block -= ab;
    const rem = raw - ab, p = b.parts[a.p];
    let partLoss = 0, bodyLoss = 0, broke = false;
    if(rem > 0){
      if(p.cur > 0){ partLoss = Math.min(p.cur, rem); p.cur -= partLoss; if(p.cur === 0){ broke = true; b.broken[a.p] = true; } bodyLoss = rem - partLoss; }
      else bodyLoss = rem;
      st.run.body = Math.max(0, st.run.body - bodyLoss);
    }
    Object.assign(res, {kind:'hit', part:a.p, raw, blocked:ab, partLoss, bodyLoss, broke, hurt:rem > 0});
  }
  advance(e);
  return res;
}
function* spendGen(st, cost, k, ti, noInt){
  const b = st.b, c = k ? CARDS[k] : null, atomic = !c || !!c.atomic;
  let left = cost;
  const out = {elapsed:0, completeAt:null, interruptedAt:null, justs:[], dead:false, won:false};
  b.cast = {k, left};
  while(left > 0){
    let real = true;
    if(b.swift > 0){ b.swift--; real = false; }
    left--; b.cast.left = left;
    if(real){ b.T++; out.elapsed++; for(const e of b.foes) if(e.alive) e.r--; }
    yield {type:'tick', real};
    if(left === 0){
      out.completeAt = out.elapsed;
      if(c){
        if(real) for(const e of b.foes){
          if(e.alive && e.r <= 0 && cur(e).ch){
            const nm = cur(e).n; advance(e);
            const cr = b.parts.calc.cur > 0 ? 1 : 0; e.crack += cr;
            out.justs.push({i:e.i, name:nm}); yield {type:'just', e:e.i, crack:cr};
          }
        }
        const ev = applyCard(st, k, ti);
        b.cast = null;
        yield {type:'card', ev};
      }
      b.cast = null;
      if(!b.foes.some(e => e.alive)){ out.won = true; return out; }
    }
    for(const e of b.foes){
      if(!e.alive || e.r > 0) continue;
      const res = enemyAct(st, e);
      if(res.kind === 'delay' && b.cast){
        left += res.v; b.cast.left = left; res.applied = true;
        if(b.parts.mob.cur > 0){ b.swift += 1; res.swift = 1; }
      }
      yield {type:'foe', e:e.i, res};
      if(st.run.body <= 0){ out.dead = true; b.cast = null; return out; }
      if(c && b.cast && res.hurt && !atomic && !noInt){ out.interruptedAt = out.elapsed; b.cast = null; yield {type:'interrupt'}; }
    }
    if(out.interruptedAt !== null) break;
  }
  b.cast = null;
  return out;
}

/* ---------- preview ---------- */
function computePreview(){
  if(!sel) return null;
  const b = S.b, k = sel.kind === 'card' ? sel.k : null;
  const cost = k ? CARDS[k].cost : b.hand.length;
  const sim = noInt => {
    const c = clone(S);
    if(k) c.b.hand.splice(sel.i, 1); else { c.b.disc.push(...c.b.hand); c.b.hand = []; }
    const g = spendGen(c, cost, k, sel.target, noInt); let r;
    while(!(r = g.next()).done){}
    return {c, out:r.value};
  };
  const A = sim(false), P = sim(true);
  return {
    k, cost, completeAt: P.out.completeAt ?? P.out.elapsed,
    interruptedAt: A.out.interruptedAt, justSet: new Set(A.out.justs.map(j => j.i)),
    parts: A.c.b.parts, body: A.c.run.body, foeHp: A.c.b.foes.map(e => e.hp),
  };
}

/* ---------- card text ---------- */
function cardType(c){ return c.dmg ? c.dmg.t : c.block ? 'block' : c.swift ? 'swift' : 'delay'; }
function cardVal(k, st){
  const c = CARDS[k];
  if(c.dmg){ const bn = c.dmg.t === 'phys' ? bonus(st,'out') : bonus(st,'arm'); return (c.dmg.n + bn) + (c.dmg.x ? '×' + c.dmg.x : ''); }
  if(c.block) return c.block + bonus(st,'dur');
  if(c.delay) return c.delay;
  return c.swift;
}
function cardText(k, st){
  const c = CARDS[k], s = [];
  if(c.dmg){ const bn = c.dmg.t === 'phys' ? bonus(st,'out') : bonus(st,'arm'); s.push(`${c.all ? '敵全員に ' : ''}${c.dmg.t === 'phys' ? '物理' : '光学'} <b>${c.dmg.n + bn}</b>ダメージ${c.dmg.x ? '×' + c.dmg.x : ''}`); }
  if(c.crack) s.push(`<span class="kw-f">クラック</span> ${c.crack}`);
  if(c.delay) s.push(`${c.all ? '敵全員に ' : ''}<span class="kw-t">ディレイ</span> ${c.delay}`);
  if(c.block) s.push(`<span class="kw-me">ブロック</span> <b>${c.block + bonus(st,'dur')}</b>`);
  if(c.swift) s.push(`<span class="kw-t">スウィフト</span> ${c.swift}`);
  return s.join('<br>');
}
function cardInner(k, st){
  const c = CARDS[k];
  return `<span class="cart"><span class="cost">${c.cost}</span>${c.atomic ? '<i class="atom"></i>' : ''}<span class="cval"><span class="ic">${IC[cardType(c)]}</span><b>${cardVal(k, st)}</b></span></span><span class="cname">${c.name}</span><span class="ctext">${cardText(k, st)}${c.atomic ? '<br><span class="kwp">アトミック</span>' : ''}</span>`;
}

/* ---------- static build ---------- */
function buildStatic(){
  let h = '';

function incoming(){

      const c = res[m.a.p];

/* ---------- fx ---------- */
function fxEl(cls, x, y, css){ const el = document.createElement('div'); el.className = cls; el.style.left = x + 'px'; el.style.top = y + 'px'; if(css) Object.assign(el.style, css); $('#fx').appendChild(el); return el; }
function floatAt(x, y, text, cls){ const el = document.createElement('div'); el.className = 'float ' + (cls || ''); el.textContent = text; el.style.left = x + 'px'; el.style.top = y + 'px'; $('#floats').appendChild(el); setTimeout(() => el.remove(), 950); }
function pulse(el, cls, ms){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
function shake(){ pulse($('#shaker'), 'shake', 300); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
const partY = id => 50 + PARTS.findIndex(p => p.id === id) * 44;

function beam(to){
  const dx = to.x - DROID.sx, dy = to.y - DROID.sy, len = Math.hypot(dx, dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
  const el = fxEl('beam', DROID.sx, DROID.sy, {width: len + 'px', transform: `rotate(${ang}deg)`});
  setTimeout(() => el.remove(), 320);
}
function shards(x, y, color){
  for(let k = 0; k < 6; k++){
    const el = fxEl('shard', x - 4, y - 1); if(color) el.style.background = color;
    const a = Math.random() * Math.PI * 2, r = 26 + Math.random() * 16;
    el.getBoundingClientRect();
    el.style.transform = `translate(${Math.cos(a) * r}px,${Math.sin(a) * r}px) rotate(${a * 57}deg)`; el.style.opacity = '0';
    setTimeout(() => el.remove(), 480);
  }
}
function sparks(x, y){
  for(let k = 0; k < 7; k++){
    const el = fxEl('spark', x, y); const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, r = 14 + Math.random() * 20;
    el.getBoundingClientRect(); el.style.transform = `translate(${Math.cos(a) * r}px,${Math.sin(a) * r}px)`; el.style.opacity = '0';
    setTimeout(() => el.remove(), 450);
  }
}
function afterimage(){
  const src = $('#droid svg').cloneNode(true), el = fxEl('after', 108, 142); el.appendChild(src);
  el.getBoundingClientRect(); el.style.transform = 'translateX(-14px)'; el.style.opacity = '0';
  setTimeout(() => el.remove(), 320);
}
function cardMotion(k, ti){
  const c = CARDS[k], d = $('#droid'), t = cardType(c);
  const targets = c.all ? S.b.foes.filter(e => e.alive || true).map(e => e.i) : (c.tgt ? [ti] : []);
  if(t === 'phys'){ pulse(d, 'lunge', 380); for(const i of targets){ const p = foeCenter(i); const el = fxEl('slash', p.x, p.y - 10); setTimeout(() => el.remove(), 260); } }
  else if(t === 'opt'){ pulse(d, 'recoil', 320); for(const i of targets) beam(foeCenter(i)); }
  else if(t === 'block'){ const el = fxEl('shield', 92, 136); setTimeout(() => el.remove(), 560); }
  else if(t === 'delay'){
    pulse(d, 'glitch', 320);
    for(const i of targets){
      const p = foeCenter(i);
      for(let k2 = 0; k2 < 5; k2++){
        const el = fxEl('noise', DROID.sx + k2 * 4, DROID.sy + (k2 % 2) * 8); el.getBoundingClientRect();
        setTimeout(() => { el.style.left = (p.x + (k2 - 2) * 6) + 'px'; el.style.top = (p.y - 20 + k2 * 5) + 'px'; el.style.opacity = '0'; }, k2 * 30);
        setTimeout(() => el.remove(), 420);
      }
    }
  }
  else if(t === 'swift'){ afterimage(); setTimeout(afterimage, 90); }
}
function cardFx(x){
  switch(x.kind){
    case 'dmg': { const p = foeCenter(x.e); floatAt(p.x, p.y - 62, '−' + x.n, 'foe'); pulse(foeEl(x.e), 'ehit', 280); break; }
    case 'kill': { const p = foeCenter(x.e); shards(p.x, p.y, '#cfcbd6'); break; }
    case 'crack': { const p = foeCenter(x.e); floatAt(p.x + 30, p.y - 40, '+' + x.n, 'foe'); break; }
    case 'delay': floatAt(xs(2), ROWY[x.e] - 14, '+' + x.n, 'time'); break;
    case 'block': floatAt(30, 34, '+' + x.n, ''); pulse($('#blk'), 'flash', 360); break;
    case 'swift': floatAt(70, 34, '+' + x.n, 'time'); break;
  }
}
async function foeFx(i, r){
  const e = S.b.foes[i];
  pulse(foeEl(i), 'atk', 270);
  const mk = markEls.get(i + '-' + (e.seq - 1));
  if(mk){ mk.classList.add('fire'); }
  await sleep(110);
  if(r.kind === 'delay'){
    if(r.applied){ pulse($('#droid'), 'glitch', 320); floatAt(xs(1), 30, '+' + r.v, 'time'); if(r.swift) setTimeout(afterimage, 120); }
    return;
  }
  const y = partY(r.part);
  if(r.blocked) pulse($('#blk'), 'flash', 360);
  if(r.partLoss){ floatAt(66, y + 6, '−' + r.partLoss, 'foe'); pulse(document.querySelector(`.part[data-p="${r.part}"]`), 'flash', 320); }
  if(r.broke) sparks(DROID.x, DROID.y - 30);
  if(r.bodyLoss) floatAt(58, 14, '−' + r.bodyLoss, 'foe');
  if(r.hurt){ pulse($('#droid'), 'hit', 320); if(r.raw >= 8) shake(); }
  else { const el = fxEl('shield', 92, 136); setTimeout(() => el.remove(), 560); }
}
function justFx(i){
  const x = NOW, y = ROWY[i];
  const el = fxEl('burst', x, y); setTimeout(() => el.remove(), 520);
  shards(x, y, null);
  pulse(foeEl(i), 'ejust', 460);
}
function interruptFx(){
  const bar = $('#selfBar'); bar.hidden = false; bar.className = 'np broken';
  setTimeout(() => { bar.classList.remove('broken'); }, 400);
  pulse($('#droid'), 'stagger', 420);
  const g = fxEl('ghost', DROID.x - 12, DROID.y - 40); g.getBoundingClientRect();
  g.style.left = '30px'; g.style.top = '350px'; g.style.opacity = '0'; g.style.transform = 'rotate(-30deg) scale(.6)';
  setTimeout(() => g.remove(), 420);
}

/* ---------- play ---------- */
function drawN(n){
  const b = S.b;
  for(let i = 0; i < n; i++){
    if(!b.draw.length){ b.draw = shuffle(b.disc); b.disc = []; }
    if(!b.draw.length) break;
    b.hand.push(b.draw.pop());
  }
}
function defaultTarget(){ const b = S.b; if(b.foes[lastTarget] && b.foes[lastTarget].alive) return lastTarget; const e = b.foes.find(f => f.alive); return e ? e.i : 0; }
function recalc(){ PV = computePreview(); renderAll(); }
function onCard(i){
  const k = S.b.hand[i].k, c = CARDS[k];
  if(sel && sel.kind === 'card' && sel.i === i){ execute(); return; }
  sel = {kind:'card', i, k, target: c.tgt ? defaultTarget() : null}; recalc();
}
function onRedraw(){
  if(!S.b.hand.length) return;
  if(sel && sel.kind === 'redraw'){ execute(); return; }
  sel = {kind:'redraw'}; recalc();
}
function onFoe(i){
  const e = S.b.foes[i]; if(!e.alive) return;
  if(sel && sel.kind === 'card' && CARDS[sel.k].tgt){
    if(sel.target === i){ execute(); return; }
    sel.target = i; lastTarget = i; recalc(); return;
  }
  if(!sel) infoFoe(i);
}
function flyCard(el, x, y){
  if(!el) return;
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = 'scale(.25) rotate(12deg)'; el.style.opacity = '0';
  setTimeout(() => el.remove(), 260);
}
async function showEvent(ev, k, ti){
  switch(ev.type){
    case 'tick': if(!ev.real) afterimage(); renderAll(); await sleep(ev.real ? T_TICK : T_SWIFT); break;
    case 'just': justFx(ev.e); renderAll(); await sleep(420); break;
    case 'card': cardMotion(k, ti); for(const x of ev.ev) cardFx(x); renderAll(); await sleep(320); break;
    case 'foe': await foeFx(ev.e, ev.res); renderAll(); await sleep(190); break;
    case 'interrupt': interruptFx(); renderAll(); await sleep(420); break;
  }
}
async function execute(){
  const s = sel, b = S.b; sel = null; PV = null; busy = true;
  let card = null, k = null, cost;
  if(s.kind === 'card'){
    card = b.hand.splice(s.i, 1)[0]; k = card.k; cost = CARDS[k].cost; if(s.target != null) lastTarget = s.target;
    const el = cardEls.get(card.id); cardEls.delete(card.id); flyCard(el, DROID.x - 40, DROID.y - 40);
  } else {
    cost = b.hand.length;
    b.hand.forEach((cd, n) => { const el = cardEls.get(cd.id); cardEls.delete(cd.id); setTimeout(() => flyCard(el, 24, 346), n * 30); });
    b.disc.push(...b.hand); b.hand = [];
  }
  $('#droid').classList.add('casting');
  renderAll();
  const g = spendGen(S, cost, k, s.target, false); let r;
  while(!(r = g.next()).done) await showEvent(r.value, k, s.target);
  $('#droid').classList.remove('casting');
  const out = r.value;
  if(card) b.disc.push(card);
  busy = false;
  if(out.dead){ renderAll(); await sleep(350); onLose(); return; }
  if(out.won){ b.over = true; renderAll(); await sleep(500); onWin(); return; }
  if(!k || !b.hand.length) drawN(5);
  renderAll();
}

/* ---------- flow ---------- */
function newRun(){
  const parts = {}; for(const p of PARTS) parts[p.id] = {damaged:false};
  S = {run:{body:50, bodyMax:50, parts, deck:START_DECK.slice(), step:0}};
  hideOv(); startBattle(0);
}
function startBattle(n){
  const B = BATTLES[n], run = S.run;
  snapshot = JSON.stringify(run);
  const parts = {};
  for(const p of PARTS) parts[p.id] = {cur: run.parts[p.id].damaged ? Math.ceil(p.max / 2) : p.max, max:p.max};
  const foes = B.foes.map((key, i) => { const f = FOES[key]; return {key, i, name:f.name, tag:f.tag, kind:f.kind, hp:f.hp, maxHp:f.hp, pat:f.pat, idx:0, r:f.start, seq:0, alive:true, crack:0}; });
  let id = 0;
  S.b = {n, T:0, block:0, swift: parts.mob.cur > 0 ? 2 : 0, foes, parts, draw: shuffle(run.deck.map(k => ({k, id: n * 1000 + id++}))), disc:[], hand:[], cast:null, broken:{}, over:false};
  sel = null; PV = null; busy = false; lastTarget = 0;
  clearCards(); clearMarks(); buildFoes();
  drawN(5); renderAll();
  toast(`${B.area} · ${B.room}`);
}
function next(){
  S.run.step++;
  const s = FLOW[S.run.step];
  if(s[0] === 'b') startBattle(+s[1]);
  else if(s === 'learn') showLearn();
  else if(s === 'rest') showRest();
  else showClear();
}
function onWin(){
  const lines = [];
  for(const p of PARTS){
    const rp = S.run.parts[p.id], br = !!S.b.broken[p.id];
    if(br) lines.push(`<li>${p.fn}: 破損 → 次の戦闘は耐久半分(損傷)</li>`);
    else if(rp.damaged) lines.push(`<li>${p.fn}: 耐えきった → 損傷が直った</li>`);
    rp.damaged = br;
  }
  lastPool = BATTLES[S.b.n].foes.flatMap(k => FOES[k].pool);
  showOv(`<h2>戦闘終了</h2><p class="sub">本体 ${S.run.body}/${S.run.bodyMax}</p>${lines.length ? `<ul>${lines.join('')}</ul>` : ''}<div class="row"><button class="btn" type="button" data-act="next">次へ</button></div>`);
}
function onLose(){
  showOv(`<h2>機能停止</h2><p class="sub">${BATTLES[S.b.n].room}で本体の耐久が尽きた。</p><div class="row"><button class="btn ghost" type="button" data-act="restart">最初から</button><button class="btn" type="button" data-act="retry">この戦闘をやり直す</button></div>`);
}
function showLearn(){
  const opts = shuffle([...new Set(lastPool)]).slice(0, 3);
  showOv(`<h2>学習</h2><p class="sub">倒した敵の動きを、1つ取り込める。</p><div class="opts">${opts.map(k => `<button class="card static exp" type="button" data-act="learn" data-arg="${k}">${cardInner(k, null)}</button>`).join('')}</div><div class="row"><button class="btn ghost" type="button" data-act="next">取り込まない</button></div>`);
}
function showRest(){
  const dmg = PARTS.filter(p => S.run.parts[p.id].damaged).map(p => p.fn);
  showOv(`<h2>整備ステーション</h2><p class="sub">1つだけ選べる。本体 ${S.run.body}/${S.run.bodyMax}${dmg.length ? ` · 損傷: ${dmg.join('・')}` : ''}</p><div class="opts col"><button class="opt" type="button" data-act="repair"><b>修理</b><span>本体+15、損傷をすべて直す</span></button><button class="opt" type="button" data-act="defrag"><b>デフラグ</b><span>デッキからカードを1枚消去する</span></button></div>`);
}
function showDefrag(){
  const counts = {}; for(const k of S.run.deck) counts[k] = (counts[k] || 0) + 1;
  showOv(`<h2>デフラグ</h2><p class="sub">消去するカードを選ぶ。武装由来のカードは消せない。</p><div class="dk">${Object.keys(counts).map(k => `<button class="opt" type="button" data-act="del" data-arg="${k}" ${CARDS[k].src ? 'disabled' : ''}><b>${CARDS[k].name} ×${counts[k]}</b><span>${CARDS[k].cost}サイクル</span></button>`).join('')}</div>`);
}
function showClear(){
  showOv(`<h2>エリア1 踏破</h2><p class="sub">本体 ${S.run.body}/${S.run.bodyMax} · デッキ ${S.run.deck.length}枚。試作はここまで。</p><div class="row"><button class="btn" type="button" data-act="restart">最初から</button></div>`);
}

/* ---------- info overlays ---------- */
function gloss(list){ return `<dl class="gl">${list.map(w => `<dt>${w}</dt><dd>${GLOSS[w]}</dd>`).join('')}</dl>`; }
const closeRow = '<div class="row"><button class="btn" type="button" data-act="close">閉じる</button></div>';
function infoCard(k){
  const c = CARDS[k], kw = [];
  if(c.block) kw.push('ブロック'); if(c.delay) kw.push('ディレイ'); if(c.swift) kw.push('スウィフト'); if(c.crack) kw.push('クラック');
  kw.push(c.atomic ? 'アトミック' : '中断'); kw.push('サイクル');
  showOv(`<h2>${c.name}</h2><p class="sub">コスト ${c.cost} サイクル${c.src ? ` · ${c.src}由来` : ''}</p><p class="eff">${cardText(k, S)}</p>${gloss(kw)}${closeRow}`, true);
}
function infoFoe(i){
  const e = S.b.foes[i];
  const rows = e.pat.map((a, j) => `<li class="${j === e.idx ? 'cur' : ''}">${a.kind === 'delay' ? `${a.n}: 自分にディレイ${a.v}` : `${a.n}: ${a.d}ダメージ → ${PART_BY[a.p].fn}${a.ch ? '(溜め)' : ''}`} <span style="color:var(--dim)">間隔${a.dl}</span></li>`).join('');
  showOv(`<h2>${e.tag} ${e.name}</h2><p class="sub">耐久 ${e.hp}/${e.maxHp}${e.crack ? ` · クラック${e.crack}` : ''} · 行動パターン(繰り返し、色つきが次)</p><ol>${rows}</ol>${gloss(['溜め','ジャスト'])}${closeRow}`, true);
}
function infoPart(id){
  const p = PART_BY[id], st = S.b.parts[id], rp = S.run.parts[id];
  showOv(`<h2>${p.name}</h2><p class="sub">${p.fn}${p.pt ? '(' + p.pt + ')' : ''} · 耐久 ${st.cur}/${st.max}${st.cur <= 0 ? ' · 破損' : rp.damaged ? ' · 損傷' : ''}</p><p class="eff">${p.text}</p>${gloss(['破損','損傷'])}${closeRow}`, true);
}
function infoDeck(){
  const counts = {}; for(const k of S.run.deck) counts[k] = (counts[k] || 0) + 1;
  showOv(`<h2>デッキ ${S.run.deck.length}枚</h2><p class="sub">山札 ${S.b.draw.length} · 捨て札 ${S.b.disc.length} · 手札 ${S.b.hand.length}</p><div class="dk">${Object.keys(counts).map(k => `<div class="opt"><b>${CARDS[k].name} ×${counts[k]}</b><span>${CARDS[k].cost}サイクル</span></div>`).join('')}</div>${closeRow}`, true);
}
function showRules(first){
  showOv(`<h2>試作3の遊び方</h2><ul>
    <li>時間はカードを使ったときだけ進む。カード左上の数字が、かかるサイクル。</li>
    <li>奥の画面が戦闘予測。各敵の行を、攻撃の予定が右から「今」(琥珀の三角)へ流れてくる。数字はダメージ、横の字は狙う部位。紫の丸は溜め技、砂時計は自分へのディレイ。</li>
    <li>カードをタップすると完了位置と被弾の予測が出る。もう一度タップで実行。攻撃カードは敵か敵の行をタップして対象を変えられ、同じ敵をもう一度タップしても実行。</li>
    <li>完了前に被弾すると中断。ブロックで全部防ぐか、右上に菱形のあるカード(アトミック)なら中断されない。完了と溜め技が同じサイクルなら、JUSTで潰せる。</li>
    <li>左端は部位。耐久が0で破損し、性能を失う。そこへの攻撃と、削りきれなかった分は本体へ。破損した部位は次の戦闘で耐久半分。</li>
    <li>右下は引き直し(残りの手札の枚数ぶんサイクルを払う)。下の矢印で手札を広げると効果文が見える。カードと敵は長押し、部位はタップで詳細。</li>
  </ul><div class="row"><button class="btn" type="button" data-act="close">${first ? 'はじめる' : '閉じる'}</button></div>`, !first);
}
function showMenu(){
  const B = BATTLES[S.b.n];
  showOv(`<h2>${B.area} ${B.room}</h2><p class="sub">部屋 ${B.no}/6${B.boss ? ' · ボス' : ''}</p><div class="opts col"><button class="opt" type="button" data-act="rules"><b>遊び方</b></button><button class="opt" type="button" data-act="deck"><b>デッキ一覧</b></button><button class="opt" type="button" data-act="fs"><b>全画面にする</b><span>対応していない環境では何も起きない</span></button><button class="opt" type="button" data-act="restart"><b>最初からやり直す</b></button></div>${closeRow}`, true);
}
async function goFull(){
  hideOv();
  try{ await document.documentElement.requestFullscreen(); try{ await screen.orientation.lock('landscape'); }catch(e){} }catch(e){}
}
function showOv(html, closable){ const ov = $('#ov'); $('#ovbox').innerHTML = html; ov.dataset.closable = closable ? '1' : ''; ov.hidden = false; }
function hideOv(){ $('#ov').hidden = true; }
function act(a, arg){
  switch(a){
    case 'close': hideOv(); break;
    case 'menu': if(!busy) showMenu(); break;
    case 'rules': showRules(false); break;
    case 'deck': infoDeck(); break;
    case 'fs': goFull(); break;
    case 'restart': newRun(); break;
    case 'retry': S.run = JSON.parse(snapshot); hideOv(); startBattle(S.b.n); break;
    case 'next': hideOv(); next(); break;
    case 'learn': S.run.deck.push(arg); hideOv(); next(); break;
    case 'repair': S.run.body = Math.min(S.run.bodyMax, S.run.body + 15); for(const p of PARTS) S.run.parts[p.id].damaged = false; hideOv(); next(); break;
    case 'defrag': showDefrag(); break;
    case 'del': { const i = S.run.deck.indexOf(arg); if(i >= 0) S.run.deck.splice(i, 1); hideOv(); next(); break; }
  }
}

/* ---------- input ---------- */
const stage = $('#stage');
let lpTimer = null, longFired = false;
stage.addEventListener('pointerdown', ev => {
  if(busy || !$('#ov').hidden) return;
  const c = ev.target.closest('.card[data-i]'), f = ev.target.closest('.foe[data-f],.finfo[data-f]');
  if(!c && !f) return;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    longFired = true; setTimeout(() => { longFired = false; }, 700);
    if(c) infoCard(S.b.hand[+c.dataset.i].k); else infoFoe(+f.dataset.f);
  }, 430);
});
['pointerup','pointercancel','pointerleave'].forEach(n => stage.addEventListener(n, () => clearTimeout(lpTimer)));
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('click', ev => {
  if(longFired){ longFired = false; return; }
  const t = ev.target, a = t.closest('[data-act]');
  if(a){ act(a.dataset.act, a.dataset.arg); return; }
  const ov = $('#ov');
  if(!ov.hidden){ if(t === ov && ov.dataset.closable) hideOv(); return; }
  if(busy) return;
  const card = t.closest('.card[data-i]'); if(card){ onCard(+card.dataset.i); return; }
  if(t.closest('#redraw')){ onRedraw(); return; }
  if(t.closest('#toggle')){ UI.expand = !UI.expand; renderAll(); return; }
  const f = t.closest('[data-f]'); if(f){ onFoe(+f.dataset.f); return; }
  const p = t.closest('.part'); if(p){ infoPart(p.dataset.p); return; }
  if(t.closest('.pile')){ infoDeck(); return; }
  if(sel){ sel = null; PV = null; renderAll(); }
});

function fit(){
  const w = $('#wrap');
  document.documentElement.style.setProperty('--s', Math.max(0.2, Math.min(w.clientWidth / 844, w.clientHeight / 390)));
}
addEventListener('resize', fit);
fit();
buildStatic();
newRun();
showRules(true);
</script>
<script>
// オフライン用のサービスワーカー登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
