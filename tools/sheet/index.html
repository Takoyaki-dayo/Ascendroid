<title>Ascendroid データ台帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* ゲームのデータ台帳: 上に種類のタブ、左に一覧、右に選んだ項目の編集と依頼。色はゲームと同じ(シアン=自分の操作、赤=未対応、紫=相談中) */
:root{
  --bg:#f2f5f8; --panel:#ffffff; --raised:#eaf0f5; --line:#d3dde6; --fg:#0d1620; --fg2:#3b4f61; --dim:#6a7d8e;
  --cy:#0a86ad; --cy-soft:rgba(10,134,173,.1); --foe:#d0284a; --foe-soft:rgba(208,40,74,.1); --just:#6a45d4; --just-soft:rgba(106,69,212,.1); --ok:#1d8a57; --ok-soft:rgba(29,138,87,.1);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Chakra Petch","BIZ UDPGothic",ui-monospace,monospace;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f15; --panel:#0f1720; --raised:#141f2b; --line:#1f2e3d; --fg:#e6eef5; --fg2:#a9bccb; --dim:#6f8396;
  --cy:#38d3ff; --cy-soft:rgba(56,211,255,.1); --foe:#ff6b84; --foe-soft:rgba(255,77,106,.12); --just:#b99bff; --just-soft:rgba(177,140,255,.13); --ok:#5fd39a; --ok-soft:rgba(95,211,154,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f15; --panel:#0f1720; --raised:#141f2b; --line:#1f2e3d; --fg:#e6eef5; --fg2:#a9bccb; --dim:#6f8396;
  --cy:#38d3ff; --cy-soft:rgba(56,211,255,.1); --foe:#ff6b84; --foe-soft:rgba(255,77,106,.12); --just:#b99bff; --just-soft:rgba(177,140,255,.13); --ok:#5fd39a; --ok-soft:rgba(95,211,154,.12); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
main.wide{grid-template-columns:minmax(0,1fr)}
main.wide .side{display:none}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.5;margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:1400px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;letter-spacing:.04em;font-weight:700}
.ver{font-family:var(--f-num);font-size:12px;color:var(--dim)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:none;padding:6px 10px;border-radius:6px;color:var(--fg2);font-weight:700;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.tab:hover{background:var(--raised)}
.tab.on{background:var(--cy-soft);color:var(--cy)}
.tab .n{font-family:var(--f-num);font-size:11px;color:var(--foe);font-weight:700}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,460px);gap:16px;padding-block:12px}
.listwrap{min-width:0;display:flex;flex-direction:column;gap:8px;min-height:0}
.tools{display:flex;gap:8px;align-items:center}
.tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px}
.btn{border:1px solid var(--cy);background:var(--cy);color:var(--bg);font-weight:700;border-radius:6px;padding:6px 14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--cy)}
.btn.quiet{border-color:var(--line);background:var(--panel);color:var(--fg2)}
.btn:disabled{opacity:.4;cursor:default}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-height:0;flex:1}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--raised);text-align:left;font-size:11px;color:var(--dim);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--raised)}
tr.row.sel td{background:var(--cy-soft)}
td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td.nm{font-weight:700;white-space:nowrap}
td.tx{color:var(--fg2);min-width:180px}
td .k{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);font-weight:400}
.badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-num);font-size:11px;font-weight:700;border-radius:9px;padding:0 7px;line-height:18px}
.badge.open{background:var(--foe-soft);color:var(--foe)} .badge.discuss{background:var(--just-soft);color:var(--just)} .badge.done{background:var(--ok-soft);color:var(--ok)} .badge.dropped{background:var(--raised);color:var(--dim)}
.badge.new{background:var(--cy-soft);color:var(--cy)}
/* 右: 編集 */
.side{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.side-h h2{font-size:15px;margin:0;line-height:1.3}
.side-h .k{font-family:var(--f-mono);font-size:11px;color:var(--dim)}
.side-h .x{margin-left:auto}
.side-b{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.empty{color:var(--dim);padding:24px 14px;line-height:1.7}
.preview{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--raised);color:var(--fg2)}
.preview b{color:var(--fg)}
.mode{display:flex;gap:4px}
.mode button{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 10px;font-size:12px;color:var(--fg2)}
.mode button.on{border-color:var(--cy);color:var(--cy);background:var(--cy-soft)}
.grp{display:flex;flex-direction:column;gap:5px}
.grp h3{margin:4px 0 0;font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:.03em}
.fld{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:8px;align-items:center}
.fld label{font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld label i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--dim);margin-left:4px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 7px}
.fld input[type=number]{font-family:var(--f-num);font-weight:600}
.fld textarea{resize:vertical;min-height:52px;line-height:1.5}
.fld.chg input,.fld.chg select,.fld.chg textarea{border-color:var(--cy);background:var(--cy-soft)}
.fld.chg label{color:var(--cy);font-weight:700}
.json{width:100%;min-height:320px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px;resize:vertical}
.err{color:var(--foe);font-size:12px}
.newkey{display:flex;gap:8px;align-items:center}
.newkey input{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--panel);font-family:var(--f-mono)}
/* 送る */
.send{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel);border-radius:0 0 10px 10px}
.diff{display:flex;flex-direction:column;gap:3px;max-height:140px;overflow:auto}
.dl{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:8px;font-size:12px}
.dl .p{font-family:var(--f-mono);font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .v s{color:var(--dim)} .dl .v b{color:var(--cy)}
.send textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel);resize:vertical}
.send .row{display:flex;gap:8px;align-items:center}
.send .row .sp{flex:1;color:var(--dim);font-size:12px}
/* 依頼 */
.reqs{display:flex;flex-direction:column;gap:10px}
.req{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.req.open{border-left:3px solid var(--foe)} .req.discuss{border-left:3px solid var(--just)} .req.done{border-left:3px solid var(--ok)} .req.dropped{opacity:.6}
.req-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req-h .t{font-weight:700}
.req-h .d{font-family:var(--f-num);font-size:11.5px;color:var(--dim);margin-left:auto}
.req-h a{color:var(--cy);cursor:pointer;text-decoration:none;font-weight:700}
.req .cm{white-space:pre-wrap}
.msg{border-radius:6px;padding:6px 9px;white-space:pre-wrap;font-size:12.5px}
.msg.user{background:var(--raised)}
.msg.claude{background:var(--just-soft)}
.msg .w{display:block;font-size:10.5px;color:var(--dim);font-weight:700}
.reply{display:flex;gap:6px}
.reply input{flex:1;min-width:0;border:1px solid var(--line);border-radius:5px;padding:5px 8px;background:var(--panel)}
.filters{display:flex;gap:4px}
.reqpane{flex:1;overflow:auto;min-height:0}
.note{color:var(--dim);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:6px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0;z-index:20;border-radius:0;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
  .side[hidden]{display:none}
  .send{border-radius:0}
  .tabs{margin-left:0}
}
@media (min-width:821px){ .side-h .x{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <h1>Ascendroid データ台帳</h1>
    <span class="ver" id="ver"></span>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main>
    <section class="listwrap" id="listwrap">
      <div class="tools"><input id="q" type="search" placeholder="名前・キーで絞り込む" aria-label="絞り込み"><button class="btn ghost" id="addBtn" type="button">＋ 追加</button></div>
      <div class="tbl" id="tbl"></div>
    </section>
    <aside class="side" id="side"></aside>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="data/parts.js"></script>
<script src="data/cards.js"></script>
<script src="data/enemies.js"></script>
<script src="data/map.js"></script>
<script src="data/classes.js"></script>
<script src="data/text.js"></script>
<script src="meta.js"></script>
<script>
'use strict';
// データ台帳: ゲームの data/*.js をそのまま読み、一覧にする。編集は依頼(requests)として共有データベースに送り、Claude がリポジトリに反映する
const D = window.DATA, META = window.SHEET_META || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));
const K7 = D.classes[D.defaultClass];
const SLOT = Object.fromEntries(D.slots.map(s => [s.id, s.fn]));
const TNAME = {melee:'近接', ranged:'遠隔'};
const ENCNAME = e => e.boss ? 'ボス' : e.elite ? 'エリート' : e.tier === 1 ? '通常(部屋1から)' : '通常(部屋3から)';

/* ---------- 項目の種類 ---------- */
// カードは data/cards.js の値に、K-7 の数値(data/classes.js)を k7 として添える
function cardView(k, c){ const o = clone(c); const ov = K7.cards[k]; if(ov) o.k7 = clone(ov); return o; }
function cardText(c){
  const k = c.k7 || {}, v = {dmg: k.dmg ?? (c.dmg && c.dmg.n), x: c.dmg && c.dmg.x, block: k.block ?? c.block, delay: c.delay, crack: c.crack, draw: c.draw, t: c.timer && c.timer.t,
    tdmg: k.timer ?? (c.timer && c.timer.dmg.n), gain: c.gain, per: k.per ?? (c.spend && (c.spend.dmg ? c.spend.dmg.n : c.spend.block))};
  return esc(c.text || '').replace(/\{(\w+)\}/g, (m, n) => v[n] != null ? `<b>${esc(v[n])}</b>` : m);
}
const cardType = c => c.dmg ? TNAME[c.dmg.t] : c.timer ? TNAME[c.timer.dmg.t] : c.spend && c.spend.dmg ? TNAME[c.spend.dmg.t] : '—';
const unitHp = f => f.units ? Object.values(f.units).map(u => `${u.name || ''} ${u.hp}`).join('・') : f.hp;
const KINDS = [
  {id:'cards', label:'カード', items:() => Object.entries(D.cards).sort((a, b) => a[1].cost - b[1].cost).map(([k, c]) => ({key:k, name:c.name, obj:cardView(k, c)})),
    head:['コスト', '名前', '種類', '効果(K-7)'], cells:it => [`<td class="num">${it.obj.cost}</td>`, nmCell(it), `<td style="white-space:nowrap">${cardType(it.obj)}</td>`, `<td class="tx">${cardText(it.obj)}</td>`],
    preview:o => `<b>${esc(o.name)}</b>(コスト${o.cost}・${cardType(o)})<br>${cardText(o)}`},
  {id:'foes', label:'敵', items:() => Object.entries(D.foes).map(([k, f]) => ({key:k, name:f.name, obj:clone(f)})),
    head:['名前', '耐久', '最初の行動', '行動'], cells:it => [nmCell(it), `<td class="num">${esc(unitHp(it.obj))}</td>`, `<td class="num">${it.obj.start}</td>`, `<td class="tx">${esc(it.obj.pat.map(a => a.n).join(' → '))}</td>`]},
  {id:'parts', label:'パーツ', items:() => Object.entries(D.parts).map(([k, p]) => ({key:k, name:p.name, obj:clone(p)})),
    head:['部位', '名前', '耐久', '効果'], cells:it => [`<td>${esc(SLOT[it.obj.slot])}</td>`, nmCell(it), `<td class="num">${it.obj.max}</td>`, `<td class="tx">${esc(it.obj.text)}</td>`],
    preview:o => `<b>${esc(o.name)}</b>(${esc(SLOT[o.slot])}・耐久${o.max})<br>${esc(o.text)}`},
  {id:'keywords', label:'キーワード', items:() => Object.entries(D.kwName).map(([k, n]) => ({key:k, name:n, obj:{name:n, desc:D.keywords[n]}})),
    head:['名前', '説明'], cells:it => [nmCell(it), `<td class="tx">${esc(it.obj.desc)}</td>`]},
  {id:'events', label:'イベント', items:() => [...D.events, ...(D.transit || [])].map(e => ({key:e.id, name:e.title, obj:clone(e)})),
    head:['タイトル', '選択肢1', '選択肢2', '選択肢3'], cells:it => [nmCell(it), ...[0, 1, 2].map(i => { const c = it.obj.choices[i]; return c ? `<td class="tx"><b>${esc(c.label)}</b> ${esc(c.sub)}</td>` : '<td>—</td>'; })]},
  {id:'areas', label:'エリア', items:() => (D.areas || []).map(A => ({key:A.id, name:A.name, obj:clone(A)})),
    head:['名前', '部屋', '敵の強さ(耐久・攻撃)', 'ボス'], cells:it => [nmCell(it), `<td class="num">${it.obj.rooms}</td>`, `<td class="num">×${it.obj.scale.hp} ・ ×${it.obj.scale.d}</td>`, `<td>${esc((D.encounters[it.obj.boss] || {foes:[]}).foes.map(f => D.foes[f] ? D.foes[f].name : f).join('、'))}</td>`]},
  {id:'encounters', label:'遭遇', items:() => Object.entries(D.encounters).map(([k, e]) => ({key:k, name:e.fam, obj:clone(e)})),
    head:['区分', '系統', '敵'], cells:it => [`<td>${ENCNAME(it.obj)}</td>`, nmCell(it), `<td>${esc(it.obj.foes.map(f => D.foes[f] ? D.foes[f].name : f).join('、'))}</td>`]},
  {id:'alert', label:'警戒度', items:() => D.alert ? [{key:'alert', name:'警戒度', obj:clone(D.alert)}] : [],
    head:['名前', '段', '1段の目盛り', '区画ごとの増減'], cells:it => [nmCell(it), `<td class="num">I〜${it.obj.max}</td>`, `<td class="num">${it.obj.per}</td>`, `<td>${esc(Object.entries(it.obj.gain).map(([k, v]) => `${D.rooms[k] ? D.rooms[k].name : k} ${v > 0 ? '+' : ''}${v}`).join('、'))}</td>`]},
  {id:'classes', label:'キャラ', items:() => Object.entries(D.classes).map(([k, c]) => ({key:k, name:c.name, obj:clone(c)})),
    head:['名前', '補給', '待機'], cells:it => [nmCell(it), `<td>${esc(it.obj.sys)}</td>`, `<td>${it.obj.wait ? 'あり' : 'なし'}</td>`]},
];
const KBY = Object.fromEntries(KINDS.map(k => [k.id, k]));
function nmCell(it){ const n = openCount(S.kind, it.key); return `<td class="nm">${esc(it.name || it.key)}${n ? ` <span class="badge open">${n}</span>` : ''}<span class="k">${esc(it.key)}</span></td>`; }

/* ---------- 項目を平らにする(編集の欄と、差分) ---------- */
const isPrimArr = a => Array.isArray(a) && a.every(v => v === null || typeof v !== 'object');
function flat(o, p = '', out = {}){
  if(o && typeof o === 'object' && !isPrimArr(o) && Object.keys(o).length){
    for(const k of Object.keys(o)) flat(o[k], p ? p + '.' + k : k, out);
  } else if(p) out[p] = o;
  return out;
}
function getPath(o, p){ return p.split('.').reduce((x, k) => x == null ? undefined : x[k], o); }
function setPath(o, p, v){
  const ks = p.split('.'); let x = o;
  for(let i = 0; i < ks.length - 1; i++) x = x[ks[i]];
  const last = ks[ks.length - 1];
  if(v === undefined){ if(Array.isArray(x)) x[+last] = null; else delete x[last]; } else x[last] = v;
}
const show = v => v === undefined ? '(なし)' : typeof v === 'string' ? v : JSON.stringify(v);
function diff(a, b){
  const fa = flat(a), fb = flat(b), out = [];
  for(const p of new Set([...Object.keys(fa), ...Object.keys(fb)])) if(JSON.stringify(fa[p]) !== JSON.stringify(fb[p])) out.push({path:p, from:show(fa[p]), to:show(fb[p])});
  return out;
}
// 欄の名前
const LB = {cost:'コスト', name:'名前', text:'効果文', tgt:'単体を狙う', all:'全体', dmg:'ダメージ', n:'名前・値', t:'種類', x:'回数', block:'ブロック', delay:'ディレイ', crack:'クラック', draw:'引く枚数',
  timer:'遅れて効く', atomic:'アトミック', parry:'受け流し', gain:'充電を得る', spend:'充電を消費', per:'充電1あたり', junk:'ノイズ', k7:'K-7 の数値',
  hp:'耐久', start:'最初の行動まで', kind:'見た目', ai:'行動の選び方', pat:'行動', phase:'耐久が減った後', at:'条件・位置', d:'ダメージ', dl:'コスト', p:'狙う部位', ch:'不安定',
  wind:'体勢', w:'窓', poise:'ブレイクに要る一撃', guard:'防壁', s:'量・大きさ', counter:'反撃', rec:'隙', buff:'増幅', hits:'回数', armor:'装甲', heal:'修復', noise:'ノイズ', haste:'加速', zone:'危険域',
  len:'長さ', wt:'重み', by:'行動するユニット', units:'ユニット', vital:'急所', core:'核', icon:'アイコン', spr:'絵', look:'本体の絵', react:'反応', min:'最小コスト', passives:'パッシブ', pool:'学習で出やすいカード',
  pname:'パッシブの名前', broke:'破壊で変わる行動', sync:'連携', unit:'ユニット', slot:'部位', max:'耐久', fx:'効果の中身', cards:'カード', desc:'説明', title:'タイトル', choices:'選択肢', label:'選択肢の名前', rooms:'部屋数', transfers:'乗り換えの場所', last:'ボスの手前の部屋', scale:'敵の強さの倍率', tiers:'通常戦の段', boss:'ボス', heal:'回復(最大の割合)', strong:'強い組になる警戒度', per:'1段の目盛り', gain:'区画ごとの増減', enemy:'1段ごとの敵の上乗せ', scrap:'1段ごとのスクラップの上乗せ', learnAt:'学習の候補が増える段', partAt:'鹵獲の候補が増える段', alert:'警戒の増減',
  sub:'選択肢の説明', fam:'系統', tier:'段階', elite:'エリート', boss:'ボス', foes:'敵', econ:'補給', r:'サイクル', hand:'枚数', blockReset:'ブロック消去', wait:'待機', sys:'補給の名前', id:'キー',
  melee:'近接+', ranged:'遠隔+', quickMelee:'コスト2以下の近接+', heavyMelee:'コスト4以上の近接+', justCrack:'JUSTでクラック', justDelay:'JUSTでディレイ', handMax:'手札の上限+',
  startBlock:'開始時ブロック', startHand:'開始時に引く', startDelay:'開始時ディレイ', delayedDelay:'ディレイされたらディレイ', zeroDelay:'コスト0でディレイ', v:'量', summon:'増援', type:'種類', keep:'手札を残す', heat:'回数ごとの追加', eject:'排莢', cap:'上限'};
const segLabel = s => /^\d+$/.test(s) ? String(+s + 1) : (LB[s] || s);
function groupLabel(o, parent){
  if(!parent) return '基本';
  const v = getPath(o, parent), lab = parent.split('.').map(segLabel).join(' · ');
  const nm = v && typeof v === 'object' && !Array.isArray(v) ? (v.n || v.name || v.label || v.title) : null;
  return typeof nm === 'string' && nm ? `${lab} — ${nm}` : lab;
}

/* ---------- 状態 ---------- */
const S = {kind:'cards', sel:null, q:'', draft:null, json:false, jsonText:'', jsonErr:'', comment:'', reqFilter:'active', mobileOpen:false};
let DB = null, REQ = [], dbState = 'wait';
const openCount = (kind, key) => REQ.filter(r => r.kind === kind && r.key === key && (r.status === 'open' || r.status === 'discuss')).length;
const kindOpen = kind => REQ.filter(r => r.kind === kind && (r.status === 'open' || r.status === 'discuss')).length;
function curItems(){ return KBY[S.kind].items(); }
function curItem(){ return S.sel ? curItems().find(it => it.key === S.sel) : null; }

/* ---------- 描く ---------- */
function renderTabs(){
  const all = REQ.filter(r => r.status === 'open' || r.status === 'discuss').length;
  $('#tabs').innerHTML = KINDS.map(k => { const n = kindOpen(k.id); return `<button class="tab${S.kind === k.id ? ' on' : ''}" type="button" data-tab="${k.id}">${k.label}${n ? `<span class="n">${n}</span>` : ''}</button>`; }).join('')
    + `<button class="tab${S.kind === 'requests' ? ' on' : ''}" type="button" data-tab="requests">依頼${all ? `<span class="n">${all}</span>` : ''}</button>`;
}
function renderList(){
  const req = S.kind === 'requests';
  $('#listwrap').querySelector('.tools').hidden = req;
  if(req){ $('#tbl').innerHTML = `<div class="reqpane" style="padding:10px">${renderReqPane()}</div>`; return; }
  const K = KBY[S.kind], q = S.q.trim().toLowerCase();
  const items = curItems().filter(it => !q || (it.name || '').toLowerCase().includes(q) || it.key.toLowerCase().includes(q));
  $('#tbl').innerHTML = `<table><thead><tr>${K.head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${items.map(it => `<tr class="row${S.sel === it.key ? ' sel' : ''}" data-key="${esc(it.key)}" tabindex="0">${K.cells(it).join('')}</tr>`).join('')}</tbody></table>`;
}
function fieldHTML(p, v, orig){
  const last = p.split('.').pop(), chg = JSON.stringify(v) !== JSON.stringify(getPath(orig, p)), id = 'f-' + p.replace(/[^\w]/g, '_');
  let input;
  if(typeof v === 'boolean') input = `<input id="${id}" type="checkbox" data-path="${esc(p)}" data-t="bool"${v ? ' checked' : ''}>`;
  else if(typeof v === 'number') input = `<input id="${id}" type="number" step="any" data-path="${esc(p)}" data-t="num" value="${v}">`;
  else if(last === 'p' && typeof v === 'string' && SLOT[v]) input = `<select id="${id}" data-path="${esc(p)}" data-t="str">${Object.entries(SLOT).map(([k, n]) => `<option value="${k}"${k === v ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
  else if(last === 't' && (v === 'melee' || v === 'ranged')) input = `<select id="${id}" data-path="${esc(p)}" data-t="str">${Object.entries(TNAME).map(([k, n]) => `<option value="${k}"${k === v ? ' selected' : ''}>${n}</option>`).join('')}</select>`;
  else if(typeof v === 'string') input = v.length > 22 ? `<textarea id="${id}" data-path="${esc(p)}" data-t="str">${esc(v)}</textarea>` : `<input id="${id}" type="text" data-path="${esc(p)}" data-t="str" value="${esc(v)}">`;
  else if(isPrimArr(v)) input = `<input id="${id}" type="text" data-path="${esc(p)}" data-t="arr" value="${esc(v.join(', '))}">`;
  else input = `<input id="${id}" type="text" data-path="${esc(p)}" data-t="json" value="${esc(JSON.stringify(v))}">`;
  const lab = last === 'n' ? (typeof v === 'number' ? '値' : '名前') : segLabel(last);
  return `<div class="fld${chg ? ' chg' : ''}"><label for="${id}" title="${esc(p)}">${esc(lab)}<i>${esc(last)}</i></label>${input}</div>`;
}
function renderSide(){
  const side = $('#side');
  if(S.kind === 'requests'){ side.innerHTML = `<div class="empty">依頼の一覧は左にあります。項目を選ぶと、その項目の依頼も見られます。</div>`; side.hidden = innerWidth <= 820; return; }
  const it = curItem(), K = KBY[S.kind];
  side.hidden = innerWidth <= 820 && !S.mobileOpen;
  if(!it && !(S.draft && S.draft.isNew)){
    side.innerHTML = `<div class="empty">一覧から項目を選ぶと、ここで数値や文を書き換えられます。書き換えたら、下にコメントを添えて「送る」で依頼になります。数値を変えずにコメントだけ送れば相談になります。</div>`;
    return;
  }
  const orig = S.draft.isNew ? {} : it.obj, o = S.draft.obj;
  let body = '';
  if(K.preview) body += `<div class="preview" id="pv"></div>`;
  if(S.draft.isNew) body += `<div class="newkey"><label for="newkey">キー</label><input id="newkey" type="text" value="${esc(S.draft.key)}" placeholder="英字のキー(例 overdrive)"></div>`;
  body += `<div class="mode"><button type="button" data-mode="form" class="${S.json ? '' : 'on'}">欄で編集</button><button type="button" data-mode="json" class="${S.json ? 'on' : ''}">JSON で編集</button></div>`;
  if(S.json) body += `<textarea class="json" id="jsonbox" spellcheck="false">${esc(S.jsonText)}</textarea><div id="jsonmsg"></div>`;
  else {
    const f = flat(o), groups = {};
    for(const p of Object.keys(f)){ const parent = p.includes('.') ? p.slice(0, p.lastIndexOf('.')) : ''; (groups[parent] = groups[parent] || []).push(p); }
    body += Object.entries(groups).map(([g, ps]) => `<div class="grp"><h3>${esc(groupLabel(o, g))}</h3>${ps.map(p => fieldHTML(p, f[p], orig)).join('')}</div>`).join('');
  }
  if(!S.draft.isNew){
    const rs = REQ.filter(r => r.kind === S.kind && r.key === it.key).sort((a, b) => (b.at || '').localeCompare(a.at || ''));
    if(rs.length) body += `<div class="grp"><h3>この項目の依頼</h3><div class="reqs">${rs.map(r => reqHTML(r, false)).join('')}</div></div>`;
  }
  const title = S.draft.isNew ? `${K.label}を追加` : esc(it.name || it.key);
  side.innerHTML = `<div class="side-h"><div><h2>${title}</h2>${S.draft.isNew ? '' : `<span class="k">${esc(S.kind)} · ${esc(it.key)}</span>`}</div><button class="btn quiet x" type="button" id="closeSide">閉じる</button></div>
    <div class="side-b" id="sideb">${body}</div>
    <div class="send">
      <div class="diff" id="diffbox"></div>
      <textarea id="comment" placeholder="コメント(なぜ変えたいか、迷っている点など。数値を変えずに送ると相談になります)">${esc(S.comment)}</textarea>
      <div class="row"><span class="sp" id="sendinfo"></span>
        <button class="btn quiet" type="button" id="resetDraft" hidden>元に戻す</button>
        <button class="btn" type="button" id="sendBtn" disabled>送る</button></div>
    </div>`;
  refreshDyn();
}
// 入力のたびに、描き直さずに変わるところだけ更新する(描き直すとスマホのキーボードが閉じる)
function refreshDyn(){
  if(!S.draft || S.kind === 'requests') return;
  const K = KBY[S.kind], it = curItem(), orig = S.draft.isNew ? {} : (it ? it.obj : {}), o = S.draft.obj;
  const pv = $('#pv'); if(pv) pv.innerHTML = o && typeof o === 'object' ? K.preview(o) : '';
  const jm = $('#jsonmsg'); if(jm) jm.innerHTML = S.jsonErr ? `<div class="err">${esc(S.jsonErr)}</div>` : '<div class="note">欄にない項目を足すときや、行動を増やすときはこちら。</div>';
  const ch = S.draft.isNew ? [] : diff(orig, o);
  const db = $('#diffbox'); if(db){ db.innerHTML = ch.map(c => `<div class="dl"><span class="p" title="${esc(c.path)}">${esc(c.path)}</span><span class="v"><s>${esc(c.from)}</s> → <b>${esc(c.to)}</b></span></div>`).join(''); db.hidden = !ch.length; }
  const si = $('#sendinfo'); if(si) si.textContent = dbState === 'off' ? 'この表示では送れません(サインインして開いてください)' : ch.length ? `変更 ${ch.length} か所` : S.draft.isNew ? '新しい項目' : '';
  const rs = $('#resetDraft'); if(rs) rs.hidden = !ch.length;
  const sb = $('#sendBtn'); if(sb) sb.disabled = !(DB && !S.jsonErr && (S.draft.isNew ? S.draft.key.trim() : (ch.length || S.comment.trim())));
  if(!S.json) document.querySelectorAll('#sideb .fld').forEach(f => { const inp = f.querySelector('[data-path]'); if(!inp) return; const p = inp.dataset.path; f.classList.toggle('chg', JSON.stringify(getPath(o, p)) !== JSON.stringify(getPath(orig, p))); });
}
const STATUS = {open:'未対応', discuss:'相談中', done:'反映済み', dropped:'見送り'};
const fmt = iso => { if(!iso) return ''; const d = new Date(iso); if(isNaN(d)) return ''; const z = n => String(n).padStart(2, '0'); return `${z(d.getMonth() + 1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
function reqHTML(r, withItem){
  const K = KBY[r.kind];
  const item = withItem ? (r.kind === 'general' ? '<span class="t">全体</span>' : `<a data-goto="${esc(r.kind)}|${esc(r.key || '')}">${esc(K ? K.label : r.kind)}${r.label ? ' · ' + esc(r.label) : ''}</a>`) : '';
  const ch = (r.changes || []).map(c => `<div class="dl"><span class="p" title="${esc(c.path)}">${esc(c.path)}</span><span class="v"><s>${esc(c.from)}</s> → <b>${esc(c.to)}</b></span></div>`).join('');
  const thread = (r.thread || []).map(m => `<div class="msg ${m.who === 'claude' ? 'claude' : 'user'}"><span class="w">${m.who === 'claude' ? 'Claude' : 'あなた'} · ${fmt(m.at)}</span>${esc(m.text)}</div>`).join('');
  return `<div class="req ${esc(r.status)}" data-req="${esc(r.id)}">
    <div class="req-h"><span class="badge ${esc(r.status)}">${STATUS[r.status] || r.status}</span>${r.type === 'new' ? '<span class="badge new">追加</span>' : r.type === 'note' ? '<span class="badge dropped">相談</span>' : ''}${item}<span class="d">${fmt(r.at)}${r.version ? ' · ' + esc(r.version) : ''}</span></div>
    ${ch ? `<div class="diff">${ch}</div>` : ''}${r.type === 'new' && r.obj ? `<div class="note">キー ${esc(r.key)}: <code>${esc(JSON.stringify(r.obj)).slice(0, 300)}</code></div>` : ''}
    ${r.comment ? `<div class="cm">${esc(r.comment)}</div>` : ''}${thread}
    ${r.status === 'done' || r.status === 'dropped' ? '' : `<div class="reply"><input type="text" data-reply="${esc(r.id)}" placeholder="返信" aria-label="返信"><button class="btn quiet" type="button" data-send-reply="${esc(r.id)}">返信</button><button class="btn quiet" type="button" data-drop="${esc(r.id)}">取り下げ</button></div>`}
  </div>`;
}
function renderReqPane(){
  const f = S.reqFilter, rs = REQ.filter(r => f === 'all' || (f === 'active' ? r.status === 'open' || r.status === 'discuss' : r.status === f)).sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  const fl = [['active', '対応待ち'], ['done', '反映済み'], ['all', 'すべて']].map(([k, n]) => `<button type="button" class="btn ${S.reqFilter === k ? '' : 'quiet'}" data-rf="${k}">${n}</button>`).join('');
  const general = `<div class="req"><div class="req-h"><span class="t">項目によらない依頼・相談</span></div><textarea id="generalText" placeholder="例: 新しいアーキタイプ「侵食」を作りたい。カード案は…" style="width:100%;min-height:60px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel)"></textarea><div class="reply"><span class="sp" style="flex:1"></span><button class="btn" type="button" id="sendGeneral"${DB ? '' : ' disabled'}>送る</button></div></div>`;
  return `<div class="reqs"><div class="filters">${fl}</div>${general}${rs.length ? rs.map(r => reqHTML(r, true)).join('') : `<div class="note">${dbState === 'wait' ? '読み込み中…' : dbState === 'off' ? 'この表示では依頼を読めません。' : 'まだ依頼はありません。'}</div>`}</div>`;
}
function renderAll(){ document.querySelector('main').classList.toggle('wide', S.kind === 'requests'); renderTabs(); renderList(); renderSide(); }

/* ---------- 編集 ---------- */
function startDraft(it){ S.draft = {isNew:false, key:it.key, obj:clone(it.obj)}; S.json = false; S.jsonErr = ''; S.comment = ''; }
function selectItem(key){
  const it = curItems().find(x => x.key === key); if(!it) return;
  if(S.draft && !S.draft.isNew && S.draft.key === key){ S.mobileOpen = true; renderAll(); return; }
  S.sel = key; startDraft(it); S.mobileOpen = true; renderAll();
}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
async function send(){
  if(!DB) return;
  const K = KBY[S.kind], it = curItem(), now = new Date().toISOString();
  let doc;
  if(S.draft.isNew){
    const key = S.draft.key.trim(); if(!key) return;
    doc = {at:now, kind:S.kind, key, label:(S.draft.obj && (S.draft.obj.name || S.draft.obj.title)) || key, type:'new', obj:S.draft.obj, changes:[], comment:S.comment.trim(), status:'open', thread:[]};
  } else {
    const ch = diff(it.obj, S.draft.obj);
    doc = {at:now, kind:S.kind, key:it.key, label:it.name || it.key, type:ch.length ? 'edit' : 'note', changes:ch, comment:S.comment.trim(), status:'open', thread:[]};
  }
  const btn = $('#sendBtn'); if(btn) btn.disabled = true;
  try{ await DB.collection('requests').add(doc); S.comment = ''; if(S.draft.isNew){ S.draft = null; S.sel = null; } else startDraft(it); toast('送りました'); }
  catch(e){ toast(e && e.code === 'quota_exceeded' ? '保存できる件数の上限です' : '送れませんでした。もう一度試してください'); }
  renderAll();
}
async function sendGeneral(){
  const t = ($('#generalText').value || '').trim(); if(!t || !DB) return;
  try{ await DB.collection('requests').add({at:new Date().toISOString(), kind:'general', key:'', label:'', type:'note', changes:[], comment:t, status:'open', thread:[]}); toast('送りました'); }
  catch(e){ toast('送れませんでした。もう一度試してください'); }
  renderAll();
}
async function reply(id){
  const r = REQ.find(x => x.id === id), inp = document.querySelector(`[data-reply="${CSS.escape(id)}"]`); if(!r || !inp || !DB) return;
  const t = inp.value.trim(); if(!t) return;
  try{ await DB.doc('requests/' + id).update({thread:[...(r.thread || []), {who:'user', text:t, at:new Date().toISOString()}], status:'open'}); toast('返信しました'); }
  catch(e){ toast('送れませんでした'); }
}
async function drop(id){
  if(!DB) return;
  try{ await DB.doc('requests/' + id).update({status:'dropped'}); toast('取り下げました'); } catch(e){ toast('変更できませんでした'); }
}

/* ---------- 入力 ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('[data-tab]'); if(tab){ S.kind = tab.dataset.tab; S.sel = null; S.draft = null; S.mobileOpen = false; S.q = ''; $('#q').value = ''; renderAll(); return; }
  const row = t.closest('tr.row'); if(row){ selectItem(row.dataset.key); return; }
  const md = t.closest('[data-mode]'); if(md){ setMode(md.dataset.mode === 'json'); return; }
  const rf = t.closest('[data-rf]'); if(rf){ S.reqFilter = rf.dataset.rf; renderList(); return; }
  const go = t.closest('[data-goto]'); if(go){ const [k, key] = go.dataset.goto.split('|'); if(KBY[k]){ S.kind = k; S.draft = null; renderAll(); if(key) selectItem(key); } return; }
  const sr = t.closest('[data-send-reply]'); if(sr){ reply(sr.dataset.sendReply); return; }
  const dr = t.closest('[data-drop]'); if(dr){ drop(dr.dataset.drop); return; }
  if(t.closest('#sendBtn')){ send(); return; }
  if(t.closest('#sendGeneral')){ sendGeneral(); return; }
  if(t.closest('#resetDraft')){ const it = curItem(); if(it){ startDraft(it); renderSide(); } return; }
  if(t.closest('#closeSide')){ S.mobileOpen = false; renderSide(); return; }
  if(t.closest('#addBtn')){ const it = curItem(); S.draft = {isNew:true, key:'', obj:it ? clone(it.obj) : {}}; S.sel = null; S.json = true; S.jsonText = JSON.stringify(S.draft.obj, null, 2); S.jsonErr = ''; S.comment = ''; S.mobileOpen = true; renderAll(); return; }
});
document.addEventListener('keydown', e => { if(e.key === 'Enter'){ const row = e.target.closest && e.target.closest('tr.row'); if(row) selectItem(row.dataset.key); } });
function setMode(json){
  if(json === S.json) return;
  if(json){ S.jsonText = JSON.stringify(S.draft.obj, null, 2); S.jsonErr = ''; }
  else if(S.jsonErr) return;
  S.json = json; renderSide();
}
// 欄・JSON・コメントの入力は、描き直さずに状態と差分の表示だけ更新する
const later = () => refreshDyn();
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ S.q = t.value; renderList(); return; }
  if(t.id === 'comment'){ S.comment = t.value; refreshDyn(); return; }
  if(t.id === 'newkey'){ S.draft.key = t.value; later(); return; }
  if(t.id === 'jsonbox'){ S.jsonText = t.value; try{ S.draft.obj = JSON.parse(t.value); S.jsonErr = ''; }catch(err){ S.jsonErr = 'JSON の書き方が崩れています: ' + err.message; } later(); return; }
  if(t.dataset.path){
    const p = t.dataset.path, ty = t.dataset.t; let v;
    if(ty === 'bool') v = t.checked;
    else if(ty === 'num') v = t.value === '' ? undefined : Number(t.value);
    else if(ty === 'arr') v = t.value.split(/[,、]\s*/).map(s => s.trim()).filter(Boolean).map(s => /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : s);
    else if(ty === 'json'){ try{ v = JSON.parse(t.value); }catch(_){ return; } }
    else v = t.value;
    setPath(S.draft.obj, p, v); later();
  }
});
// 画面の大きさが変わっても描き直さない(スマホではキーボードが開くと大きさが変わる)
addEventListener('resize', () => { const side = $('#side'); if(S.kind === 'requests') side.hidden = innerWidth <= 820; else side.hidden = innerWidth <= 820 && !S.mobileOpen; });

const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== 'q'; };
document.addEventListener('focusout', () => setTimeout(() => { if(S.pending && !typing()){ S.pending = false; renderAll(); } }, 400));
/* ---------- 共有データベース(依頼) ---------- */
$('#ver').textContent = META.version ? `ゲーム ${META.version}${META.commit ? ' · ' + META.commit : ''}` : '';
renderAll();
(async () => {
  const use = window.claude && window.claude.use;
  DB = use ? await window.claude.use('db') : null;
  if(!DB){ dbState = 'off'; renderAll(); return; }
  // 入力中(キーボードが開いている間)は描き直さず、入力を離れてから描き直す
  DB.collection('requests').onSnapshot(s => { REQ = s.docs.map(d => Object.assign({id:d.id}, d.data())); dbState = 'on'; if(typing()){ S.pending = true; renderTabs(); refreshDyn(); } else renderAll(); },
    () => { dbState = 'off'; DB = null; renderAll(); });
})();
</script>
