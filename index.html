<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>塔の戦闘試作2</title>
<meta name="theme-color" content="#0f0e13">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: a fixed 844x390 phone-landscape stage scaled to fit. The timeline is the board: "now" at left by the android, enemy lanes flow right-to-left toward it.
   Color carries meaning only: amber = time, teal = self, red = threat, violet = opportunity (charge/JUST). Everything else stays low-chroma. */
:root{
  --bg:#0f0e13; --lane:rgba(255,255,255,.03); --panel:#18161f; --panel2:#141219; --line:#2c2836; --grid:#24212d;
  --fg:#e9e6ef; --fg2:#c9c3d3; --dim:#8a8496; --dim2:#5f5a6b;
  --time:#f2a33a; --time-dim:#7d6c4d; --me:#3fd0c0; --foe:#ff4d5e; --foe2:#ff8a95; --just:#b48cff;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Chakra Petch","BIZ UDPGothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#rot{display:none;position:absolute;left:0;right:0;top:12px;text-align:center;color:var(--time);font-size:13px}
@media (orientation:portrait){#rot{display:block}}
#stage{position:absolute;left:50%;top:50%;width:844px;height:390px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--bg);font-size:11px;line-height:1.35;overflow:hidden}
#stage *{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;padding:0;margin:0;background:none;border:0;text-align:left}
button:focus-visible{outline:2px solid var(--time);outline-offset:2px}
.num{font-family:var(--f-num)}
.time{color:var(--time)} .me{color:var(--me)} .foe{color:var(--foe)} .foe2{color:var(--foe2)} .just{color:var(--just)} .dim{color:var(--dim2)}
.nopt{pointer-events:none}
[hidden]{display:none!important}

/* top bar */
#top{position:absolute;left:10px;top:4px;width:824px;height:22px;display:flex;align-items:center;gap:12px}
#menuBtn{width:30px;height:22px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--dim);display:flex;align-items:center;justify-content:center;flex:none}
#where{color:var(--dim);white-space:nowrap;flex:none}
#msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim2)}
#msg.pv{color:var(--fg2)}
#msg b{font-weight:700}
.bl{color:var(--dim);flex:none}
.bbar{width:56px;height:4px;background:var(--grid);border-radius:2px;overflow:hidden;flex:none}
.bbar i{display:block;height:100%;background:var(--dim);transition:width .25s}
#bodyNum{font-size:11px;color:#a9a3b4;flex:none;min-width:38px;text-align:right}

#chips{position:absolute;left:10px;top:30px;display:flex;gap:6px}
.chip{height:15px;padding:0 6px;border:1px solid;border-radius:3px;font-size:10px;font-weight:700;line-height:13px;display:flex;gap:4px;align-items:center}
.chip.blk{color:var(--me);border-color:var(--me)}
.chip.blk.zero{color:var(--dim2);border-color:var(--line)}
.chip.sw{color:var(--time);border-color:var(--time)}

/* timeline */
.lane{position:absolute;left:200px;width:634px;height:62px;border-radius:6px;background:var(--lane);border:1.5px solid transparent;transition:background .2s}
.lane.dead{opacity:.3}
.lane.tgt{border-color:var(--me)}
.lane.can{border:1.5px dashed rgba(63,208,192,.35)}
.lane.act{background:rgba(255,77,94,.14)}
.tl{position:absolute;top:45px;width:1px;height:213px;background:var(--grid)}
.tl.now{width:2px;background:var(--time)}
.tn{position:absolute;top:31px;width:20px;text-align:center;font-family:var(--f-num);font-size:10px;font-weight:500;color:var(--time-dim)}
.tn.now{color:var(--time);font-weight:700;font-size:11px}
#noise{position:absolute;top:45px;height:213px;background:repeating-linear-gradient(135deg,rgba(15,14,19,.92) 0 5px,rgba(36,33,45,.92) 5px 7px);display:flex;align-items:center;justify-content:center;color:var(--foe2);font-size:10px;font-weight:700;writing-mode:vertical-rl;letter-spacing:.1em}
#pvRegion{position:absolute;left:206px;top:45px;height:213px;background:rgba(63,208,192,.07)}
#pvLine{position:absolute;top:45px;width:2px;height:213px;background:var(--me)}
#selfBar{position:absolute;left:206px;top:46px;height:12px;display:flex;align-items:center;overflow:visible;transition:width .24s linear}
#selfBar span{padding-left:5px;font-size:9.5px;font-weight:700;white-space:nowrap;color:#e9fffb}
#selfBar.pre{background:rgba(63,208,192,.3);border-right:2px solid var(--me)}
#selfBar.cast{background:rgba(63,208,192,.55);border-right:2px solid var(--me)}

.mk{position:absolute;width:38px;height:26px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:5px;border:1.5px solid var(--foe);background:#2a1419;color:#ffdade;transition:left .24s linear,top .24s,opacity .22s,transform .22s,box-shadow .15s}
.mk b{font-family:var(--f-num);font-size:14px;font-weight:700}
.mk span{font-size:10px}
.mk.later{opacity:.5}
.mk.ch{border-color:var(--just);background:#221a36;color:#ece4ff;border-radius:13px}
.mk.dl{color:var(--time)}
.mk.danger{box-shadow:0 0 0 3px rgba(255,77,94,.42)}
.mk.just{background:var(--just);color:#1a1030;box-shadow:0 0 14px rgba(180,140,255,.8)}
.mk .lb{position:absolute;top:-15px;left:-6px;right:-6px;text-align:center;font-style:normal;font-size:9px;font-weight:700;color:var(--just)}
.mk.dl .lb{color:var(--time)}
.mk.out{opacity:0!important;transform:scale(1.5)}

/* enemy panels */
.fp{position:absolute;left:664px;width:166px;height:50px;display:flex;gap:8px;align-items:center}
.fp.dead{opacity:.35}
.fart{width:50px;height:50px;flex:none;border:1px solid var(--line);border-radius:6px;background:repeating-linear-gradient(135deg,#1c1a23 0 6px,#17151d 6px 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim2);font-size:9px}
.fart b{font-family:var(--f-num);font-size:16px;color:var(--dim)}
.fb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fname{display:flex;justify-content:space-between;gap:4px;font-size:11px;font-weight:700;white-space:nowrap}
.fnm{overflow:hidden;text-overflow:ellipsis}
.tchip{font-size:9px;color:var(--bg);background:var(--me);border-radius:3px;padding:0 4px;line-height:14px;flex:none}
.hpb{display:block;height:5px;background:var(--grid);border-radius:3px;overflow:hidden;position:relative}
.hpb i{position:absolute;left:0;top:0;bottom:0;background:var(--foe);transition:width .25s}
.hpb s{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--foe) 0 2px,transparent 2px 4px)}
.frow{display:flex;gap:4px;align-items:center}
.hpt{font-size:11px;color:var(--fg2)}
.st{font-size:9px;color:var(--fg2);border:1px solid #4a4458;border-radius:3px;padding:0 3px;line-height:13px}
.st.c{color:var(--foe2);border-color:rgba(255,77,94,.5)}

/* parts */
.part{position:absolute;left:72px;width:126px;height:35px;padding:3px 0 0 8px;border-left:2px solid var(--line);transition:background .2s}
.part.ih{border-left-color:var(--foe)}
.part.ic{border-left-color:var(--just)}
.part.hit{background:rgba(255,77,94,.18)}
.ph{display:flex;align-items:baseline;justify-content:space-between;padding-right:2px}
.pn{font-size:11px;font-weight:700;white-space:nowrap}
.pn em{font-style:normal;font-weight:400;font-size:9.5px;color:var(--dim);margin-left:3px}
.ptag{text-decoration:none;font-weight:700;font-size:9px;margin-left:4px;color:var(--foe2)}
.part.broken .pn{color:var(--dim2)}
.part.broken .ptag{color:var(--bg);background:var(--foe);border-radius:3px;padding:0 3px}
.pnum{font-family:var(--f-num);font-size:11px;font-weight:600}
.pb{display:flex;align-items:center;gap:4px;margin-top:3px}
.pbar{position:relative;display:block;width:50px;height:5px;background:var(--grid);border-radius:2px;overflow:hidden;flex:none}
.pf{position:absolute;left:0;top:0;bottom:0;background:var(--me);transition:width .25s}
.pl{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--foe) 0 2px,transparent 2px 4px)}
.pinc{border-radius:3px;font-size:9.5px;font-weight:700;padding:0 4px;height:14px;line-height:12px;white-space:nowrap;border:1px solid}
.pinc.h{background:#2a1419;color:#ffdade;border-color:var(--foe)}
.pinc.c{background:#221a36;color:#ece4ff;border-color:var(--just)}
.pinc.j{background:var(--just);color:#1a1030;border-color:var(--just)}

/* hand */
.pile{position:absolute;left:10px;width:58px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--dim);font-size:9.5px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pile b{font-family:var(--f-num);font-size:13px;color:#a9a3b4}
.card{position:absolute;top:268px;width:120px;height:116px;overflow:hidden;border-radius:8px;background:var(--panel);border:1px solid var(--line);transition:top .15s,border-color .15s,box-shadow .15s}
.card.sel{top:260px;border:1.5px solid var(--me);box-shadow:0 8px 18px rgba(63,208,192,.22)}
.card:disabled{opacity:.55;cursor:default}
.card.static{position:relative;top:auto}
.cart{position:relative;display:flex;align-items:center;justify-content:center;height:44px;background:repeating-linear-gradient(135deg,#1f1c27 0 6px,#1a1821 6px 12px);color:var(--dim2);font-size:9px}
.cost{position:absolute;left:5px;top:5px;width:24px;height:24px;border:1.5px solid var(--time);border-radius:12px;background:var(--bg);color:var(--time);font-family:var(--f-num);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ctype{position:absolute;right:6px;top:5px;font-size:9px;color:var(--dim)}
.cname{display:block;padding:5px 7px 0;font-size:12px;font-weight:700;white-space:nowrap}
.ctext{display:block;padding:2px 7px 0;font-size:10.5px;color:var(--fg2)}
.ctext b{font-weight:700}
.ctext .up{color:var(--me)}
.kw-me{font-weight:700;color:var(--me)} .kw-t{font-weight:700;color:var(--time)} .kw-f{font-weight:700;color:var(--foe2)}
.katom{display:inline-block;margin:3px 0 0 7px;font-size:9.5px;font-weight:700;border:1px solid #4a4458;border-radius:3px;padding:0 4px;line-height:14px}
.csrc{position:absolute;right:7px;bottom:5px;font-size:9px;color:var(--dim2)}
#redraw{position:absolute;left:718px;top:268px;width:116px;height:116px;border:1.5px solid var(--time);border-radius:8px;background:#1d170f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:top .15s,box-shadow .15s}
#redraw.sel{top:260px;box-shadow:0 8px 18px rgba(242,163,58,.22)}
#redraw:disabled{opacity:.45;cursor:default}
#redraw .t1{font-size:12px;font-weight:700}
#redraw .t2{font-family:var(--f-num);font-size:28px;line-height:1.1;color:var(--time);font-weight:700}
#redraw .t3{font-size:10px;color:#a9a3b4}
#redraw .t4{font-size:9px;color:var(--dim2);margin-top:3px}

/* fx */
.float{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--f-num);font-weight:700;font-size:16px;white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000;animation:rise .95s ease-out forwards;z-index:40}
.float.foe{color:var(--foe2)} .float.me{color:var(--me)} .float.time{color:var(--time);font-size:13px} .float.just{color:var(--just);font-size:22px} .float.dim{color:var(--dim);font-size:12px}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
#toast{position:absolute;left:0;right:0;top:132px;text-align:center;font-size:20px;font-weight:700;letter-spacing:.12em;opacity:0;pointer-events:none;z-index:41;text-shadow:0 0 10px #000}
#toast.show{animation:toast 1.7s ease-out}
@keyframes toast{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}

/* overlay */
#ov{position:absolute;inset:0;background:rgba(8,7,11,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#ov[hidden]{display:none!important}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;max-width:560px;width:100%;max-height:362px;overflow:auto}
.box h2{font-size:16px;margin:0 0 4px;letter-spacing:.04em}
.box .sub{color:var(--dim);margin:0 0 8px}
.box .eff{font-size:12px;margin:6px 0 10px;color:var(--fg)}
.box ul,.box ol{margin:0 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.box li.cur{color:var(--time)}
.gl{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:10.5px}
.gl dt{font-weight:700;color:var(--fg2)} .gl dd{margin:0;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--time);background:var(--time);color:#22170a;font-weight:700;border-radius:6px;padding:7px 16px;text-align:center}
.btn.ghost{background:transparent;color:var(--time)}
.opts{display:flex;gap:10px;justify-content:center;margin:8px 0 12px;flex-wrap:wrap}
.opts.col{flex-direction:column;align-items:stretch}
.opt{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:12px}
.opt span{color:var(--dim)}
.opt:disabled{opacity:.4;cursor:default}
.dk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){#stage *{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <div id="rot">横画面にすると大きく表示されます</div>
  <div id="stage">
    <div id="lanes"></div>
    <div id="ticks" class="nopt"></div>
    <div id="noise" class="nopt" hidden>演算破損 先読み不能</div>
    <div id="pvRegion" class="nopt" hidden></div>
    <div id="pvLine" class="nopt" hidden></div>
    <div id="selfBar" class="nopt" hidden><span></span></div>
    <div id="marks" class="nopt"></div>
    <div id="foes"></div>

    <svg style="position:absolute;left:6px;top:58px" width="70" height="196" viewBox="0 0 70 196" role="img" aria-label="アンドロイドの絵(仮)">
      <rect x="23" y="4" width="24" height="24" rx="6" fill="#17151d" stroke="#3d3849" stroke-width="1.5"/>
      <path d="M31 28v6h8v-6" fill="none" stroke="#3d3849" stroke-width="1.5"/>
      <path d="M18 36h34l-4 52H22z" fill="#17151d" stroke="#3d3849" stroke-width="1.5"/>
      <path d="M16 38l-8 50M54 38l8 50" fill="none" stroke="#3d3849" stroke-width="5" stroke-linecap="round"/>
      <path d="M27 92l-4 96M43 92l4 96" fill="none" stroke="#3d3849" stroke-width="6" stroke-linecap="round"/>
      <text x="35" y="194" text-anchor="middle" font-size="9" fill="#5f5a6b" font-family="Chakra Petch, sans-serif">K-7 絵</text>
    </svg>
    <div id="parts"></div>

    <button class="pile" id="pileDraw" type="button" style="top:286px">山札<b id="nDraw">0</b></button>
    <button class="pile" id="pileDisc" type="button" style="top:328px">捨て札<b id="nDisc">0</b></button>
    <div id="hand"></div>
    <button id="redraw" type="button"><span class="t1">引き直し</span><span class="t2" id="rdCost">5</span><span class="t3">サイクル</span><span class="t4">残りの手札の枚数</span></button>

    <div id="top">
      <button id="menuBtn" type="button" data-act="menu" aria-label="メニュー"><svg width="14" height="10" viewBox="0 0 14 10" aria-hidden="true"><path d="M0 1h14M0 5h14M0 9h14" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
      <span id="where"></span>
      <span id="msg"></span>
      <span class="bl">本体</span><span class="bbar"><i id="bodyFill"></i></span><span id="bodyNum" class="num"></span>
    </div>
    <div id="chips"></div>

    <div id="floats"></div>
    <div id="toast"></div>
    <div id="ov" hidden><div class="box" id="ovbox"></div></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const X0 = 206, PX = 36.2, xs = c => X0 + c * PX, laneTop = i => 60 + i * 66;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, RM ? Math.min(ms, 60) : ms));
const TICK = 270;

const PARTS = [
  {id:'calc', fn:'演算', pt:'', ab:'演', name:'〘標準演算核〙', max:5, text:'タイムラインを12サイクル先まで見る。破損すると6サイクル先までしか見えない。'},
  {id:'arm',  fn:'武装', pt:'', ab:'武', name:'〘CXR34レールガン〙', max:6, text:'光学威力+1。《チャージショット》2枚をデッキに加える。'},
  {id:'out',  fn:'出力', pt:'腕部', ab:'出', name:'〘汎用マニピュレータ〙', max:7, text:'物理威力+1。'},
  {id:'dur',  fn:'耐久', pt:'基体', ab:'耐', name:'〘標準フレーム〙', max:9, text:'ブロックを得るとき、+1。'},
  {id:'mob',  fn:'機動', pt:'脚部', ab:'機', name:'〘デトロイト噴射機構〙', max:6, text:'戦闘開始時、スウィフト2。自分がディレイされたとき、スウィフト1を得る。'},
];
const PART_BY = Object.fromEntries(PARTS.map(p => [p.id, p]));

const CARDS = {
  jab:      {name:'ジャブ', cost:1, tgt:true, dmg:{t:'phys', n:3}},
  rapid:    {name:'速射', cost:1, tgt:true, dmg:{t:'phys', n:1, x:2}},
  slash:    {name:'スラッシュ', cost:2, tgt:true, dmg:{t:'phys', n:7}},
  blow:     {name:'過負荷打撃', cost:4, tgt:true, dmg:{t:'phys', n:16}},
  charge:   {name:'チャージショット', cost:3, tgt:true, atomic:true, dmg:{t:'opt', n:8}, src:'レールガン'},
  emp:      {name:'EMPパルス', cost:3, all:true, dmg:{t:'opt', n:4}},
  crackshot:{name:'亀裂弾', cost:2, tgt:true, dmg:{t:'opt', n:2}, crack:2},
  guard:    {name:'障壁展開', cost:1, block:4},
  wall:     {name:'防御姿勢', cost:2, block:9},
  hack:     {name:'遅延ハック', cost:1, tgt:true, delay:2},
  backflow: {name:'逆流', cost:2, all:true, delay:2},
  overclock:{name:'オーバークロック', cost:1, swift:3},
};
const START_DECK = ['jab','jab','jab','slash','slash','blow','guard','guard','guard','hack','hack','charge','charge'];

const FOES = {
  droneA:{name:'警備ドローン', tag:'A', hp:12, start:3, pat:[{n:'射撃', d:3, dl:3, p:'calc'}], pool:['jab','rapid','guard','wall','emp']},
  droneB:{name:'警備ドローン', tag:'B', hp:12, start:4, pat:[{n:'射撃', d:3, dl:4, p:'out'}], pool:['jab','rapid','guard','wall','emp']},
  exec:  {name:'処刑ユニット', tag:'X', hp:26, start:3, pat:[{n:'殴打', d:4, dl:3, p:'out'},{n:'殴打', d:4, dl:3, p:'out'},{n:'粉砕砲', d:12, dl:4, p:'dur', ch:true}], pool:['slash','blow','wall','crackshot']},
  hacker:{name:'ハッカー', tag:'H', hp:10, start:4, pat:[{n:'割り込み', kind:'delay', v:2, dl:4},{n:'射撃', d:2, dl:3, p:'calc'}], pool:['hack','backflow','overclock','crackshot']},

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function bonus(st, id){ return st && st.b && !st.b.over ? (st.b.parts[id].cur > 0 ? 1 : 0) : 1; }

}

/* ---------- engine (pure on a state object; used for play and for preview) ---------- */
function applyCard(st, k, ti){
  const c = CARDS[k], b = st.b, ev = [];
  const targets = c.all ? b.foes.filter(e => e.alive) : (c.tgt ? [b.foes[ti]].filter(e => e && e.alive) : []);
  if(c.tgt && !targets.length) ev.push({kind:'miss'});
  if(c.dmg){
    const n = c.dmg.n + (c.dmg.t === 'phys' ? bonus(st,'out') : bonus(st,'arm'));
    for(const e of targets){
      for(let h = 0; h < (c.dmg.x || 1); h++){
        if(!e.alive) break;
        const d = n + e.crack; e.hp -= d; ev.push({kind:'dmg', e:e.i, n:d});
        if(e.hp <= 0){ e.hp = 0; e.alive = false; ev.push({kind:'kill', e:e.i}); }
      }
    }
  }
  if(c.crack) for(const e of targets) if(e.alive){ e.crack += c.crack; ev.push({kind:'crack', e:e.i, n:c.crack}); }
  if(c.delay) for(const e of targets) if(e.alive){ e.r += c.delay; ev.push({kind:'delay', e:e.i, n:c.delay}); }
  if(c.block){ const n = c.block + bonus(st,'dur'); b.block += n; ev.push({kind:'block', n}); }
  if(c.swift){ b.swift += c.swift; ev.push({kind:'swift', n:c.swift}); }
  return ev;
}
function enemyAct(st, e){
  const a = cur(e), b = st.b, res = {name:a.n};
  if(a.kind === 'delay'){ res.kind = 'delay'; res.v = a.v; }
  else {
    const raw = a.d, ab = Math.min(b.block, raw); b.block -= ab;
    const rem = raw - ab, p = b.parts[a.p];
    let partLoss = 0, bodyLoss = 0, broke = false;
    if(rem > 0){
      if(p.cur > 0){ partLoss = Math.min(p.cur, rem); p.cur -= partLoss; if(p.cur === 0){ broke = true; b.broken[a.p] = true; } bodyLoss = rem - partLoss; }
      else bodyLoss = rem;
      st.run.body = Math.max(0, st.run.body - bodyLoss);
    }
    Object.assign(res, {kind:'hit', part:a.p, raw, blocked:ab, partLoss, bodyLoss, broke, hurt:rem > 0});
  }
  advance(e);
  return res;
}
function* spendGen(st, cost, k, ti, noInt){
  const b = st.b, c = k ? CARDS[k] : null, atomic = !c || !!c.atomic;
  let left = cost;
  const out = {elapsed:0, completeAt:null, interruptedAt:null, justs:[], dead:false, won:false};
  b.cast = {k, left, label: c ? c.name : '引き直し'};
  while(left > 0){
    let real = true;
    if(b.swift > 0){ b.swift--; real = false; }
    left--; b.cast.left = left;
    if(real){ b.T++; out.elapsed++; for(const e of b.foes) if(e.alive) e.r--; }
    yield {type:'tick', real};
    if(left === 0){
      out.completeAt = out.elapsed;
      if(c){
        if(real) for(const e of b.foes){
          if(e.alive && e.r <= 0 && cur(e).ch){ const nm = cur(e).n; advance(e); out.justs.push({i:e.i, name:nm}); yield {type:'just', e:e.i, name:nm}; }
        }
        const ev = applyCard(st, k, ti);
        b.cast = null;
        yield {type:'card', ev};
      }
      b.cast = null;
      if(!b.foes.some(e => e.alive)){ out.won = true; return out; }
    }
    for(const e of b.foes){
      if(!e.alive || e.r > 0) continue;
      const res = enemyAct(st, e);
      if(res.kind === 'delay' && b.cast){
        left += res.v; b.cast.left = left; res.applied = true;
        if(b.parts.mob.cur > 0){ b.swift += 1; res.swift = 1; }
      }
      yield {type:'foe', e:e.i, res};
      if(st.run.body <= 0){ out.dead = true; b.cast = null; return out; }
      if(c && b.cast && res.hurt && !atomic && !noInt){ out.interruptedAt = out.elapsed; b.cast = null; yield {type:'interrupt'}; }
    }
    if(out.interruptedAt !== null) break;
  }
  b.cast = null;
  return out;
}

/* ---------- preview ---------- */
function computePreview(){
  if(!sel) return null;
  const b = S.b, k = sel.kind === 'card' ? sel.k : null;
  const cost = k ? CARDS[k].cost : b.hand.length;
  const sim = noInt => {
    const c = clone(S);
    if(k) c.b.hand.splice(sel.i, 1); else { c.b.disc.push(...c.b.hand); c.b.hand = []; }
    const g = spendGen(c, cost, k, sel.target, noInt); let r;
    while(!(r = g.next()).done){}
    return {c, out:r.value};
  };
  const A = sim(false), P = sim(true);
  return {
    k, cost, name: k ? CARDS[k].name : '引き直し', atomic: !!(k && CARDS[k].atomic),
    completeAt: P.out.completeAt ?? P.out.elapsed,
    swiftUsed: Math.min(b.swift, cost),
    interruptedAt: A.out.interruptedAt,
    justSet: new Set(A.out.justs.map(j => j.i)), justNames: A.out.justs.map(j => j.name),
    parts: A.c.b.parts, body: A.c.run.body, dead: A.out.dead,
    foeHp: A.c.b.foes.map(e => e.hp),
    kills: b.foes.filter((e, i) => e.alive && !A.c.b.foes[i].alive).map(e => e.tag),
  };
}
function pvSummary(pv){
  const out = [];
  out.push(`<b class="me">${pv.name}</b> 完了 <b class="num time">${pv.completeAt}</b>${pv.swiftUsed ? ` <span class="time">(スウィフト−${pv.swiftUsed})</span>` : ''}`);
  if(pv.atomic) out.push('<b>アトミック</b>');
  if(pv.justNames.length) out.push(`<b class="just">JUST ${pv.justNames.join('・')}</b>`);
  if(pv.interruptedAt != null) out.push(`<b class="foe">中断される(${pv.interruptedAt}で被弾)</b>`);
  const loss = [];
  for(const p of PARTS){ const d = S.b.parts[p.id].cur - pv.parts[p.id].cur; if(d > 0) loss.push(`${p.fn}−${d}`); }
  const bl = S.run.body - pv.body; if(bl > 0) loss.push(`本体−${bl}`);
  out.push(loss.length ? `受ける <span class="foe2">${loss.join(' ')}</span>` : '<span class="dim">被弾なし</span>');
  if(pv.kills.length) out.push(`<b class="me">撃破 ${pv.kills.join('・')}</b>`);
  if(pv.dead) out.push('<b class="foe">機能停止</b>');
  return out.join(' · ');
}

function incoming(view){

    }
  }
  return res;
}

    case 'kill': floatAt(740, laneTop(x.e) + 40, '撃破', 'me'); flash(`.lane[data-f="${x.e}"]`, 'act'); break;
    case 'crack': floatAt(760, laneTop(x.e) + 50, 'クラック+' + x.n, 'foe'); break;
    case 'delay': floatAt(xs(2), laneTop(x.e) + 12, 'ディレイ' + x.n, 'time'); break;
    case 'block': floatAt(48, 38, 'ブロック+' + x.n, 'me'); break;
    case 'swift': floatAt(60, 38, 'スウィフト+' + x.n, 'time'); break;
    case 'miss': setLast('対象がいない'); break;
  }
}
function foeFx(i, r){
  const e = S.b.foes[i];
  flash(`.lane[data-f="${i}"]`, 'act');
  if(r.kind === 'delay'){
    if(r.applied){ floatAt(xs(1), 52, `完了+${r.v}`, 'time'); setLast(`${e.name}の${r.name}: ディレイ${r.v}で完了が遅れた${r.swift ? '(噴射機構: スウィフト+1)' : ''}`); }
    else setLast(`${e.name}の${r.name}: 空振り`);
    return;
  }
  const pf = PART_BY[r.part], y = partY(r.part);
  if(r.blocked) floatAt(48, 40, `ブロック−${r.blocked}`, 'dim');
  if(r.partLoss){ floatAt(176, y + 10, '−' + r.partLoss, 'foe'); flash(`.part[data-p="${r.part}"]`, 'hit'); }
  if(r.broke) floatAt(120, y + 22, '破損', 'foe');
  if(r.bodyLoss) floatAt(790, 20, '本体−' + r.bodyLoss, 'foe');
  if(!r.hurt) floatAt(150, y + 10, '防御', 'dim');
  setLast(`${e.name}の${r.name} ${r.raw} → ${pf.fn}${r.blocked ? `(ブロック${r.blocked})` : ''}${r.broke ? ' 破損' : ''}${r.bodyLoss ? ` 本体−${r.bodyLoss}` : ''}`);
}

/* ---------- play ---------- */
function drawN(n){
  const b = S.b;
  for(let i = 0; i < n; i++){
    if(!b.draw.length){ b.draw = shuffle(b.disc); b.disc = []; }
    if(!b.draw.length) break;
    b.hand.push(b.draw.pop());
  }
}
function defaultTarget(){ const b = S.b; if(b.foes[lastTarget] && b.foes[lastTarget].alive) return lastTarget; const e = b.foes.find(f => f.alive); return e ? e.i : 0; }
function recalc(){ PV = computePreview(); renderAll(); }
function onCard(i){
  const k = S.b.hand[i].k, c = CARDS[k];
  if(sel && sel.kind === 'card' && sel.i === i){ execute(); return; }
  sel = {kind:'card', i, k, target: c.tgt ? defaultTarget() : null}; recalc();
}
function onRedraw(){
  if(!S.b.hand.length) return;
  if(sel && sel.kind === 'redraw'){ execute(); return; }
  sel = {kind:'redraw'}; recalc();
}
function onFoe(i){
  const e = S.b.foes[i]; if(!e.alive) return;
  if(sel && sel.kind === 'card' && CARDS[sel.k].tgt){
    if(sel.target === i){ execute(); return; }
    sel.target = i; lastTarget = i; recalc(); return;
  }
  if(!sel) infoFoe(i);
}
async function showEvent(ev, k){
  const b = S.b;
  switch(ev.type){
    case 'tick': renderAll(); if(!ev.real) floatAt(xs(0) + 22, 40, '加速', 'time'); await sleep(ev.real ? TICK : TICK * 0.55); break;
    case 'just': floatAt(xs(0) + 24, laneTop(ev.e) + 34, 'JUST', 'just'); setLast(`JUST: ${b.foes[ev.e].name}の${ev.name}を潰した`); renderAll(); await sleep(450); break;
    case 'card': for(const x of ev.ev) cardFx(x); renderAll(); await sleep(330); break;
    case 'foe': foeFx(ev.e, ev.res); renderAll(); await sleep(360); break;
    case 'interrupt': floatAt(xs(1) + 10, 52, '中断', 'foe'); setLast(`${CARDS[k].name}は中断された`); renderAll(); await sleep(420); break;
  }
}
async function execute(){
  const s = sel, b = S.b; sel = null; PV = null; busy = true;
  let card = null, k = null, cost;
  if(s.kind === 'card'){ card = b.hand.splice(s.i, 1)[0]; k = card.k; cost = CARDS[k].cost; if(s.target != null) lastTarget = s.target; setLast(`${CARDS[k].name}を実行(${cost}サイクル)`); }
  else { cost = b.hand.length; b.disc.push(...b.hand); b.hand = []; setLast(`引き直し(${cost}サイクル)`); }
  renderAll();
  const g = spendGen(S, cost, k, s.target, false); let r;
  while(!(r = g.next()).done) await showEvent(r.value, k);
  const out = r.value;
  if(card) b.disc.push(card);
  if(out.dead){ busy = false; renderAll(); await sleep(300); onLose(); return; }
  if(out.won){ busy = false; b.over = true; renderAll(); await sleep(400); onWin(); return; }
  if(!k) drawN(5);
  else if(!b.hand.length){ drawN(5); setLast('手札を使い切った: 0サイクルで引き直し'); }
  busy = false; renderAll();
}

/* ---------- flow ---------- */
function newRun(){
  const parts = {}; for(const p of PARTS) parts[p.id] = {damaged:false};
  S = {run:{body:50, bodyMax:50, parts, deck:START_DECK.slice(), step:0}};
  hideOv(); startBattle(0);
}
function startBattle(n){
  const B = BATTLES[n], run = S.run;
  snapshot = JSON.stringify(run);
  const parts = {};
  for(const p of PARTS) parts[p.id] = {cur: run.parts[p.id].damaged ? Math.ceil(p.max / 2) : p.max, max:p.max};
  const foes = B.foes.map((key, i) => { const f = FOES[key]; return {key, i, name:f.name, tag:f.tag, hp:f.hp, maxHp:f.hp, pat:f.pat, idx:0, r:f.start, seq:0, alive:true, crack:0}; });
  let id = 0;
  S.b = {n, T:0, block:0, swift: parts.mob.cur > 0 ? 2 : 0, foes, parts, draw: shuffle(run.deck.map(k => ({k, id:id++}))), disc:[], hand:[], cast:null, broken:{}, over:false};
  drawN(5); sel = null; PV = null; busy = false; lastTarget = 0;
  setLast('デトロイト噴射機構: 戦闘開始時スウィフト2');
  buildLanes(); clearMarks(); renderAll();
  toast(`${B.area} · ${B.room}${B.boss ? ' · ボス' : ''}`);
}
function next(){
  S.run.step++;
  const s = FLOW[S.run.step];
  if(s[0] === 'b') startBattle(+s[1]);
  else if(s === 'learn') showLearn();
  else if(s === 'rest') showRest();
  else showClear();
}
function onWin(){
  const lines = [];
  for(const p of PARTS){
    const rp = S.run.parts[p.id], br = !!S.b.broken[p.id];
    if(br) lines.push(`<li><b class="foe2">${p.fn}</b> 破損 → 損傷: 次の戦闘は耐久が半分から</li>`);
    else if(rp.damaged) lines.push(`<li><b class="me">${p.fn}</b> 耐えきった → 損傷が直った</li>`);
    rp.damaged = br;
  }
  lastPool = BATTLES[S.b.n].foes.flatMap(k => FOES[k].pool);
  showOv(`<h2>戦闘終了</h2><p class="sub">本体 ${S.run.body}/${S.run.bodyMax}</p><ul>${lines.join('') || '<li>破損した部位はない</li>'}</ul><div class="row"><button class="btn" type="button" data-act="next">次へ</button></div>`);
}
function onLose(){
  showOv(`<h2>機能停止</h2><p class="sub">${BATTLES[S.b.n].room}で本体の耐久が尽きた。</p><div class="row"><button class="btn ghost" type="button" data-act="restart">最初から</button><button class="btn" type="button" data-act="retry">この戦闘をやり直す</button></div>`);
}
function showLearn(){
  const opts = shuffle([...new Set(lastPool)]).slice(0, 3);
  showOv(`<h2>学習</h2><p class="sub">倒した敵の動きを、1つ取り込める。</p><div class="opts">${opts.map(k => `<button class="card static" type="button" data-act="learn" data-arg="${k}">${cardInner(k, null)}</button>`).join('')}</div><div class="row"><button class="btn ghost" type="button" data-act="next">取り込まない</button></div>`);
}
function showRest(){
  const dmg = PARTS.filter(p => S.run.parts[p.id].damaged).map(p => p.fn);
  showOv(`<h2>整備ステーション</h2><p class="sub">1つだけ選べる。本体 ${S.run.body}/${S.run.bodyMax}${dmg.length ? ` · 損傷: ${dmg.join('・')}` : ''}</p><div class="opts col"><button class="opt" type="button" data-act="repair"><b>修理</b><span>本体+15、損傷をすべて直す</span></button><button class="opt" type="button" data-act="defrag"><b>デフラグ</b><span>デッキからカードを1枚消去する</span></button></div>`);
}
function showDefrag(){
  const counts = {}; for(const k of S.run.deck) counts[k] = (counts[k] || 0) + 1;
  showOv(`<h2>デフラグ</h2><p class="sub">消去するカードを選ぶ。武装由来のカードは消せない。</p><div class="dk">${Object.keys(counts).map(k => `<button class="opt" type="button" data-act="del" data-arg="${k}" ${CARDS[k].src ? 'disabled' : ''}><b>${CARDS[k].name} ×${counts[k]}</b><span>${CARDS[k].cost}サイクル</span></button>`).join('')}</div>`);
}
function showClear(){
  showOv(`<h2>エリア1 踏破</h2><p class="sub">本体 ${S.run.body}/${S.run.bodyMax} · デッキ ${S.run.deck.length}枚。試作はここまで。</p><div class="row"><button class="btn" type="button" data-act="restart">最初から</button></div>`);
}

/* ---------- info overlays ---------- */
function gloss(list){ return `<dl class="gl">${list.map(w => `<dt>${w}</dt><dd>${GLOSS[w]}</dd>`).join('')}</dl>`; }
const closeRow = '<div class="row"><button class="btn" type="button" data-act="close">閉じる</button></div>';
function infoCard(k){
  const c = CARDS[k], kw = [];
  if(c.block) kw.push('ブロック'); if(c.delay) kw.push('ディレイ'); if(c.swift) kw.push('スウィフト'); if(c.crack) kw.push('クラック');
  kw.push(c.atomic ? 'アトミック' : '中断'); kw.push('サイクル');
  showOv(`<h2>${c.name}</h2><p class="sub">コスト <b class="time">${c.cost}</b> サイクル · ${cardType(c)}${c.src ? ` · ${c.src}由来` : ''}</p><p class="eff">${cardBits(k, S)}</p>${gloss(kw)}${closeRow}`, true);
}
function infoFoe(i){
  const e = S.b.foes[i];
  const rows = e.pat.map((a, j) => `<li class="${j === e.idx ? 'cur' : ''}">${a.kind === 'delay' ? `${a.n}: 自分に<span class="time">ディレイ</span>${a.v}` : `${a.n}: ${a.d}ダメージ → ${PART_BY[a.p].fn}${a.ch ? ' <b class="just">溜め</b>' : ''}`} <span class="dim">(間隔${a.dl})</span></li>`).join('');
  showOv(`<h2>${e.name}</h2><p class="sub">耐久 ${e.hp}/${e.maxHp}${e.crack ? ` · クラック${e.crack}` : ''} · 行動パターン(繰り返し、色つきが次)</p><ol>${rows}</ol>${gloss(['溜め','ジャスト'])}${closeRow}`, true);
}
function infoPart(id){
  const p = PART_BY[id], st = S.b.parts[id], rp = S.run.parts[id];
  showOv(`<h2>${p.name}</h2><p class="sub">${p.fn}${p.pt ? '(' + p.pt + ')' : ''} · 耐久 ${st.cur}/${st.max}${st.cur <= 0 ? ' · <b class="foe">破損</b>' : rp.damaged ? ' · <b class="foe2">損傷</b>' : ''}</p><p class="eff">${p.text}</p>${gloss(['破損','損傷'])}${closeRow}`, true);
}
function infoDeck(){
  const counts = {}; for(const k of S.run.deck) counts[k] = (counts[k] || 0) + 1;
  showOv(`<h2>デッキ ${S.run.deck.length}枚</h2><p class="sub">山札 ${S.b.draw.length} · 捨て札 ${S.b.disc.length} · 手札 ${S.b.hand.length}</p><div class="dk">${Object.keys(counts).map(k => `<div class="opt"><b>${CARDS[k].name} ×${counts[k]}</b><span>${CARDS[k].cost}サイクル · ${cardType(CARDS[k])}</span></div>`).join('')}</div>${closeRow}`, true);
}
function showRules(first){
  showOv(`<h2>試作2の遊び方</h2><ul>
    <li>時間はカードを使ったときだけ進む。コストは、かかる<b class="time">サイクル</b>。</li>
    <li>各敵の行に、攻撃の予定が右から流れてくる。数字はダメージ、横の字は狙う部位(演・武・出・耐・機)。</li>
    <li>カードをタップすると、完了位置と受けるダメージの予測が出る。もう一度タップで実行。攻撃カードは敵の行をタップして対象を変えられ、同じ敵をもう一度タップしても実行。</li>
    <li>完了前に被弾すると<b class="foe">中断</b>。ブロックで全部防ぐか、<b>アトミック</b>なら中断されない。</li>
    <li>完了と<b class="just">溜め技(紫)</b>が同じサイクルなら、JUSTで潰せる。</li>
    <li>部位の耐久が0で<b class="foe">破損</b>: 性能を失い、そこへの攻撃は本体に通る。本体0で機能停止。破損した部位は次の戦闘で耐久半分(損傷)。</li>
    <li>引き直しは、残りの手札の枚数ぶんサイクルを払う。長押しで詳細、部位や敵はタップで詳細。</li>
  </ul><div class="row"><button class="btn" type="button" data-act="close">${first ? 'はじめる' : '閉じる'}</button></div>`, !first);
}
function showMenu(){
  showOv(`<h2>メニュー</h2><div class="opts col"><button class="opt" type="button" data-act="rules"><b>遊び方</b></button><button class="opt" type="button" data-act="deck"><b>デッキ一覧</b></button><button class="opt" type="button" data-act="fs"><b>全画面にする</b><span>対応していない環境では何も起きない</span></button><button class="opt" type="button" data-act="restart"><b>最初からやり直す</b></button></div>${closeRow}`, true);
}
async function goFull(){
  hideOv();
  try{ await document.documentElement.requestFullscreen(); try{ await screen.orientation.lock('landscape'); }catch(e){} }
  catch(e){ setLast('この表示環境では全画面にできません'); renderAll(); }
}
function showOv(html, closable){ const ov = $('#ov'); $('#ovbox').innerHTML = html; ov.dataset.closable = closable ? '1' : ''; ov.hidden = false; }
function hideOv(){ $('#ov').hidden = true; }
function act(a, arg){
  switch(a){
    case 'close': hideOv(); break;
    case 'menu': if(!busy) showMenu(); break;
    case 'rules': showRules(false); break;
    case 'deck': infoDeck(); break;
    case 'fs': goFull(); break;
    case 'restart': newRun(); break;
    case 'retry': S.run = JSON.parse(snapshot); hideOv(); startBattle(S.b.n); break;
    case 'next': hideOv(); next(); break;
    case 'learn': S.run.deck.push(arg); hideOv(); next(); break;
    case 'repair': S.run.body = Math.min(S.run.bodyMax, S.run.body + 15); for(const p of PARTS) S.run.parts[p.id].damaged = false; hideOv(); next(); break;
    case 'defrag': showDefrag(); break;
    case 'del': { const i = S.run.deck.indexOf(arg); if(i >= 0) S.run.deck.splice(i, 1); hideOv(); next(); break; }
  }
}

/* ---------- input ---------- */
const stage = $('#stage');
let lpTimer = null, longFired = false;
stage.addEventListener('pointerdown', ev => {
  if(busy || !$('#ov').hidden) return;
  const c = ev.target.closest('.card[data-i]'), f = ev.target.closest('.fp[data-f]');
  if(!c && !f) return;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    longFired = true; setTimeout(() => { longFired = false; }, 700);
    if(c) infoCard(S.b.hand[+c.dataset.i].k); else infoFoe(+f.dataset.f);
  }, 430);
});
['pointerup','pointercancel','pointerleave'].forEach(n => stage.addEventListener(n, () => clearTimeout(lpTimer)));
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('click', ev => {
  if(longFired){ longFired = false; return; }
  const t = ev.target, a = t.closest('[data-act]');
  if(a){ act(a.dataset.act, a.dataset.arg); return; }
  const ov = $('#ov');
  if(!ov.hidden){ if(t === ov && ov.dataset.closable) hideOv(); return; }
  if(busy) return;
  const card = t.closest('.card[data-i]'); if(card){ onCard(+card.dataset.i); return; }
  if(t.closest('#redraw')){ onRedraw(); return; }
  const f = t.closest('[data-f]'); if(f){ onFoe(+f.dataset.f); return; }
  const p = t.closest('.part'); if(p){ infoPart(p.dataset.p); return; }
  if(t.closest('.pile')){ infoDeck(); return; }
  if(sel){ sel = null; PV = null; renderAll(); }
});

function fit(){
  const w = $('#wrap');
  const s = Math.min(w.clientWidth / 844, w.clientHeight / 390);
  document.documentElement.style.setProperty('--s', Math.max(0.2, s));
}
addEventListener('resize', fit);
fit();
buildStatic();
newRun();
showRules(true);
</script>
<script>
// オフライン用のサービスワーカー登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
