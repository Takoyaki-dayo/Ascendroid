<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ascendroid</title>
<meta name="theme-color" content="#0a0f15">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html,body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: fixed 844x390 landscape stage, scaled to fit. Back to front: battle-forecast screen, characters in a row with their own HP/status underneath, parts column at left, tall cards peeking from the bottom edge.
   Color is meaning only, on a blue-tinted night palette: cyan = you and what you operate (now, cost, selection), red = threat, violet = charge/JUST. */
:root{
  --bg:#0a0f15; --panel:#0f1720; --raised:#121c27; --line:#1c2937; --grid:#15202c;
  --fg:#e6eef5; --fg2:#a9bccb; --dim:#6f8396; --dim2:#425466; --neutral:#d3e2ee;
  --cy:#38d3ff; --cy-dim:#2d6f88; --foe:#ff4d6a; --foe2:#ff8a9c; --just:#b18cff; --just2:#cbb2ff;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Chakra Petch","BIZ UDPGothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;overflow:clip}
#rot{display:none;position:absolute;left:0;right:0;top:10px;text-align:center;color:var(--cy);font-size:13px}
@media (orientation:portrait){#rot{display:block}}
#stage{position:absolute;left:50%;top:50%;width:844px;height:390px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;overflow:clip;
  background:radial-gradient(ellipse 520px 220px at 420px 230px, rgba(56,211,255,.05), transparent 70%), var(--bg);font-size:11px;line-height:1.35;touch-action:none}
#stage *{box-sizing:border-box}
#shaker{position:absolute;inset:0}
#world{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .32s cubic-bezier(.2,.8,.2,1),filter .32s}
#shaker.zoomout #world{transform:scale(.8);filter:brightness(.72)}
#shaker.selfview #world{transform:scale(.64);filter:brightness(.55)}
#parts,#hand,.pile{transition:opacity .25s,transform .25s}
#shaker.selfview #parts,#shaker.selfview #hand,#shaker.selfview .pile,#shaker.selfview #redraw{opacity:0;pointer-events:none;transform:translateY(24px)}
#inner{position:absolute;left:8px;top:8px;width:828px;height:204px;border:1px solid var(--line);border-radius:10px;background:rgba(15,23,32,.95);box-shadow:0 12px 30px rgba(0,0,0,.5);
  display:grid;grid-template-columns:150px minmax(0,1fr) 230px;gap:18px;padding:12px 14px;transform:translateY(-240px);transition:transform .32s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#shaker.selfview #inner{transform:none;pointer-events:auto}
.face{display:flex;flex-direction:column;gap:7px;min-width:0}
.face svg{display:block}
.mono{font-size:11px;line-height:1.55;color:var(--fg);border-left:2px solid var(--cy);padding-left:7px}
.diag{display:flex;flex-direction:column;gap:3px;min-width:0}
.drow{display:grid;grid-template-columns:14px 30px minmax(0,1fr) 70px 18px;align-items:center;column-gap:6px}
.drow .ic{color:var(--fg)}
.drow .dn{font-weight:700;font-size:10.5px}
.drow .dp{font-size:10px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .pips{margin:0}
.drow .pnum{text-align:right}
.drow .de{grid-column:3/6;font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.drow.broken .ic,.drow.broken .dn{color:var(--dim2)}
.drow.broken .dp{text-decoration:line-through;color:var(--dim2)}
.mem{display:flex;flex-direction:column;gap:5px;min-width:0;overflow:auto}
.mh{display:flex;align-items:center;gap:5px;color:var(--fg2);font-family:var(--f-num);font-weight:700;font-size:12px}
.mh .ic svg{width:13px;height:13px}
.ml{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.mc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:1px 5px 1px 2px;font-size:10px;background:var(--raised)}
.mc i{font-style:normal;width:14px;height:14px;border-radius:7px;border:1px solid var(--cy);color:var(--cy);font-family:var(--f-num);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mc b{font-family:var(--f-num);color:var(--cy);font-size:10px}
#shaker.shake{animation:shake .28s linear}
@keyframes shake{20%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,0)}}
button{font:inherit;color:inherit;cursor:pointer;padding:0;margin:0;background:none;border:0;text-align:left}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.ic{display:inline-flex;flex:none}
.ic svg{width:12px;height:12px;display:block}
.np{pointer-events:none}

/* timeline */
#tl{position:absolute;inset:0;transition:opacity .2s}
#shaker.executing #tl{opacity:.62}
#screen{position:absolute;left:96px;top:8px;width:620px;height:164px;border:1px solid #1a2836;border-radius:6px;
  background:repeating-linear-gradient(180deg,rgba(56,211,255,.018) 0 1px,transparent 1px 3px),linear-gradient(180deg,#0e1822,#0c141d)}
.tl{position:absolute;top:40px;width:1px;height:126px;background:var(--grid)}
.tn{position:absolute;top:10px;width:20px;text-align:center;font-family:var(--f-num);font-size:10px;color:var(--cy-dim)}
#nowTri{position:absolute;left:174px;top:11px}
#nowLine{position:absolute;left:179px;top:22px;width:2px;height:144px;background:var(--cy);box-shadow:0 0 6px rgba(56,211,255,.5)}
#swiftBand{position:absolute;top:22px;height:144px;background:linear-gradient(90deg,rgba(56,211,255,0),rgba(56,211,255,.12));border-left:1px dashed rgba(56,211,255,.45);transition:left .15s,width .15s}
.rowline{position:absolute;left:180px;height:1px;width:458px;background:rgba(169,188,203,.1)}
.rowline.tgt{background:rgba(56,211,255,.5)}
.rowline.dead{opacity:.3}
.rowtag{position:absolute;left:646px;width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:10px;font-weight:700;background:#1e2c3a;color:var(--fg)}
.rowtag.tgt{background:var(--cy);color:var(--bg)}
.rowtag.dead{opacity:.3}
.rowhit{position:absolute;left:180px;width:490px;height:34px}
#pvRegion{position:absolute;left:181px;top:24px;height:142px;background:rgba(56,211,255,.07)}
#pvLine{position:absolute;top:22px;width:2px;height:144px;background:var(--cy)}
#selfBar{position:absolute;top:25px;height:9px;border-radius:3px;transition:left .13s linear,width .13s linear}
#selfBar.pre{background:rgba(56,211,255,.5)}
#selfBar.cast{background:rgba(56,211,255,.8);box-shadow:0 0 8px rgba(56,211,255,.5)}
#selfBar.broken{background:var(--foe);animation:barbreak .38s ease-out forwards}
@keyframes barbreak{0%{opacity:1;transform:none}40%{opacity:1;transform:scaleY(2.2)}100%{opacity:0;transform:scaleY(.2) translateY(-6px)}}
.mk{position:absolute;width:26px;height:22px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:4px;border:1.5px solid var(--foe);background:#2a1220;color:#ffe0e6;transition:left .13s linear,top .2s,opacity .2s,transform .2s,box-shadow .15s}
.mk b{font-family:var(--f-num);font-size:12px;font-weight:700}
.mk span{font-size:9.5px}
.mk .ic svg{width:10px;height:10px}
.mk.later{opacity:.45}
.mk.ch{border-color:var(--just);background:#1f1838;color:#efe6ff;border-radius:11px}
.mk.dl{border:1px solid #3d5163;background:var(--raised);color:var(--fg2)}
.mk.danger{box-shadow:0 0 0 3px rgba(255,77,106,.42)}
.mk.just{background:var(--just);color:#1a1030;box-shadow:0 0 16px rgba(177,140,255,.85)}
.mk.fire{transform:scale(1.35);box-shadow:0 0 14px rgba(255,77,106,.8)}
.mk.out{opacity:0!important;transform:scale(1.6)}

/* stage */
#floor{position:absolute;left:0;top:214px;width:844px;height:80px;background:linear-gradient(180deg,transparent,rgba(56,211,255,.035))}
#droid{position:absolute;left:108px;top:142px;width:50px;height:128px;transform-origin:50% 100%}
#droid svg{display:block}
#droid.casting{filter:drop-shadow(0 0 5px rgba(56,211,255,.6))}
#droid.lunge{animation:lunge .36s ease-out}
@keyframes lunge{35%{transform:translateX(72px) rotate(8deg)}100%{transform:none}}
#droid.recoil{animation:recoil .3s ease-out}
@keyframes recoil{25%{transform:translateX(-7px) rotate(-3deg)}100%{transform:none}}
#droid.hit{animation:dhit .3s linear}
@keyframes dhit{0%{filter:brightness(2.2) drop-shadow(0 0 6px rgba(255,77,106,.9))}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{transform:none;filter:none}}
#droid.stagger{animation:stagger .4s ease-out}
@keyframes stagger{30%{transform:rotate(-10deg) translateX(-6px)}100%{transform:none}}
#droid.glitch{animation:glitch .3s steps(4)}
@keyframes glitch{25%{transform:translateX(3px)}50%{transform:translateX(-3px);filter:hue-rotate(60deg)}75%{transform:translateX(2px)}100%{transform:none}}
.foe{position:absolute;top:170px;width:90px;height:100px;transition:opacity .4s,transform .4s}
.foe svg{display:block}
.foe.atk{animation:fatk .26s ease-out}
@keyframes fatk{40%{transform:translateX(-26px)}100%{transform:none}}
.foe.ehit{animation:fhit .26s ease-out}
@keyframes fhit{0%{filter:brightness(2.4)}30%{transform:translateX(10px)}100%{transform:none;filter:none}}
.foe.ejust{animation:fjust .45s ease-out}
@keyframes fjust{0%{filter:brightness(2) drop-shadow(0 0 10px #b18cff)}30%{transform:translateX(16px) rotate(6deg)}100%{transform:none;filter:none}}
.foe.dead{opacity:0;transform:translateY(14px) scaleY(.85)}
.reticle{position:absolute;left:4px;top:6px;width:82px;height:90px;border:2px solid var(--cy);border-radius:4px;opacity:0;transition:opacity .15s;
  -webkit-mask:linear-gradient(#000 0 0) top left/14px 14px no-repeat,linear-gradient(#000 0 0) top right/14px 14px no-repeat,linear-gradient(#000 0 0) bottom left/14px 14px no-repeat,linear-gradient(#000 0 0) bottom right/14px 14px no-repeat;
  mask:linear-gradient(#000 0 0) top left/14px 14px no-repeat,linear-gradient(#000 0 0) top right/14px 14px no-repeat,linear-gradient(#000 0 0) bottom left/14px 14px no-repeat,linear-gradient(#000 0 0) bottom right/14px 14px no-repeat}
.foe.tgt .reticle{opacity:1}
.cinfo{position:absolute;top:272px;width:110px;display:flex;flex-direction:column;gap:3px;transition:opacity .4s}
.cinfo.dead{opacity:.25}
.frow{display:flex;gap:4px;align-items:center}
.ftag{width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:10px;font-weight:700;background:#1e2c3a;flex:none}
.ftag.tgt{background:var(--cy);color:var(--bg)}
.hpb{position:relative;display:block;width:58px;height:5px;background:#1c2937;border-radius:2px;overflow:hidden}
.hpb i{position:absolute;left:0;top:0;bottom:0;background:var(--neutral);transition:width .25s}
.hpb.me i{background:var(--cy)}
.hpb s{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--foe) 0 2px,transparent 2px 4px)}
.hpt{font-family:var(--f-num);font-size:10.5px;color:var(--fg2)}
.hpt.pv{color:var(--foe2)}
.sts{display:flex;gap:8px;min-height:12px}
.st{display:inline-flex;gap:2px;align-items:center;font-family:var(--f-num);font-size:10.5px;font-weight:700}
.st .ic svg{width:11px;height:11px}
.st.crack{color:var(--foe2)} .st.blk{color:var(--fg)} .st.swf{color:var(--cy)}
.st.flash{animation:stflash .35s}
@keyframes stflash{0%{filter:drop-shadow(0 0 6px #fff);color:#fff}100%{filter:none}}

/* parts */
.part{position:absolute;left:8px;width:76px;display:block;padding:2px 0;transition:background .2s;border-radius:4px}
.ph{display:flex;align-items:center;gap:4px}
.pico{position:relative;display:inline-flex;color:var(--fg)}
.pico svg{width:12px;height:12px;display:block}
.pname{font-size:10.5px;font-weight:700}
.pnum{margin-left:auto;font-family:var(--f-num);font-size:10.5px;font-weight:600;color:var(--fg2)}
.pnum.pv{color:var(--foe2)}
.pips{display:flex;gap:2px;margin-top:4px}
.pip{display:block;height:7px;border-radius:1px;background:#1c2937}
.pip.full{background:var(--neutral)}
.pip.loss{background:repeating-linear-gradient(135deg,var(--foe) 0 2px,#3a1424 2px 4px)}
.pip.worn{background:repeating-linear-gradient(135deg,#2a3a4a 0 2px,#111b25 2px 4px)}
.part.th-hit .pico,.part.th-hit .pname{color:var(--foe2)}
.part.th-ch .pico,.part.th-ch .pname{color:var(--just2)}
.part.broken .pname,.part.broken .pico{color:var(--dim2)}
.part.broken .pico::after{content:"";position:absolute;left:-2px;top:5px;width:16px;height:2px;background:var(--foe);transform:rotate(-40deg)}
.part.flash{background:rgba(255,77,106,.22)}
#menuBtn{position:absolute;left:806px;top:8px;width:28px;height:22px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--dim);display:flex;align-items:center;justify-content:center}

/* hand: tall cards peek from the bottom edge */
#handShade{position:absolute;left:0;top:170px;width:844px;height:220px;background:linear-gradient(180deg,rgba(10,15,21,0),rgba(10,15,21,.88) 40%);opacity:0;transition:opacity .2s;pointer-events:none}
#handShade.on{opacity:1}
.pile{position:absolute;left:8px;width:66px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:6px}
.pile .ic svg{width:14px;height:14px}
.pile b{font-family:var(--f-num);font-size:13px}
#pileDisc{color:var(--dim)}
.card{position:absolute;width:96px;height:136px;transform-origin:50% 100%;overflow:hidden;border-radius:8px;background:var(--raised);border:1px solid #233446;color:var(--fg);display:flex;flex-direction:column;
  transition:left .22s cubic-bezier(.2,.8,.2,1),top .22s cubic-bezier(.2,.8,.2,1),transform .22s cubic-bezier(.2,.8,.2,1),opacity .22s,border-color .15s,box-shadow .2s}
.card.sel,.card.picked{border:1.5px solid var(--cy);box-shadow:0 10px 24px rgba(56,211,255,.28)}
.card:disabled{cursor:default}
.card.off{opacity:.35}
.chd{display:flex;align-items:center;gap:4px;height:26px;padding:0 5px;flex:none}
.cost{width:18px;height:18px;flex:none;border:1.5px solid var(--cy);border-radius:9px;background:var(--bg);color:var(--cy);font-family:var(--f-num);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cname{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cart{position:relative;display:block;height:60px;flex:none;margin:0 4px;border-radius:4px;background:repeating-linear-gradient(135deg,#17222e 0 6px,#131c27 6px 12px)}
.atom{position:absolute;left:6px;top:7px;width:7px;height:7px;background:var(--fg);transform:rotate(45deg)}
.cval{position:absolute;right:5px;top:4px;display:flex;align-items:center;gap:3px;padding:1px 4px;border-radius:4px;background:rgba(10,15,21,.75)}
.cval b{font-family:var(--f-num);font-size:15px;line-height:1.1}
.ctx{display:block;padding:5px 7px 0;font-size:10px;line-height:1.4;color:var(--fg2)}
.ctx b{color:var(--fg)}
.kwp{display:inline-block;margin-top:3px;font-size:9px;font-weight:700;border:1px solid #33495d;border-radius:3px;padding:0 4px;line-height:13px;color:var(--fg)}
.kw-f{font-weight:700;color:var(--foe2)} .kw{font-weight:700;color:var(--fg)} .kw-j{font-weight:700;color:var(--just2)}
.ctx .kwp{display:inline;margin:0;border:0;padding:0;font-size:inherit;line-height:inherit}
/* 文が長いカードは絵を低くして5行まで入れる */
.card:has(.ctx.long) .cart{height:36px}
.ctx.long{font-size:9.5px;line-height:1.35}
.cnt{position:absolute;right:5px;bottom:5px;font-family:var(--f-num);font-size:11px;font-weight:700;color:var(--cy)}
#redraw{position:absolute;left:742px;top:302px;width:92px;height:80px;border:1px solid #233446;border-radius:8px;background:var(--panel);color:var(--fg2);display:flex;align-items:center;justify-content:center;gap:8px;transition:top .15s,border-color .15s,box-shadow .15s,opacity .25s,transform .25s}
#redraw svg{width:20px;height:20px}
#redraw b{font-family:var(--f-num);font-size:24px;color:var(--cy)}
#redraw.sel{top:292px;border:1.5px solid var(--cy);box-shadow:0 10px 22px rgba(56,211,255,.22)}
#redraw:disabled{opacity:.4;cursor:default}

/* fx */
#fx,#floats{position:absolute;inset:0;pointer-events:none}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:700;font-size:17px;white-space:nowrap;text-shadow:0 0 6px #000,0 1px 0 #000;animation:rise .9s ease-out forwards;color:#fff}
.float.foe{color:var(--foe2)} .float.cy{color:var(--cy);font-size:14px}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-26px}}
.burst{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--just);box-shadow:0 0 18px rgba(177,140,255,.9),inset 0 0 12px rgba(177,140,255,.6);animation:burst .5s ease-out forwards}
@keyframes burst{0%{transform:scale(.4);opacity:1}70%{opacity:1}100%{transform:scale(1.8);opacity:0}}
.shard{position:absolute;width:9px;height:3px;background:var(--just2);transition:transform .45s ease-out,opacity .45s}
.beam{position:absolute;height:3px;transform-origin:0 50%;border-radius:2px;background:linear-gradient(90deg,rgba(214,246,255,0),#d6f6ff 25%,var(--cy));box-shadow:0 0 10px rgba(56,211,255,.8);animation:beam .3s ease-out forwards}
@keyframes beam{0%{opacity:0;clip-path:inset(0 100% 0 0)}30%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}
.slash{position:absolute;width:60px;height:3px;margin:-1px 0 0 -30px;background:#fff;box-shadow:0 0 8px #fff;transform:rotate(-35deg);animation:slash .25s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:rotate(-35deg) scaleX(.2)}40%{opacity:1;transform:rotate(-35deg) scaleX(1)}100%{opacity:0;transform:rotate(-35deg) scaleX(1.2)}}
.shield{position:absolute;left:92px;top:136px;width:82px;height:140px;border:1.5px solid rgba(214,246,255,.8);border-radius:40% 40% 46% 46%;box-shadow:0 0 14px rgba(56,211,255,.35),inset 0 0 14px rgba(56,211,255,.2);animation:shield .55s ease-out forwards}
@keyframes shield{0%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
.noise{position:absolute;width:6px;height:6px;background:var(--cy);transition:left .32s ease-in,top .32s ease-in,opacity .32s}
.fxghost{position:absolute;width:24px;height:34px;border:1.5px solid var(--foe);border-radius:4px;background:var(--raised);transition:left .4s ease-in,top .4s ease-in,opacity .4s,transform .4s}
.spark{position:absolute;width:4px;height:4px;border-radius:2px;background:#ffd28a;transition:transform .4s ease-out,opacity .4s}
.after{position:absolute;opacity:.35;transition:opacity .3s,transform .3s;filter:drop-shadow(0 0 4px rgba(56,211,255,.8))}
#toast{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:18px;font-weight:700;letter-spacing:.14em;opacity:0;pointer-events:none;text-shadow:0 0 10px #000}
#toast.show{animation:toast 1.6s ease-out}
@keyframes toast{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}

/* overlay */
#ov{position:absolute;inset:0;background:rgba(5,9,14,.84);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;max-width:640px;width:100%;max-height:366px;overflow:auto}
.box h2{font-size:15px;margin:0 0 10px;letter-spacing:.04em}
.box .sub{color:var(--dim);margin:-6px 0 10px}
.box ul{margin:0 0 10px;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.row .sp{flex:1}
.btn{border:1px solid var(--cy);background:var(--cy);color:#04161e;font-weight:700;border-radius:6px;padding:7px 18px;text-align:center;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--cy)}
.btn:disabled{opacity:.35;cursor:default}
.cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:4px 0 12px}
.cards .card{position:relative;flex:none}
.cards .card.picked{transform:translateY(-6px)}
.opts{display:flex;gap:10px;justify-content:center;margin:4px 0 14px}
.opt{width:200px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.opt .ic svg{width:22px;height:22px}
.opt b{font-size:13px} .opt span{color:var(--dim);font-size:10.5px}
.opt.picked{border:1.5px solid var(--cy);box-shadow:0 0 0 3px rgba(56,211,255,.15)}
.mlist{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.mlist .opt{width:auto;flex-direction:row;align-items:center;padding:9px 12px}
.prow{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.ptile{width:92px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px}
.ptile .ic svg{width:22px;height:22px}
.ptile b{font-size:10.5px}
.ptile.dmg{border-color:var(--foe)} .ptile.dmg .ic{color:var(--foe2)}
.ptile .pips{margin:0}
.bodyline{display:flex;align-items:center;gap:6px;color:var(--fg2);font-family:var(--f-num);font-size:12px;margin:-4px 0 6px}
/* enemy info */
.ei{display:flex;gap:16px}
.ei-l{width:150px;flex:none;display:flex;flex-direction:column;gap:6px}
.ei-spr{height:110px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:radial-gradient(circle at 50% 60%,rgba(56,211,255,.06),transparent 70%)}
.ei-name{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700}
.ei-hp{font-family:var(--f-num);font-weight:700;font-size:24px;line-height:1}
.ei-hp span{font-size:13px;color:var(--dim)}
.ei-bar{position:relative;height:6px;border-radius:3px;background:#1c2937;overflow:hidden}
.ei-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--neutral)}
.ei-st{display:flex;gap:6px;flex-wrap:wrap}
.stchip{display:inline-flex;align-items:center;gap:3px;border:1px solid rgba(255,77,106,.5);border-radius:4px;padding:2px 6px;color:var(--foe2);font-family:var(--f-num);font-weight:700;font-size:12px}
.stchip .ic svg{width:12px;height:12px}
.stdesc{font-size:10.5px;color:var(--fg2);border-left:2px solid var(--foe);padding-left:6px}
.ei-r{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.seq{display:flex;align-items:center;gap:0;flex-wrap:nowrap;overflow-x:auto;padding:22px 0 6px}
.at{position:relative;width:76px;height:104px;flex:none;border:1.5px solid var(--foe);border-radius:8px;background:#1d1220;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.at .ty{position:absolute;left:6px;top:6px;color:var(--foe2)}
.at .ty svg{width:14px;height:14px}
.at .par{position:absolute;right:5px;top:5px;color:var(--just2)}
.at .par svg{width:16px;height:16px}
.at .v{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1}
.at .tp{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--fg2)}
.at .an{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9px;color:var(--dim)}
.at.ch{border-color:var(--just);background:#1b1733}
.at.ch .ty{color:var(--just2)}
.at.dl{border:1px solid #33495d;background:var(--raised)}
.at.dl .ty{color:var(--fg2)}
.at.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--cy)}
.at .nx{position:absolute;top:-20px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:3px;color:var(--cy);font-family:var(--f-num);font-weight:700;font-size:12px}
.conn{width:34px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--cy-dim);font-family:var(--f-num);font-weight:700;font-size:12px}
.conn b{color:var(--fg2)}
.loop{width:40px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--cy-dim);font-family:var(--f-num);font-weight:700;font-size:12px}
.loop b{color:var(--fg2)}
.pinfo{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pinfo .ic svg{width:36px;height:36px}
.pinfo .pips{width:150px}
.ckw{display:flex;flex-direction:column;gap:6px;font-size:10.5px;color:var(--fg2);flex:1;min-width:0}
.ckw b{color:var(--fg)}
/* 0.6.0: hand arrivals, timers, traits */
.tl.tl3{background:#1d2e40}
.mk.react{border-style:dashed}
.mk.react.ghost{opacity:.75}
.mk.sync{box-shadow:0 0 0 2px #0c141d,0 0 0 3.5px var(--foe)}
#strip{position:absolute;inset:0}
#stripLine{position:absolute;left:180px;top:150px;width:458px;height:1px;background:rgba(56,211,255,.14)}
.sm{position:absolute;top:143px;transition:left .13s linear,opacity .2s}
.sm.arr{width:10px;height:14px;margin-left:-5px;border:1.5px solid var(--cy-dim);border-radius:2px;background:#0d1d29}
.sm.arr.over{border-color:#6a2a3a;border-style:dashed;background:transparent}
.sm.tmr{top:142px;height:16px;padding:0 3px;margin-left:-12px;border:1.5px solid var(--cy);border-radius:4px;background:#0d2230;color:var(--cy);display:flex;align-items:center;gap:2px;font-family:var(--f-num);font-weight:700;font-size:10px}
.sm.tmr .ic svg{width:10px;height:10px}
#handCnt{position:absolute;left:8px;top:278px;width:66px;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--fg2);font-family:var(--f-num);font-size:12px;font-weight:700;transition:opacity .25s}
#handCnt .ic svg{width:14px;height:14px}
#handCnt.full{color:var(--foe2)}
#shaker.selfview #handCnt{opacity:0}
.cost.zero{border-style:dashed}
.st.trait{color:var(--foe2);opacity:.75}
.st.trait.on{opacity:1;filter:drop-shadow(0 0 4px rgba(255,77,106,.8))}
.pile.flash{border-color:var(--cy)}
.pin{position:absolute;width:12px;height:12px;border:2px solid var(--cy);transform:rotate(45deg);animation:pin .6s ease-out forwards}
@keyframes pin{0%{opacity:0;transform:rotate(45deg) scale(1.8)}40%{opacity:1;transform:rotate(45deg) scale(1)}100%{opacity:0}}
#redraw.wait b{color:var(--fg2)}
/* 待機ボタン(手札があっても待てるとき、入れ替えの下に出す) */
#waitBtn{display:none;position:absolute;left:742px;top:344px;width:92px;height:38px;border:1px solid #233446;border-radius:8px;background:var(--panel);color:var(--fg2);align-items:center;justify-content:center;gap:8px;transition:border-color .15s,box-shadow .15s,opacity .25s,transform .25s}
#waitBtn svg{width:16px;height:16px}
#waitBtn b{font-family:var(--f-num);font-size:18px;color:var(--fg2)}
#waitBtn.sel{border:1.5px solid var(--cy);box-shadow:0 0 14px rgba(56,211,255,.25)}
#waitBtn:disabled{opacity:.4;cursor:default}
#shaker.fw #waitBtn{display:flex}
#shaker.fw #redraw{height:38px;gap:6px}
#shaker.fw #redraw svg{width:16px;height:16px}
#shaker.fw #redraw b{font-size:18px}
#shaker.fw #redraw.sel{top:298px}
#shaker.selfview #waitBtn{opacity:0;pointer-events:none;transform:translateY(24px)}
/* 敵の行動の窓(構え・ガード・反撃の構え)と隙 */
.wb{position:absolute;height:9px;margin-left:-6px;border-radius:3px;display:flex;align-items:center;padding:0 3px;font-size:8px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;pointer-events:none;transition:left .13s linear,width .13s linear,opacity .2s,box-shadow .15s}
.wb.wind{background:rgba(255,184,77,.16);border:1px solid #c98a2e;color:#ffcf85}
.wb.guard{background:rgba(143,176,196,.16);border:1px solid #6f8ea2;color:#cfe3ef}
.wb.counter{background:rgba(255,77,106,.14);border:1px dashed var(--foe);color:var(--foe2)}
.wb.vuln{background:rgba(56,211,255,.14);border:1px solid var(--cy-dim);color:var(--cy)}
.wb.later{opacity:.5}
.wb.on{box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 10px currentColor}
.wb.out{opacity:0!important}
.mk.move{border:1px solid #3d5163;background:var(--raised);color:var(--fg2)}
.mk.unk{border:1px dashed #3d5163;background:transparent;color:var(--dim);opacity:.7}
.mk.multi b{font-size:11px}
.st.str{color:var(--foe2)}
.at .atr{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;padding:0 3px;border-radius:3px;font-size:9px;font-weight:700;line-height:13px;white-space:nowrap}
.chip.wind{background:rgba(255,184,77,.16);color:#ffcf85} .chip.guard{background:rgba(143,176,196,.18);color:#cfe3ef}
.chip.counter{background:rgba(255,77,106,.16);color:var(--foe2)} .chip.vuln{background:rgba(56,211,255,.14);color:var(--cy)}
.chip.buff{background:rgba(255,77,106,.16);color:var(--foe2)} .chip.multi{background:#22303d;color:var(--fg2)}
.seqh{font-size:10px;color:var(--dim);margin:6px 0 -14px}
.ei-r.two .seq{padding:18px 0 2px}
.ei-r.two .at{height:86px}
.ei-r.two .at .v{font-size:22px}
.ei-r.two .seqh{margin:2px 0 -14px}
.ei-r.two .traits{gap:3px;margin-top:4px}
.conn.alt{width:18px;color:var(--dim)}
.at.mv{border:1px solid #33495d;background:var(--raised)}
.at.mv .ty{color:var(--fg2)}
.box.wide{max-width:800px}
.sm.tb{top:30px;height:128px;width:0;margin-left:-1px;border-left:1.5px dashed var(--cy-dim);opacity:.8}
.st.arm{color:#cfe3ef} .st.mark{color:var(--foe2)}
.dbg-sum{font-size:11px;color:var(--fg2);margin:-4px 0 10px}
.dbg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.dbg-grid .opt{width:auto;padding:8px 10px;gap:3px}
.opt.sel{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy)}
.dbg-h{font-size:10.5px;color:var(--dim);margin:8px 0 4px}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--fg2);border-radius:5px;padding:5px 10px;font-size:11.5px}
.seg button.on{border-color:var(--cy);color:var(--cy);background:#0d2230}
.dcard{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:11.5px;background:var(--bg)}
.dcard i{font-style:normal;font-family:var(--f-num);font-weight:700;color:var(--cy);width:12px;text-align:center}
.dcard span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard b{font-family:var(--f-num);width:16px;text-align:center}
.dcard b.z{color:var(--dim2)}
.dcard button{width:26px;height:24px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);padding:0;font-size:15px;line-height:1}
.dslot{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.dslot .dn{width:44px;flex:none;font-size:11px;color:var(--fg2);display:flex;gap:4px;align-items:center}
.fshield{position:absolute;width:70px;height:84px;margin:-42px 0 0 -35px;border:1.5px solid rgba(207,227,239,.85);border-radius:45%;box-shadow:0 0 12px rgba(143,176,196,.5);animation:shield .5s ease-out forwards}
.traits{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.trait-row{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--fg2)}
.trait-row .ic{color:var(--foe2)} .trait-row b{color:var(--fg)}
.card.src{border-style:dashed}
.gain{display:flex;align-items:center;gap:5px;justify-content:center;font-family:var(--f-num);font-weight:700;font-size:14px;color:var(--fg);margin:0 0 10px}
.gain .ic svg{width:14px;height:14px}
.bodyline .ic svg{width:12px;height:12px}
/* shop / parts offer */
.shop{display:flex;gap:14px;align-items:flex-start;justify-content:center;margin-bottom:10px}
.shop .cards{margin:0;flex-wrap:nowrap}
.sitem{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px}
.sitem.sold{height:158px;border:1px dashed var(--line);border-radius:8px}
.price{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--fg)}
.price.no{color:var(--dim2)}
.svc{display:flex;flex-direction:column;gap:8px}
.svc .opt{width:170px;padding:9px 10px;gap:4px}
.opt.off{opacity:.45}
.popt{width:250px}
.pt-h{display:flex;align-items:center;gap:5px;color:var(--fg2);font-size:10.5px;width:100%}
.pt-h .ic svg{width:14px;height:14px}
.pt-m{margin-left:auto;font-family:var(--f-num)}
.opt .pt-cur{font-size:9.5px;color:var(--dim2)}
/* 敵の詳細: カメラが敵に寄る */
#shaker.focus #world{transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .32s}
#shaker.focus #tl,#shaker.focus #droid,#shaker.focus #meInfo,#shaker.focus .cinfo{opacity:0;transition:opacity .25s}
#shaker.focus .foe:not(.fo){opacity:.08}
#shaker.focus #parts,#shaker.focus #hand,#shaker.focus .pile,#shaker.focus #redraw,#shaker.focus #waitBtn,#shaker.focus #handCnt,#shaker.focus #menuBtn,#shaker.focus #handShade{opacity:0;pointer-events:none;transition:opacity .2s}
#focus{position:absolute;inset:0;z-index:30;padding:16px 0 12px 24px;width:470px;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transform:translateX(-16px);transition:opacity .3s .1s,transform .3s .1s;
  background:linear-gradient(90deg,var(--bg) 0,rgba(10,15,21,.96) 74%,transparent)}
#shaker.focus #focus{opacity:1;pointer-events:auto;transform:none}
#shaker.focus::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 260px 220px at 650px 212px,transparent 40%,rgba(10,15,21,.6))}
.fhead{display:flex;align-items:center;gap:8px;padding-right:24px}
#focus>*{flex:none}
.fhead b{font-size:18px;letter-spacing:.04em}
.fhp{display:flex;align-items:center;gap:4px;font-family:var(--f-num)}
.fhp b{font-size:24px;line-height:1} .fhp>span:not(.ei-bar){color:var(--dim);font-size:12px;margin:5px 10px 0 0}
.fst{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--fg2);padding:1px 6px;border:1px solid var(--line);border-radius:4px;margin-right:4px}
.fst.f{color:var(--foe2)} .fst .g{font-family:var(--f-body);font-size:10px} .fst .ic svg{width:11px;height:11px}
#focus .ei-bar{display:block;width:180px;margin-right:10px}
.fmoves{display:flex;flex-direction:column;gap:6px}
.frow-m{display:flex;align-items:center;gap:0;padding-top:12px}
.fnote{font-size:10.5px;color:var(--dim);margin-top:2px}
.fm{position:relative;width:46px;height:50px;flex:none;border:1px solid #2a3b4c;border-radius:7px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--fg);transition:border-color .15s,box-shadow .15s,transform .15s}
.fm.atk{border-color:rgba(255,77,106,.55)} .fm.ch{border-color:rgba(177,140,255,.75)} .fm.dl{border-color:#2d4a5c}
.fm.on{border-width:2px;border-color:var(--cy);box-shadow:0 0 0 3px rgba(56,211,255,.15);transform:translateY(-2px)}
.fm-v{display:flex;align-items:baseline;gap:1px;font-family:var(--f-num);line-height:1}
.fm-v b{font-size:19px} .fm-v b.g{font-family:var(--f-body);font-size:16px;color:var(--fg2)} .fm-v i{font-style:normal;font-size:10px;color:var(--fg2)}
.fm.ch .fm-v b{color:var(--just2)}
.fm-v .ic svg{width:13px;height:13px}
.fm-p{height:12px;font-size:9px;color:var(--dim);display:flex;align-items:center} .fm-p .ic svg{width:11px;height:11px}
.fm-now{position:absolute;top:-13px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;font-family:var(--f-num);font-weight:700;font-size:10px;color:var(--cy)}
.fm-now .ic svg{width:9px;height:9px}
.fg{width:22px;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:var(--f-num);font-size:10px;color:var(--dim)}
.fg i{display:block;width:14px;height:1px;background:#33495d}
.fg.r{width:8px}
.fg.loop{width:34px;flex-direction:row;gap:3px;justify-content:center} .fg.loop .ic svg{width:16px!important;height:11px!important}
.fdet{margin-top:6px;border-left:2px solid var(--cy-dim);padding:2px 0 2px 10px;max-width:400px}
.fdet.ch{border-left-color:var(--just)}
.fdn{font-weight:700;font-size:14px;margin-bottom:3px}
.fdet p,.ftr p{margin:0;font-size:11.5px;line-height:1.55;color:var(--fg2)}
.fdet b,.ftr b{color:var(--fg)}
.ftr{max-width:400px;padding-top:4px;border-top:1px solid var(--line)}
.ftr p{font-size:10.5px}
.fclose{margin-left:auto;padding:4px 14px}
/* 交換の確認(2枚目の重ね) */
#ov2{position:absolute;inset:0;background:rgba(5,9,14,.6);display:flex;align-items:center;justify-content:center;z-index:55;padding:12px}
#ovbox2{max-width:520px;border-color:var(--cy-dim);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.swap{display:flex;align-items:stretch;gap:10px;margin:4px 0 14px}
.sw-p{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sw-p:last-child{border:1.5px solid var(--cy)}
.sw-p b{font-size:13px} .sw-p>span{color:var(--dim);font-size:10.5px}
.sw-p .sw-dmg{color:var(--foe2);font-weight:700}
.sw-ar{align-self:center;color:var(--cy);display:flex} .sw-ar svg{width:18px;height:18px}
/* 部屋(整備・ショップ・イベント) */
#roomScr{position:absolute;inset:0;z-index:41;background:var(--bg)}
.rs-still{position:absolute;left:12px;top:52px;width:330px;bottom:12px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(ellipse 200px 160px at 50% 55%,rgba(56,211,255,.08),transparent 70%),linear-gradient(180deg,#0f1822,#0a1018);display:flex;align-items:center;justify-content:center;color:var(--cy-dim)}
.rs-still .ic svg{width:72px;height:72px;opacity:.5}
.rs-main{position:absolute;left:358px;right:12px;top:52px;bottom:12px;display:flex;flex-direction:column;overflow:auto}
.rs-main.full{left:12px}
.rs-main h2{font-size:16px;margin:2px 0 10px;letter-spacing:.04em}
.rs-text{color:var(--fg2);margin:0 0 12px;line-height:1.6}
.rs-opts{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.rs-opts .opt{width:auto;flex-direction:row;align-items:center;gap:10px;padding:12px 14px}
.rs-opts .opt span:last-child{margin-left:auto}
.rs-main .row{margin-top:auto}
.rs-main.full .shop{flex:1;padding-top:8px}
/* map */
#mapScr{position:absolute;inset:0;z-index:40;background:radial-gradient(ellipse 520px 260px at 420px 200px,rgba(56,211,255,.05),transparent 70%),var(--bg)}
.mh-bar{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid var(--line);background:rgba(15,23,32,.85)}
.mh-bar b{font-size:13px;letter-spacing:.06em}
.mb{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--fg2)}

  const a = selAction(); if(!a) return null;

    const c = EN.clone(S); const p = EN.beginAction(c, a); const g = EN.spendGen(c, p.cost, p.k, p.t, noInt), evs = [];

function cardType(c){ return c.junk ? 'junk' : c.timer ? 'timer' : c.parry ? 'parry' : c.dmg ? c.dmg.t : c.block ? 'block' : c.delay ? 'delay' : c.swift ? 'swift' : c.draw ? 'draw' : 'crack'; }

function cardVals(c, st){

const WIN = {wind:'構', guard:'防', counter:'返'};

function renderMarks(){
  const b = S.b, seen = new Set(), seenB = new Set(), syn = syncTimes(), pv = PV && !busy ? PV : null;
  for(const e of b.foes){
    if(!e.alive) continue;
    const y = ROWY[e.i] - 11, by = ROWY[e.i] + 12, list = EN.upcoming(e);
    let lastT = 0;
    for(const m of list){
      const key = e.i + '-' + (e.seq + m.k) + '-' + m.left; seen.add(key);
      const a = m.a, sy = syn.has(e.i + '@' + m.t), atk = a.kind !== 'delay' && a.d > 0;
      let cls = 'mk ' + (a.kind === 'delay' ? 'dl' : a.ch ? 'ch' : atk ? 'hit' : 'move');
      if(m.k > 0 && !a.ch) cls += ' later';

        const bk = 'b' + key + w; seenB.add(bk);
        const val = w === 'wind' ? W.poise : w === 'guard' ? (m.k === 0 ? e.sh : W.s) : W.d;
        const on = pv && m.k === 0 && pv.fx.has((w === 'wind' ? 'break' : w === 'guard' ? 'guarded' : 'counter') + ':' + e.i);
        placeBand(bk, s0 >= 1 ? xs(s0) : NOW + 6, xs(Math.min(s1, VIEW)) + 6, by, 'wb ' + w + (m.k > 0 ? ' later' : '') + (on ? ' on' : ''), WIN[w] + val);

    }

    }

  }

  }
}

function pickLine(t){ return Array.isArray(t) ? t[Math.floor(Math.random() * t.length)] : t; }
function fillLine(t, v){ return pickLine(t).replace(/\{(\w+)\}/g, (m, k) => v[k] ?? m); }
function monologue(){
  const b = S.b, run = S.run, L = DATA.lines, hit = {};
  if(run.body < run.bodyMax * 0.4) hit.bodyLow = {};
  const br = SLOTS.find(p => b.parts[p.id].cur <= 0); if(br) hit.partBroken = {part: br.fn};
  for(const e of b.foes){ if(!e.alive || hit.chargeSoon) continue; for(const m of EN.upcoming(e)) if(m.a.ch && m.t <= 9){ hit.chargeSoon = {enemy: e.name, move: m.a.n, t: m.t}; break; } }
  for(const e of b.foes){ if(!e.alive) continue; if(e.vuln > 1 && !hit.vulnNow) hit.vulnNow = {enemy: e.name}; const a = EN.cur(e); if(a.wind && e.r > 0 && e.r <= a.wind.w + 2 && !hit.windNow) hit.windNow = {enemy: e.name, move: a.n, poise: a.wind.poise}; }
  if(!b.hand.length) hit.handEmpty = {};
  const worn = SLOTS.find(p => run.parts[p.id].damaged); if(worn) hit.partWorn = {part: worn.fn};
  const sum = {}; for(const e of b.foes){ if(!e.alive) continue; for(const m of EN.upcoming(e)) if(m.a.kind !== 'delay') sum[m.a.p] = (sum[m.a.p] || 0) + m.a.d; }
  const top = Object.entries(sum).sort((a, c) => c[1] - a[1])[0];
  if(top && top[1] >= 10) hit.focus = {part: SLOT_BY[top[0]].fn};
  for(const r of L.rules) if(hit[r.when]) return fillLine(r.text, hit[r.when]);
  const a = L.room[UI.node ? UI.node.type : 'battle']; return a ? pickLine(a) : '';
}
function memChips(list){

  return Object.keys(counts).sort((a, c) => CARDS[a].cost - CARDS[c].cost || CARDS[a].name.localeCompare(CARDS[c].name))

/* ---------- fx ---------- */
function fxEl(cls, x, y, css){ const el = document.createElement('div'); el.className = cls; el.style.left = x + 'px'; el.style.top = y + 'px'; if(css) Object.assign(el.style, css); $('#fx').appendChild(el); return el; }
function floatAt(x, y, text, cls){ const el = document.createElement('div'); el.className = 'float ' + (cls || ''); el.textContent = text; el.style.left = x + 'px'; el.style.top = y + 'px'; $('#floats').appendChild(el); setTimeout(() => el.remove(), 950); }
function pulse(el, cls, ms){ if(!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
function shake(){ pulse($('#shaker'), 'shake', 300); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
const partY = id => 10 + SLOTS.findIndex(p => p.id === id) * 48;
function beam(to, from){
  const f = from || {x: DROID.sx, y: DROID.sy};
  const dx = to.x - f.x, dy = to.y - f.y, len = Math.hypot(dx, dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
  const el = fxEl('beam', f.x, f.y, {width: len + 'px', transform: `rotate(${ang}deg)`});
  setTimeout(() => el.remove(), 320);
}
function shards(x, y, color){
  for(let k = 0; k < 6; k++){
    const el = fxEl('shard', x - 4, y - 1); if(color) el.style.background = color;
    const a = Math.random() * Math.PI * 2, r = 26 + Math.random() * 16;
    el.getBoundingClientRect();
    el.style.transform = `translate(${Math.cos(a) * r}px,${Math.sin(a) * r}px) rotate(${a * 57}deg)`; el.style.opacity = '0';
    setTimeout(() => el.remove(), 480);
  }
}
function sparks(x, y){
  for(let k = 0; k < 7; k++){
    const el = fxEl('spark', x, y); const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, r = 14 + Math.random() * 20;
    el.getBoundingClientRect(); el.style.transform = `translate(${Math.cos(a) * r}px,${Math.sin(a) * r}px)`; el.style.opacity = '0';
    setTimeout(() => el.remove(), 450);
  }
}
function afterimage(){
  const src = $('#droid svg').cloneNode(true), el = fxEl('after', 108, 142); el.appendChild(src);
  el.getBoundingClientRect(); el.style.transform = 'translateX(-14px)'; el.style.opacity = '0';
  setTimeout(() => el.remove(), 320);
}
function shieldFx(){ const el = fxEl('shield', 92, 136); setTimeout(() => el.remove(), 560); }
function cardMotion(k, ti){
  const c = CARDS[k], d = $('#droid'), t = cardType(c);
  const targets = c.all ? S.b.foes.filter(e => e.alive).map(e => e.i) : (c.tgt && ti != null ? [ti] : []);
  if(t === 'phys'){ pulse(d, 'lunge', 380); for(const i of targets){ const p = foeCenter(i); const el = fxEl('slash', p.x, p.y - 10); setTimeout(() => el.remove(), 260); } }
  else if(t === 'opt'){ pulse(d, 'recoil', 320); for(const i of targets) beam(foeCenter(i)); }
  else if(t === 'block' || t === 'parry') shieldFx();
  else if(t === 'timer'){ pulse(d, 'recoil', 320); for(const i of targets){ const p = foeCenter(i); const el = fxEl('pin', p.x - 6, p.y - 70); setTimeout(() => el.remove(), 600); } }
  else if(t === 'delay' || t === 'crack'){
    pulse(d, 'glitch', 320);
    for(const i of targets){
      const p = foeCenter(i);
      for(let k2 = 0; k2 < 5; k2++){
        const el = fxEl('noise', DROID.sx + k2 * 4, DROID.sy + (k2 % 2) * 8); el.getBoundingClientRect();
        setTimeout(() => { el.style.left = (p.x + (k2 - 2) * 6) + 'px'; el.style.top = (p.y - 20 + k2 * 5) + 'px'; el.style.opacity = '0'; }, k2 * 30);
        setTimeout(() => el.remove(), 420);
      }
    }
  }
  else if(t === 'swift'){ afterimage(); setTimeout(afterimage, 90); }
  else if(t === 'draw') pulse($('#pileDraw'), 'flash', 360);
}
function cardFx(x){
  switch(x.kind){
    case 'dmg': { const p = foeCenter(x.e); floatAt(p.x, p.y - 62, '−' + x.n, 'foe'); pulse(foeEl(x.e), 'ehit', 280); break; }
    case 'kill': { const p = foeCenter(x.e); shards(p.x, p.y, '#d3e2ee'); break; }
    case 'crack': { const p = foeCenter(x.e); floatAt(p.x + 30, p.y - 40, '+' + x.n, 'foe'); break; }
    case 'delay': floatAt(xs(2), ROWY[x.e] - 14, '+' + x.n, 'cy'); break;
    case 'block': floatAt(130, 262, '+' + x.n, ''); break;
    case 'swift': floatAt(150, 262, '+' + x.n, 'cy'); break;
    case 'draw': if(x.n) floatAt(41, 290, '+' + x.n, 'cy'); break;
    case 'timerSet': floatAt(xs(x.t), STRIP_Y - 10, '◆', 'cy'); break;
    case 'guarded': { const p = foeCenter(x.e); const el = fxEl('fshield', p.x, p.y - 10); setTimeout(() => el.remove(), 520); floatAt(p.x + 26, p.y - 46, '防' + x.n, ''); break; }
    case 'armored': { const p = foeCenter(x.e); floatAt(p.x + 26, p.y - 46, '装' + x.n, ''); break; }
    case 'vulnHit': { const p = foeCenter(x.e); floatAt(p.x - 26, p.y - 46, '×1.5', 'cy'); break; }
    case 'break': { justFx(x.e); const p = foeCenter(x.e); floatAt(p.x, p.y - 84, '崩し', 'cy'); break; }
    case 'counter': { const p = foeCenter(x.e); floatAt(p.x, p.y - 84, '返', 'foe'); beam({x: DROID.sx, y: DROID.sy}, {x: p.x, y: p.y - 10}); hitMeFx(x.res); break; }
  }
}
// 自分が撃たれたときの演出(敵の攻撃と反撃で共通)
function hitMeFx(r){
  const y = partY(r.part);
  if(r.blocked) pulse($('#stBlk'), 'flash', 360);
  if(r.partLoss){ floatAt(70, y + 8, '−' + r.partLoss, 'foe'); pulse(document.querySelector(`.part[data-p="${r.part}"]`), 'flash', 320); }
  if(r.broke) sparks(DROID.x, DROID.y - 30);
  if(r.bodyLoss) floatAt(150, 268, '−' + r.bodyLoss, 'foe');
  if(r.hurt){ pulse($('#droid'), 'hit', 320); if(r.raw >= 10) shake(); }
  else shieldFx();
}
async function foeFx(i, r){
  const e = S.b.foes[i];
  pulse(foeEl(i), 'atk', 270);
  const mk = r.react ? markEls.get('r' + i) : markEls.get(r.chainLeft > 0 ? `${i}-${e.seq}-${r.chainLeft}` : `${i}-${e.seq - 1}-0`);
  if(mk) mk.classList.add('fire');
  await sleep(110);
  if(r.kind === 'move'){
    const p = foeCenter(i);
    if(r.buff) floatAt(p.x, p.y - 70, '▲' + r.buff, 'foe');
    if(r.armor){ const el = fxEl('fshield', p.x, p.y - 10); setTimeout(() => el.remove(), 520); floatAt(p.x, p.y - 70, '装+' + r.armor, ''); }
    if(r.heal) floatAt(p.x, p.y - 70, '+' + r.heal, 'cy');
    if(r.mark){ floatAt(DROID.x + 10, DROID.y - 92, '照準+' + r.mark, 'foe'); pulse($('#droid'), 'glitch', 320); }
    if(r.noise){ floatAt(41, 300, 'ノイズ+' + r.noise, 'foe'); pulse($('#pileDraw'), 'flash', 360); }
    if(r.summon != null){ buildFoes(); floatAt(foeCenter(r.summon).x, 150, '増援', 'foe'); }
    return;
  }
  if(r.kind === 'delay'){
    if(r.applied){ pulse($('#droid'), 'glitch', 320); floatAt(xs(1), 30, '+' + r.v, 'cy'); if(r.swift) setTimeout(afterimage, 120); }
    return;
  }
  if(r.kind === 'parried'){
    shieldFx(); const p = foeCenter(i); beam(p, {x: DROID.sx + 10, y: DROID.sy + 20});
    for(const x of r.ev) cardFx(x);
    floatAt(DROID.x + 10, DROID.y - 92, DATA.kwName.just, 'cy');
    return;
  }
  hitMeFx(r);
}
function justFx(i){
  const el = fxEl('burst', NOW, ROWY[i]); setTimeout(() => el.remove(), 520);
  shards(NOW, ROWY[i], null);
  pulse(foeEl(i), 'ejust', 460);
}
function interruptFx(){
  const bar = $('#selfBar'); bar.hidden = false; bar.className = 'np broken';
  setTimeout(() => bar.classList.remove('broken'), 400);
  pulse($('#droid'), 'stagger', 420);
  const g = fxEl('fxghost', DROID.x - 12, DROID.y - 40); g.getBoundingClientRect();

/* ---------- play ---------- */
function defaultTarget(){ const b = S.b; if(b.foes[lastTarget] && b.foes[lastTarget].alive) return lastTarget; const e = b.foes.find(f => f.alive); return e ? e.i : 0; }
function recalc(){ PV = computePreview(); renderAll(); }
function onCard(i){
  const k = S.b.hand[i].k, c = CARDS[k];
  if(sel && sel.kind === 'card' && sel.i === i){ execute(); return; }
  sel = {kind:'card', i, k, target: c.tgt ? defaultTarget() : null}; recalc();
}
function onWait(){
  if(sel && sel.kind === 'wait'){ execute(); return; }
  sel = {kind:'wait'}; recalc();
}
function onRedraw(){
  if(!RULE.econ && RULE.freeWait && !S.b.hand.length) return;
  const kind = rdKind();
  if(sel && sel.kind === kind){ execute(); return; }
  sel = {kind}; recalc();
}
function onFoe(i){
  const e = S.b.foes[i]; if(!e.alive) return;
  if(sel && sel.kind === 'card' && CARDS[sel.k].tgt){
    if(sel.target === i){ execute(); return; }
    sel.target = i; lastTarget = i; recalc(); return;
  }
  if(!sel) infoFoe(i);
}
function flyCard(el, x, y){
  if(!el) return;
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = 'scale(.25) rotate(12deg)'; el.style.opacity = '0';
  setTimeout(() => el.remove(), 260);
}
// 耐久が減って行動が変わった敵を知らせる
function phaseCheck(){ for(const e of S.b.foes){ if(e.phased && !e._phaseShown && e.alive){ e._phaseShown = true; const p = foeCenter(e.i); floatAt(p.x, p.y - 96, '!!', 'foe'); pulse(foeEl(e.i), 'ejust', 460); } } }
async function showEvent(ev, k, ti){
  if(ev.type === 'card' || ev.type === 'timer' || ev.type === 'foe') setTimeout(phaseCheck, 0);
  switch(ev.type){
    case 'tick': if(!ev.real) afterimage(); renderAll(); await sleep(ev.real ? T_TICK : T_SWIFT); break;
    case 'react': { const p = foeCenter(ev.e); floatAt(p.x, p.y - 70, '!', 'foe'); pulse(foeEl(ev.e), 'ehit', 200); renderAll(); await sleep(180); break; }
    case 'just': justFx(ev.e); renderAll(); await sleep(420); break;
    case 'card': if(k) cardMotion(k, ti); for(const x of ev.ev) cardFx(x); renderAll(); await sleep(320); break;
    case 'timer': { const p = foeCenter(ev.t.e); const el = fxEl('burst', p.x, p.y - 10); setTimeout(() => el.remove(), 520); for(const x of ev.ev) cardFx(x); renderAll(); await sleep(320); break; }
    case 'turn': {
      const ids = new Set(S.b.hand.map(c => c.id));
      for(const [id, el] of cardEls) if(!ids.has(id)){ cardEls.delete(id); flyCard(el, 20, 340); }
      floatAt(NOW + 8, STRIP_Y - 14, '区切り', 'cy');
      renderAll(); await sleep(380); break;
    }
    case 'arrive': if(ev.r && ev.r.burn) floatAt(41, 290, '溢', 'foe'); renderAll(); await sleep(90); break;
    case 'foe': await foeFx(ev.e, ev.res); renderAll(); await sleep(190); break;
    case 'interrupt': interruptFx(); renderAll(); await sleep(420); break;
  }
}
async function execute(){
  const s = sel, b = S.b, a = selAction(); sel = null; PV = null; busy = true; UI.view = 'normal';
  if(a.type === 'card'){
    if(a.t != null) lastTarget = a.t;
    const cd = b.hand[a.i], el = cardEls.get(cd.id); cardEls.delete(cd.id); flyCard(el, DROID.x - 48, DROID.y - 60);
  } else if(a.type === 'swap' || a.type === 'reload'){
    b.hand.forEach((cd, n) => { const el = cardEls.get(cd.id); cardEls.delete(cd.id); setTimeout(() => flyCard(el, 20, 340), n * 30); });
  }
  const p = EN.beginAction(S, a);
  $('#droid').classList.add('casting');
  renderAll();
  const g = EN.spendGen(S, p.cost, p.k, p.t, false); let r;
  while(!(r = g.next()).done) await showEvent(r.value, p.k, p.t);
  $('#droid').classList.remove('casting');
  const out = r.value;
  EN.endAction(S, p, out);
  if(out.dead){ renderAll(); await sleep(350); onLose(); busy = false; return; }
  if(out.won){ b.over = true; renderAll(); await sleep(500); onWin(); busy = false; return; }
  busy = false;
  renderAll();
}

/* ---------- run & map ---------- */
function newRun(){
  hideOv();
  const seed = Math.floor(Math.random() * 1e9);
  S = {run: EN.newRun(seed), b: null};
  UI.mapSel = null; UI.node = null;
  showMap();
}
const nodeKey = n => n.type === 'boss' ? 'boss' : n.lane + '-' + n.idx;
const MAPX = [52, 168, 276, 384, 492, 600, 736], MAPY = [112, 192, 272];
function nodePos(n){ return n.type === 'boss' ? {x: MAPX[6], y: MAPY[1]} : {x: MAPX[n.idx + 1], y: MAPY[n.lane]}; }
function encFoes(enc){ const c = {}; for(const f of ENC[enc].foes){ const nm = FOES[f].name; c[nm] = (c[nm] || 0) + 1; } return Object.entries(c).map(([n, k]) => k > 1 ? `${n}×${k}` : n).join('・'); }
function showMap(){
  UI.screen = 'map'; UI.view = 'normal'; sel = null; PV = null;
  const run = S.run, m = run.map, reach = new Set(EN.nextNodes(run).map(nodeKey)), visited = new Set(run.visited);
  const atKey = run.at ? (run.at.boss ? 'boss' : run.at.lane + '-' + run.at.idx) : 'start';
  const all = [...m.nodes.flat(), m.boss];
  const T = DATA.area.transferAfter;
  let lines = '';
  const ln = (a, c, cls) => { lines += `<line x1="${a.x}" y1="${a.y}" x2="${c.x}" y2="${c.y}" class="${cls}"/>`; };
  const st = {x: MAPX[0], y: MAPY[1]};
  for(const row of m.nodes){
    const n0 = row[0]; ln(st, nodePos(n0), visited.has(nodeKey(n0)) ? 'ed vis' : 'ed');
    for(let i = 0; i < row.length - 1; i++){
      const a = row[i];
      const nexts = i === T - 1 ? EN.reachAfter(a.lane, m.nodes.length).map(l => m.nodes[l][i + 1]) : [row[i + 1]];
      for(const c of nexts) ln(nodePos(a), nodePos(c), (visited.has(nodeKey(a)) && visited.has(nodeKey(c)) ? 'ed vis' : 'ed') + (i === T - 1 ? ' tr' : ''));
    }
    ln(nodePos(row[row.length - 1]), nodePos(m.boss), 'ed');
  }
  const btn = n => {
    const k = nodeKey(n), p = nodePos(n), E = n.enc ? ENC[n.enc] : null;
    const cls = ['mn', n.type, reach.has(k) ? 'reach' : '', visited.has(k) ? 'done' : '', UI.mapSel === k ? 'sel' : '', atKey === k ? 'here' : ''].filter(Boolean).join(' ');
    return `<button class="${cls}" type="button" data-act="node" data-arg="${k}" style="left:${p.x}px;top:${p.y}px" aria-label="${DATA.rooms[n.type].name}"><span class="ic">${IC[n.type]}</span></button>`;
  };
  const labels = m.lanes.map((k, l) => `<span class="lane" style="top:${MAPY[l] - 40}px;left:${MAPX[1]}px">${DATA.lanes[k].name}の道</span>`).join('');
  const s = UI.mapSel ? all.find(n => nodeKey(n) === UI.mapSel) : null;
  let info = '';
  if(s){
    const E = s.enc ? ENC[s.enc] : null;
    info = `<span class="ic">${IC[s.type]}</span><b>${DATA.rooms[s.type].name}</b>${s.type !== 'boss' ? `<span class="mi-l">${DATA.lanes[m.lanes[s.lane]].name}の道</span>` : ''}`;

const LEARN_BIAS = 1.3;
function learnOptions(n){
  const near = new Set(ENC[UI.node.enc].foes.flatMap(k => FOES[k].pool || []));
  const pool = Object.keys(CARDS).filter(k => !CARDS[k].junk && !['charge','scatter'].includes(k)).map(k => ({k, w: near.has(k) ? LEARN_BIAS : 1}));
  const out = [];
  while(out.length < n && pool.length){
    let x = Math.random() * pool.reduce((a, c) => a + c.w, 0), i = 0;
    for(; i < pool.length - 1; i++){ x -= pool[i].w; if(x <= 0) break; }
    out.push(pool.splice(i, 1)[0].k);
  }
  return out;
}
function afterWin(){
  const n = UI.node;

function startDebugBattle(enc){
  const run = EN.newRun(Math.floor(Math.random() * 1e9));
  run.deck = DBG.deck.slice();
  for(const p of SLOTS) run.parts[p.id] = {id: DBG.parts[p.id], damaged: false};
  run.body = run.bodyMax = DBG.body;
  S = {run, b: null};
  const custom = enc === 'dbg';
  if(custom) ENC.dbg = {fam:'自由', foes: DBG.custom.filter(Boolean)};
  const E = ENC[enc];
  UI.node = {type: E.boss ? 'boss' : E.elite ? 'elite' : 'battle', enc, debug: true};
  UI.dbgEnc = enc; hideOv();
  startBattle(UI.node);
  if(custom) delete ENC.dbg; // 地図の生成に混ざらないように
  // 敵の攻撃と耐久の倍率
  const sc = x => Math.max(1, Math.round(x * DBG.dmg));
  const fixPat = pat => pat.map(a => { const o = JSON.parse(JSON.stringify(a)); if(o.d > 0) o.d = sc(o.d); if(o.counter) o.counter.d = sc(o.counter.d); return o; });
  for(const e of S.b.foes){
    e.hp = e.maxHp = Math.max(1, Math.round(e.maxHp * DBG.hp));
    e.pat = fixPat(e.pat);
    if(e.phase) e.phase = {at: e.phase.at, pat: fixPat(e.phase.pat)};
    if(e.react) e.react = {...e.react, d: sc(e.react.d)};
  }
  renderAll();
}

function showOv(html, closable, wide){ const ov = $('#ov'); $('#ovbox').innerHTML = html; $('#ovbox').classList.toggle('wide', !!wide); ov.dataset.closable = closable ? '1' : ''; ov.hidden = false; }
function hideOv(){ $('#ov').hidden = true; }

function act(a, arg, el){
  switch(a){
    case 'close': hideOv(); break;
    case 'foeMove': if(UI.focus){ UI.focus.sel = arg; renderFocus(); } break;
    case 'foeClose': closeFocus(); break;
    case 'menu': if(!busy) showMenu(); break;
    case 'rules': showRules(false); break;
    case 'deck': infoDeck(); break;
    case 'fs': goFull(); break;
    case 'debug': if(!DBG) dbgLoad(); UI.pick = DBG.enc; showDebug(); break;
    case 'dbgPick': UI.pick = UI.pick === arg ? null : arg; DBG.enc = UI.pick; dbgSave(); showDebug(); break;
    case 'dbgGo': if(UI.pick && (UI.pick !== 'dbg' || DBG.custom.some(Boolean))){ const k = UI.pick; UI.pick = null; startDebugBattle(k); } break;
    case 'dbgAgain': startDebugBattle(UI.dbgEnc); break;
    case 'dbgView': ({deck:showDebugDeck, parts:showDebugParts, nums:showDebugNums, custom:showDebugCustom})[arg](); break;
    case 'dbgBack': showDebug(); break;
    case 'dbgPreset': DBG.deck = DBG_PRESET[arg](); dbgSave(); showDebugDeck(); break;
    case 'dbgCard': { const [k, d] = arg.split(':'); if(+d > 0) DBG.deck.push(k); else { const i = DBG.deck.lastIndexOf(k); if(i >= 0) DBG.deck.splice(i, 1); } dbgSave(); showDebugDeck(); break; }
    case 'dbgPart': { const [sl, id] = arg.split(':'); DBG.parts[sl] = id; dbgSave(); showDebugParts(); break; }
    case 'dbgNum': { const [key, v] = arg.split(':'); DBG[key] = +v; dbgSave(); applyEcon(); showDebugNums(); break; }
    case 'dbgCls': DBG.cls = arg; dbgSave(); applyEcon(); showDebugNums(); break;
    case 'dbgWait': DBG.wait = arg === 'c' ? null : arg === '1'; dbgSave(); applyEcon(); showDebugNums(); break;
    case 'dbgSlot': { const [i, k] = arg.split(':'); DBG.custom[+i] = k || null; dbgSave(); showDebugCustom(); break; }
    case 'restart': UI.pick = null; UI.learnOpts = []; newRun(); break;
    case 'retry': S = {run: JSON.parse(snapshot), b: null}; hideOv(); startBattle(UI.node); break;
    case 'node': UI.mapSel = UI.mapSel === arg ? null : arg; showMap(); break;
    case 'go': { const n = findNode(UI.mapSel); if(EN.nextNodes(S.run).some(x => nodeKey(x) === UI.mapSel)) enterRoom(n); break; }
    case 'afterWin': UI.pick = null; hideOv(); afterWin(); break;
    case 'pick': {
      UI.pick = UI.pick === arg ? null : arg;
      const v = el.dataset.view;
      ({learn:showLearn, rest:showRest, defrag:showDefrag, shop:showShop, event:showEventRoom, part:showPartOffer})[v]();
      break;
    }
    case 'learn': if(UI.pick){ S.run.deck.push(UI.pick); afterLearn(); } break;
    case 'skipLearn': afterLearn(); break;
    case 'takePart': if(UI.pick) showSwap(); break;
    case 'swapBack': hideOv2(); break;
    case 'swapGo': if(UI.pick){ const d = PARTDEF[UI.pick]; S.run.parts[d.slot] = {id:UI.pick, damaged:false}; UI.pick = null; completeRoom(); } break;
    case 'skipPart': UI.pick = null; completeRoom(); break;
    case 'rest':
      if(UI.pick === 'repair'){ S.run.body = Math.min(S.run.bodyMax, S.run.body + 15); for(const p of SLOTS) S.run.parts[p.id].damaged = false; completeRoom(); }
      else if(UI.pick === 'defrag'){ UI.pick = null; UI.back = 'rest'; showDefrag(); }
      break;
    case 'backDefrag': UI.pick = null; if(UI.back === 'shop') showShop(); else if(UI.back === 'event') showEventRoom(); else { UI.pick = 'defrag'; showRest(); } break;
    case 'del': if(UI.pick){ const i = S.run.deck.indexOf(UI.pick); if(i >= 0) S.run.deck.splice(i, 1); UI.pick = null; if(UI.back === 'shop'){ S.run.scrap -= DATA.shop.defrag; showShop(); } else completeRoom(); } break;
    case 'buy': {
      const pk = UI.pick, sh = DATA.shop, run = S.run; if(!pk) break;
      if(pk[0] === 'c'){ const i = +pk.slice(1), k = UI.offers[i]; if(!k || run.scrap < price(k)) break; run.scrap -= price(k); run.deck.push(k); UI.offers[i] = null; UI.pick = null; showShop(); }
      else if(pk === 'repair'){ if(run.scrap < sh.repairCost) break; run.scrap -= sh.repairCost; run.body = Math.min(run.bodyMax, run.body + sh.repairBody); for(const p of SLOTS) run.parts[p.id].damaged = false; UI.pick = null; showShop(); }
      else if(pk === 'defrag'){ if(run.scrap < sh.defrag) break; UI.pick = null; UI.back = 'shop'; showDefrag(); }
      break;
    }
    case 'leave': completeRoom(); break;
    case 'choose': { if(UI.pick == null) break; const ev = DATA.events.find(e => e.id === UI.eventId); const fx = ev.choices[+UI.pick].fx; UI.pick = null; applyEvent(fx); break; }
    case 'done': completeRoom(); break;
  }
}

  const c = ev.target.closest('#hand .card[data-i]'), f = ev.target.closest('.foe[data-f],.fi[data-f]');

  if(swipe && Math.hypot(ev.clientX - swipe.x, ev.clientY - swipe.y) > 10) clearTimeout(lpTimer);
});
stage.addEventListener('pointerup', ev => {
  clearTimeout(lpTimer);
  if(!swipe) return;
  const dy = ev.clientY - swipe.y, dx = ev.clientX - swipe.x, s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
  swipe = null;
  if(inBattle() && $('#ov').hidden && !busy && !UI.focus && Math.abs(dy) > 34 * s && Math.abs(dy) > Math.abs(dx) * 1.3){
    let v = UI.view;
    if(dy < 0) v = v === 'self' ? 'normal' : v === 'normal' ? 'hand' : v;
    else v = v === 'hand' ? 'normal' : v === 'normal' ? 'self' : v;
    if(v !== UI.view){ UI.view = v; if(v === 'self'){ sel = null; PV = null; } renderAll(); }
    swallow = true; setTimeout(() => { swallow = false; }, 350);
  }
});
['pointercancel','pointerleave'].forEach(n => stage.addEventListener(n, () => { clearTimeout(lpTimer); }));
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('click', ev => {
  if(longFired){ longFired = false; return; }
  if(swallow){ swallow = false; return; }
  const t = ev.target, a = t.closest('[data-act]');
  if(a && !a.disabled){ act(a.dataset.act, a.dataset.arg, a); return; }
  if(!$('#ov2').hidden){ if(t === $('#ov2')) hideOv2(); return; }
  const ov = $('#ov');
  if(!ov.hidden){ if(t === ov && ov.dataset.closable) hideOv(); return; }
  if(UI.focus){ if(!t.closest('#focus')) closeFocus(); return; }
  if(!inBattle() || busy || UI.view === 'self') return;
  const card = t.closest('#hand .card[data-i]'); if(card){ onCard(+card.dataset.i); return; }
  if(t.closest('#redraw')){ onRedraw(); return; }
  if(t.closest('#waitBtn')){ onWait(); return; }
  const f = t.closest('[data-f]'); if(f){ onFoe(+f.dataset.f); return; }
  const p = t.closest('#parts .part'); if(p){ infoPart(p.dataset.p); return; }
  if(t.closest('.pile')){ infoDeck(); return; }
  if(sel){ sel = null; PV = null; renderAll(); }
});

function fit(){
  const w = $('#wrap');
  document.documentElement.style.setProperty('--s', Math.max(0.2, Math.min(w.clientWidth / 844, w.clientHeight / 390)));
}
addEventListener('resize', fit);
// ボタンにフォーカスが移ったときなどに、画面がずれないようにする
for(const el of [$('#wrap'), stage]) el.addEventListener('scroll', () => { el.scrollTop = 0; el.scrollLeft = 0; });
fit();
buildStatic();
dbgLoad(); applyEcon();
newRun();
showRules(true);
</script>
<script>
// オフライン用のサービスワーカー登録
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
